# ⚡ Giáo trình Điện cơ bản
## 🔌 1. Sử dụng một số thiết bị đo điện
### 🔌 Đồng hồ vạn năng: tính năng và nguyên tắc dùng
### 🧮 Công thức đọc kết quả
### 🛡️ Mêgôm mét: đo điện trở cách điện
### 📝 Tóm tắt
- Vạn năng: đo U song song, đo I nối tiếp, đo R khi mất điện.
- Chưa biết trị số thì đặt giới hạn lớn nhất rồi giảm.
- Số chỉ quy đổi: U = Ugh × αđo / αmax.
- Mêgôm mét: đo điện trở cách điện; Rcđ > 0,5 MΩ là tốt.
## 🧯 2. Lắp đặt, thay thế, sửa chữa thiết bị điện gia đình
### 🧯 Cầu chì
### 🔪 Cầu dao
### 🛡️ Áptômát (CB)
### 💡 Công tắc, ổ cắm và đèn
### 📝 Tóm tắt
- Cầu chì: Idc ≥ Itt và Idc ≤ 0,8 Icp; chọn lọc theo cấp.
- Cầu dao đóng cắt dứt khoát; lưỡi dao phụ giúp dập hồ quang.
- Áptômát bảo vệ quá tải/ngắn mạch; nhảy liên tục cần khoanh vùng nguyên nhân.
- Luôn cắt điện và thử bút thử điện trước khi thay công tắc, ổ cắm.
## 🌀 3. Tháo, lắp, kiểm tra và bảo dưỡng động cơ không đồng bộ một pha
### 🌀 Từ trường quay từ hai dòng điện lệch pha
### ⚙️ Động cơ một pha có tụ điện
### 📉 Tổn hao và hiệu suất
### 🔧 Thực hành: tháo – kiểm tra – lắp quạt trần
### 📝 Tóm tắt
- Hai dòng lệch pha 90° trong hai cuộn lệch 90° tạo từ trường quay.
- Tụ điện giúp cuộn mở máy lệch pha; sau đó có thể ngắt.
- η = P₂/P₁, tổn hao gồm sắt, đồng, ma sát.
- Tháo lắp quạt: cắt điện, đánh dấu, đo cách điện và tụ.
## 🏗️ 4. Tháo, lắp, kiểm tra và bảo dưỡng động cơ không đồng bộ ba pha
### 🏗️ Cấu tạo và nguyên lý
### 🚀 Mở máy động cơ lồng sóc
### 🎛️ Điều chỉnh tốc độ
### 🔧 Thực hành: tháo – lắp và xác định cực tính
### 📝 Tóm tắt
- Ba cuộn stator lệch 120°; từ trường quay n₁ = 60f/p; rôto quay chậm hơn.
- Độ trượt S = (n₁ − n₂)/n₁, S = 1 lúc mở máy.
- Mở máy trực tiếp, sao–tam giác, tự ngẫu, cuộn kháng, biến trở rôto.
- Đổi p, điện áp, hoặc điện trở rôto để điều chỉnh tốc độ.
- Cực tính: đo điện trở tìm pha; nối tiếp hai cuộn + đèn.
## 🧲 5. Mạch điều khiển động cơ một pha, ba pha bằng khởi động từ đơn
### 🧲 Công tắc tơ
### 🌡️ Rơ le nhiệt và khởi động từ
### 🔁 Mạch mở máy – dừng có tự duy trì
### 🧮 Tính chọn thiết bị
### 📝 Tóm tắt
- Công tắc tơ: cuộn dây có điện → tiếp điểm chính đóng.
- Rơ le nhiệt bảo vệ quá tải, không bảo vệ ngắn mạch.
- Khởi động từ = công tắc tơ + rơ le nhiệt.
- Tự duy trì bằng tiếp điểm phụ thường mở song song nút M.
- Chọn thiết bị theo U và I của phụ tải.
## 🔀 6. Mạch đảo chiều quay động cơ ba pha bằng khởi động từ kép
### 🔀 Ý tưởng: đảo hai pha, liên động hai lớp
### ⚙️ Nguyên lý hoạt động
### 🧮 Tính chọn và dự trù vật tư
### 📝 Tóm tắt
- Đảo chiều = đổi chỗ hai pha bằng công tắc tơ ngược.
- Liên động cơ (nút ấn kép) và liên động điện (tiếp điểm thường đóng) ngăn đóng cả hai công tắc tơ.
- Đèn báo: xanh thuận, vàng ngược, đỏ dừng.
## 💧 7. Mạch điều khiển máy bơm nước một pha tự động
### 💧 Mạch và nguyên lý
### 🧮 Tính chọn
### 📝 Tóm tắt
- Phao đóng khi nước thấp → bơm chạy; phao mở khi nước cao → bơm dừng.
- Công tắc tay cho điều khiển thủ công.
- ATM bảo vệ ngắn mạch, RN bảo vệ quá tải.
## 🚪 8. Mạch điều khiển động cơ đóng, mở cửa rào, cửa cuốn
### 🚪 Mạch và công tắc hành trình
### 🧮 Tính chọn
### 📝 Tóm tắt
- Cửa cuốn = đảo chiều + hai công tắc hành trình.
- Hành trình cắt cuộn dây ở cuối đường.
- Nút kép + tiếp điểm liên động vẫn bắt buộc.
## 🧲 9. Mạch bảo vệ mất pha và hãm động cơ
### 🧲 Rơ le điện từ
### 🔌 Bảo vệ mất pha
### 🛑 Hãm động năng
### 📝 Tóm tắt
- Rơ le điện từ dùng nam châm điện đổi trạng thái tiếp điểm.
- RU0 mở tiếp điểm điều khiển khi mất pha.
- Hãm động năng đưa DC vào stator trong thời gian đặt trước.
- Luôn liên động giữa mạch xoay chiều và một chiều.
