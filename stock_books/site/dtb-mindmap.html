# 📟 The Day Trader's Bible
## 📜 1. Giới thiệu: đọc băng giá (tape reading)
### 📜 Đọc băng là gì?
### 🧠 Phẩm chất cần có
### 🔇 Môi trường làm việc và tin tức
### 📝 Tóm tắt
- Đọc băng: diễn giải giao dịch từng giây để đoán chiều thị trường.
- Thành công phụ thuộc phẩm chất tinh thần và kỷ luật nhiều hơn vốn.
- Tự lập, hiểu thị trường, chịu được thua lỗ, tập trung.
- Tin tức ghi lại điều đã xảy ra; băng giá cho tín hiệu sớm hơn.
## 🧪 2. Bắt đầu học đọc băng
### 🧪 Học trên giấy và học bằng tiền thật
### ⚡ Loại lệnh
### 🎯 Chọn cổ phiếu để giao dịch
### 📝 Tóm tắt
- Bắt đầu thật nhưng lô nhỏ để học kiểm soát cảm xúc.
- Lệnh thị trường phù hợp với đọc băng (bối cảnh 1919).
- Cổ phiếu giá cao dao động nhiều điểm hơn.
- Tập trung 1–2 cổ phiếu và nghiên cứu "tính cách" của chúng.
## 🦴 3. Phân tích danh sách cổ phiếu và các nhóm
### 🦴 Cổ phiếu dẫn đầu là "xương sống"
### 🧍 Thị trường như một cơ thể
### 🧱 Các nhóm cổ phiếu
### 📝 Tóm tắt
- Cổ phiếu dẫn đầu cho biết hướng thị trường; nhưng phải xem cả thị trường.
- Phân phối thường xảy ra dưới sự che chở của sức mạnh của cổ phiếu dẫn đầu.
- Các cổ phiếu cùng nhóm ảnh hưởng nhau nhưng không tự kéo cả thị trường.
- Cổ phiếu thứ cấp bắt đầu tăng thường khi dẫn đầu sắp hết đà.
## 💸 4. Quy tắc giao dịch
### 💸 Chi phí cố định của mỗi giao dịch
### 🛑 Lệnh dừng (stop order)
### 🎼 Ví dụ: một buổi trưa của người đọc băng
### 📝 Tóm tắt
- Mỗi giao dịch có chi phí cố định; phải tính vào giá vốn.
- Lệnh dừng là hàng rào bảo vệ khi bạn rời băng hoặc giữ qua đêm.
- Mức lỗ tối đa quen dùng khoảng 2 điểm (tùy ý).
- Tín hiệu có thể đến từ cổ phiếu khác ngoài cổ phiếu bạn giao dịch.
## ⚖️ 5. Khối lượng và ý nghĩa của chúng
### ⚖️ Thị trường là cán cân giữa mua và bán
### 🕵️ Người ta gom hàng kín đáo như thế nào?
### 🧱 Thao túng ba giai đoạn và giới hạn của phương pháp
### 📝 Tóm tắt
- Thị trường = cặp giá mua–bán; khối lượng cho biết bên nào mạnh hơn.
- Tay to che giấu việc gom hàng bằng lô nhỏ và hạ giá.
- Ba giai đoạn thao túng: tích lũy, đẩy giá, phân phối.
- Khối lượng không phải công thức chắc chắn.
## 🔬 6. Kỹ thuật thị trường
### 🔬 Khoan thử thị trường để biết ai đang nắm cổ phiếu
### 🧨 Mức cực đoan thường báo hiệu kết thúc
### 📏 Nhịp điều chỉnh bình thường
### 📝 Tóm tắt
- Sức mạnh kỹ thuật: cổ phiếu chống chịu cú sốc nằm trong tay vững.
- Đợt dao động cực mạnh thường báo hiệu điểm kết thúc xu hướng.
- Điều chỉnh bình thường và hồi khoảng nửa mức giảm là các điểm tham chiếu.
- Không dùng tham chiếu như quy luật.
## 🕰️ 7. Thị trường trầm lắng và cơ hội của nó
### 🕰️ Vì sao thị trường trầm lắng?
### 🧭 Đoán hướng nhịp tiếp theo
### 📐 Giao dịch ở vùng kháng cự
### 🎯 Giao dịch cổ phiếu đang tạm hoạt động
### 📝 Tóm tắt
- Thị trường trầm lắng báo trước một nhịp mạnh nhưng chưa rõ chiều.
- Sức mạnh/yếu kỹ thuật gợi ý hướng.
- Tác giả không khuyên lướt từng phân số trong thị trường lặng.
- Giao dịch cổ phiếu đang tạm sôi động thay vì cố ép giao dịch.
## ⚔️ 8. Dùng biểu đồ làm kim chỉ nam
### ⚔️ Người chơi biểu đồ và người đọc băng
### 🔢 Biểu đồ hình số (figure chart)
### ⚠️ Giới hạn của biểu đồ
### 📝 Tóm tắt
- Chart player dựa vào lịch sử, tape reader dựa vào hiện tại.
- Biểu đồ hình số giúp phát hiện tích lũy/phân phối.
- Biểu đồ cho hướng, băng giá cho thời điểm.
- Biểu đồ đơn một mã có thể đánh lừa vì mọi cổ phiếu tác động lẫn nhau.
## 🧻 9. Giao dịch trong ngày và giao dịch dài hạn
### 🧻 Ẩn dụ tờ giấy thấm
### 🔄 Ví dụ ngày 21/12/1908: sai hai lần vẫn lãi
### ⚖️ Vừa giữ dài hạn vừa giao dịch ngày?
### 🧱 Mục tiêu: lãi nhỏ đều đặn và tăng quy mô dần
### 📝 Tóm tắt
- Hấp thụ, bão hòa, phân phối, thanh lý — các lực đối lập của thị trường.
- Sẵn sàng đổi vị thế khi tín hiệu đổi.
- Chơi một phía hoặc sạch sổ cuối ngày.
- Mục tiêu: lợi nhuận nhỏ đều đặn, tăng lô theo vốn.
## 🚦 10. Các ví dụ và gợi ý khác
### 🚦 Đừng đo nhịp lớn từ những dao động đầu
### 🧪 Khối lượng khổng lồ trong biên độ nhỏ: thao túng
### 👥 Thị trường có công chúng và không có công chúng
### 📝 Tóm tắt
- Đừng đoán quy mô nhịp từ dao động đầu.
- Khối lượng lớn trong biên độ nhỏ thường là thao túng.
- Cần xác nhận phá biên bằng khối lượng tăng dần.
- Thị trường đông công chúng: dao động lớn nhưng khớp lệnh tệ.
## 📈 11. Những trở ngại và lợi nhuận tiềm năng
### 📈 Lợi nhuận tiềm năng: bảng tính tăng quy mô
### 🧗 Trở ngại: khớp lệnh, chi phí và bản thân
### 🧘 Luyện bản thân
### 📝 Tóm tắt
- Lãi nhỏ đều + tăng quy mô theo vốn tạo ra tổng lớn (trên giấy).
- Giới hạn rủi ro mỗi giao dịch trong phân số điểm.
- Nâng lệnh dừng để loại trừ khả năng lỗ.
- Tập trung vào kiểm soát bản thân hơn lãi/lỗ trong ngày.
## 🚪 12. Đóng giao dịch (quan trọng như mở giao dịch)
### 🚪 Vào đúng chưa đủ: phải ra đúng
### 📈 Chuyển động nở rộng khi đến cuối
### 🙋 Lời nhắn về bạn
### 📝 Tóm tắt
- Đóng giao dịch quan trọng như mở giao dịch.
- Thoát khi nhịp tức thời đạt đỉnh, thường kèm bid ồn ào hoặc khối lượng bùng nổ.
- Phương pháp phải do chính bạn xây qua thực hành.
- "Chân lạnh" sau chuỗi lỗ là trở ngại lớn nhất.
## 📒 13. Hai ngày giao dịch: ví dụ áp dụng phương pháp
### 📒 Bản ghi hai ngày
### 📝 Tóm tắt
- Hai phiên, 15 giao dịch, rủi ro mỗi giao dịch rất nhỏ.
- Lệnh dừng sát bảo vệ nhưng có thể bị quét.
- Kết quả tự công bố, chưa tính chi phí.
## 🔭 14. Áp dụng các nguyên tắc cho giao dịch dài hạn hơn
### 🔭 Cùng một nguyên lý, khung thời gian khác
### 🏗️ Chuẩn bị – thực hiện – kết thúc
### ⚖️ Dữ liệu cơ bản hay hành động thị trường?
### 📝 Tóm tắt
- Nguyên lý đọc giá–khối lượng áp dụng cho nhiều khung thời gian.
- Mỗi chuyển động có chuẩn bị, thực hiện, kết thúc.
- Chuẩn bị lâu thì nhịp lớn.
- Wyckoff đặt hành động thị trường lên trên dữ liệu cơ bản.
