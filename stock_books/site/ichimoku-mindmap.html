# ☁️ Giao dịch với Ichimoku
## 🌅 1. Lý thuyết – Cấu tạo của Ichimoku
### 🌅 Ichimoku là gì?
### ⚙️ Thông số 9 – 26 – 52
### 🧮 Cách tính: quy tắc “trung điểm”
### 🔴 Tenkan Sen – Đường chuyển đổi (9)
### 🔵 Kijun Sen – Đường chuẩn (26)
### ☁️ Mây Kumo – Senkou Span A & B
### 🟣 Lagging Span (Chikou Span) – “Bộ nhớ” thị trường
### 🕰️ Không gian thời gian & tổng kết
### 📝 Tóm tắt
- Ichimoku Kinko Hyo = “cân bằng nhìn trong một cái liếc mắt”, do Goichi Hosoda sáng tạo, là chỉ báo xu hướng.
- Dùng thông số gốc 9-26-52; đổi thông số làm hệ thống kém chính xác.
- Tenkan, Kijun, SSB đều là trung điểm (cao nhất + thấp nhất)/2 của 9, 26, 52 nến; SSA = (Tenkan + Kijun)/2.
- Mây (SSA–SSB) được chiếu tới trước 26 nến; xanh khi SSA > SSB, đỏ khi SSB > SSA; twist = hai đường cắt nhau.
- Lagging Span = giá đóng cửa dịch lùi 26 nến, là “bộ nhớ” để xác nhận và đánh giá tiềm năng.
- Các đường phải được đọc cùng nhau chứ không tách rời.
## 👁️ 2. Đọc biểu đồ Ichimoku
### 👁️ Nguyên tắc: đọc cùng lúc, không đọc rời
### ☁️ Đọc mây: giá ở đâu so với mây?
### 🔮 Mây tương lai & Twist
### 🔴 Đọc Tenkan Sen
### 🔵 Đọc Kijun Sen
### 🟣 Đọc Lagging Span
### ✅ Quy trình đọc một biểu đồ
### 📝 Tóm tắt
- Đọc 5 đường đồng thời, ưu tiên mây trước tiên.
- Giá trên mây = tăng, dưới mây = giảm, trong mây = cân bằng/bất định.
- Mây tương lai chỉ là kết quả của giá hiện tại; twist là chỗ mây mỏng, giá dễ xuyên và là vùng cần theo dõi.
- Tenkan: độ dốc = sức mạnh; bị phá = cảnh báo.
- Kijun: bật = chỉ nghỉ ngắn; phá = xu hướng mới (nếu không bị vô hiệu hoá); giá xa Kijun sẽ có xu hướng quay lại.
- Lagging Span đối mặt vật cản quá khứ; phải phân tích cùng giá để đánh giá tiềm năng và xác nhận tín hiệu.
