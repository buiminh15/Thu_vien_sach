# 📊 Các khái niệm cơ bản về kinh tế
## 📖 1. Nhập môn: kinh tế học nghiên cứu điều gì?
### 📖 Định nghĩa kinh tế học (bài 1)
### 🧭 Các chuyên ngành kinh tế (bài 2)
### ✋ Bàn tay vô hình (bài 3)
### ⚖️ Chi phí cơ hội (bài 4)
### 📝 Tóm tắt
- Kinh tế học = nghiên cứu phân bổ hiệu quả nguồn lực khan hiếm cho các mục tiêu thay thế nhau → còn gọi là “nghiên cứu về sự lựa chọn”.
- Nguồn lực khan hiếm: vốn, lao động, đất đai (đôi khi thêm tinh thần khởi nghiệp). Phân bổ hiệu quả = chi phí thấp nhất cho cùng sản lượng.
- Vi mô: từng tác nhân & từng thị trường. Vĩ mô: tăng trưởng, lạm phát, thất nghiệp, tỷ giá của cả nền kinh tế.
- Bàn tay vô hình (Adam Smith): tư lợi cá nhân + giá cả dẫn nguồn lực tới nơi giá trị cao nhất.
- Chi phí cơ hội = giá trị phương án thay thế tốt nhất bị bỏ qua; lợi nhuận kinh tế = lợi nhuận kế toán − chi phí cơ hội.
## 🛒 2. Cung, cầu và cân bằng thị trường
### 🛒 Thị trường, cầu và cung (bài 5)
### 🔄 Thị trường tự điều chỉnh về cân bằng (bài 6)
### ↔️ Cầu dịch chuyển và cung dịch chuyển (bài 7–8)
### 📝 Tóm tắt
- Thị trường = tương tác giữa cầu và cung (không nhất thiết là một địa điểm). Luật cầu: giá ↑ lượng cầu ↓; luật cung: giá ↑ lượng cung ↑.
- Cân bằng: lượng cầu = lượng cung. Giá thấp hơn → thiếu hụt → giá tăng; giá cao hơn → dư thừa → giá giảm.
- Cầu tăng (thu nhập ↑, hàng thay thế đắt lên) → giá ↑ và lượng ↑. Hàng bổ sung đắt lên → cầu giảm.
- Giá đầu vào ↑ → cung giảm → giá ↑, lượng ↓. Công nghệ tốt/đầu vào rẻ → cung tăng → giá ↓, lượng ↑.
- Giả định ceteris paribus: chỉ đổi một biến, giữ nguyên các biến còn lại.
## 🏍️ 3. Thị trường phân bổ nguồn lực và phúc lợi
### 🏍️ Các nhà kinh tế học yêu thích xe máy (bài 9)
### 🎯 Thị trường và sự phân bổ nguồn lực (bài 10)
### 💰 Thặng dư và phúc lợi (bài 11–13)
### 📝 Tóm tắt
- Một cú sốc thực tế (xe máy) là tổng của nhiều dịch chuyển cầu/cung: thu nhập tăng, hàng nhập khẩu giá rẻ, thuế linh kiện.
- Giá hướng nguồn lực (lao động, vốn, đất đai) tới hàng hóa người tiêu dùng muốn; cầu giảm thì nguồn lực được giải phóng sang việc khác.
- CS = vùng dưới đường cầu, trên giá cân bằng; PS = vùng trên đường cung, dưới giá cân bằng; SB = CS + PS.
- SB đạt tối đa tại cân bằng thị trường; sản lượng thấp hơn hay cao hơn đều gây tổn thất vô ích.
- Kết quả này dựa trên giả định thị trường cạnh tranh, không méo mó.
## 🌫️ 4. Ngoại tác và chi phí toàn bộ
### 🌫️ Ngoại tác và chi phí toàn bộ (bài 14)
### 🧾 “Nội hóa” ngoại tác (bài 15)
### 📝 Tóm tắt
- Ngoại tác = chi phí/lợi ích rơi vào bên thứ ba ngoài giao dịch; tiêu cực (ô nhiễm) hoặc tích cực.
- Người tiêu dùng chỉ thấy chi phí tư nhân; hiệu quả cần xét chi phí toàn bộ = chi phí tư nhân + chi phí xã hội.
- Ngoại tác tiêu cực khiến nguồn lực bị phân bổ quá mức cho ngành (vd quá nhiều xe máy).
- “Nội hóa” ngoại tác bằng thuế/hạn chế làm cung dịch trái, giảm sản lượng, giảm ô nhiễm; tiền thuế có thể dùng khắc phục hậu quả.
- Thuế lý tưởng bằng đúng chi phí ngoại tác biên.
## 🌾 5. Phân tích cận biên và độc quyền
### 🌾 Phân tích cận biên: năng suất biên giảm dần (bài 16)
### 📈 Chọn sản lượng tối đa hóa lợi nhuận: MC = MR (bài 17)
### 👑 Độc quyền: vì sao tồn tại và cách kiểm soát (bài 18–19)
### 📝 Tóm tắt
- Phân tích cận biên: xét tác động của việc làm thêm một đơn vị. Năng suất biên giảm dần là quy luật phổ biến.
- Chi phí biên MC thường tăng vì năng suất biên giảm; với người bán chấp nhận giá, MR = giá.
- Lợi nhuận tối đa khi MC = MR (ví dụ 57 tạ lúa).
- Độc quyền do bằng sáng chế/nguồn lực chiến lược, giấy phép nhà nước, hoặc độc quyền tự nhiên; đặt giá cao hơn MC và hạn chế sản lượng.
- Kiểm soát: tăng cạnh tranh, đánh thuế lợi nhuận phụ trội, kiểm soát giá; nhưng cần tính ngoại tác tiêu cực.
## 🎲 6. Rủi ro, bất định và thông tin bất cân xứng
### 🎲 Bất định và rủi ro (bài 20)
### ✈️ Định giá rủi ro: nghề phi công (bài 21)
### 🍋 Thông tin bất cân xứng và lựa chọn đối nghịch (bài 22)
### 📡 Phát tín hiệu và sàng lọc (bài 23–24)
### 🤝 Người ủy nhiệm – người thừa hành (bài 25)
### 📝 Tóm tắt
- Bất định: có nhiều kết quả; rủi ro đo được khi có thể gán xác suất. Con người thường đánh giá sai rủi ro (lạc quan quá mức, hoảng loạn).
- Phần bù rủi ro (lương cao hơn cho nghề nguy hiểm) cho phép suy ra giá trị ngầm của mạng sống (ví dụ phi công ≈ 8,8 triệu USD).
- Thông tin bất cân xứng gây lựa chọn đối nghịch: hàng kém đẩy hàng tốt ra khỏi thị trường (bài toán xe “lemon”).
- Phát tín hiệu (bảo hành, bằng cấp) do bên biết thông tin thực hiện; sàng lọc (các gói bảo hiểm) do bên chưa biết thiết kế.
- Vấn đề người ủy nhiệm – người thừa hành: rủi ro đạo đức và xung đột lợi ích; giám sát trực tiếp tốn kém.
## 🏭 7. Giá chuyển giao nội bộ và gánh nặng thuế
### 🏭 Định giá chuyển giao nội bộ (bài 26)
### 🔄 Mặt trái của chuyển giá (bài 27)
### 🚗 Ai chịu thuế? Ví dụ giá ô tô (bài 28)
### 📝 Tóm tắt
- Giá chuyển giao là giá “mua bán” nội bộ giữa các công ty con của một tập đoàn; thường dùng để giảm thuế bằng cách chuyển lợi nhuận về nước thuế thấp (ví dụ tiết kiệm 20.000 USD).
- Chính phủ khó kiểm soát; ví dụ Nissan bị Mỹ phạt 170 triệu USD, Coca-Cola bị Nhật phạt 150 triệu USD.
- Nước đang phát triển thường thua: bị thổi phồng giá đầu vào/hạ giá đầu ra; thiếu năng lực tính giá độc lập, khó kiểm dịch vụ/bản quyền.
- Nguyên tắc giá độc lập (arm’s length) là biện pháp chính nhưng cần thông tin và chuyên môn.
- Gánh nặng thuế được chia theo độ nhạy của cầu và cung; chỉ khi cầu không nhạy (hoặc cung hoàn toàn co giãn) thì người mua gánh toàn bộ.
## 🎁 8. Kinh tế học trong đời sống và các cú sốc
### 🎁 Kinh tế học quà biếu (bài 29)
### 🧵 Guanxi: sợi dây ràng buộc (bài 30)
### 🚆 Vé về quê – định giá giờ cao điểm (bài 31)
### 😷 Nhìn lại đại dịch SARS (bài 32)
### 💡 Giá trị kinh tế nghĩa là gì? (bài 33)
### 📝 Tóm tắt
- Quà biếu làm tăng độ thỏa dụng cho cả hai bên nhưng thường gây tổn thất vô ích (~10% chi tiêu quà); quà cho người thân, tiền/phiếu cho người khác hiệu quả hơn.
- Guanxi vừa có thể là vốn xã hội và công cụ sàng lọc, vừa dễ thành tham nhũng và chủ nghĩa thân hữu; cần khung pháp lý vững.
- Định giá giờ cao điểm giảm và dời cầu, đồng thời kích thích tăng cung (vé Tết).
- SARS: dù số ca nhỏ vẫn gây thiệt hại lớn (VN: 120.000 việc làm, 220 triệu USD GDP) qua du lịch – thương mại.
- Giá trị kinh tế của dự án = diện tích dưới đường cầu và cung giữa lượng mới và cân bằng cũ, chia cho sản lượng; phản ánh lợi ích ròng xã hội.
## 📊 9. Đo lường nền kinh tế và chính sách vĩ mô
### 📊 GDP và những điều nó không cho thấy (bài 34)
### 🏛️ Chính sách tài khóa (bài 35)
### 🏦 Chính sách tiền tệ (bài 36)
### 📝 Tóm tắt
- GDP là giá trị thị trường các hàng hóa, dịch vụ cuối cùng; tăng trưởng thực loại bỏ lạm phát. GDP che giấu bất bình đẳng giữa ngành/vùng/nhóm và không trừ ô nhiễm, tắc nghẽn.
- Tăng trưởng, lạm phát và thất nghiệp liên quan với nhau; cải thiện chỉ số này có thể làm xấu chỉ số khác.
- Tài khóa (chính phủ): mở rộng khi chậm lại, thắt chặt khi nóng; có hiệu ứng lan tỏa.
- Tiền tệ (ngân hàng trung ương): giảm lãi suất kích thích đầu tư, nhưng quá nhiều tiền gây lạm phát.
## 🍜 10. Lạm phát, giảm phát và giá trị thực
### 🍜 Lạm phát và cách đo (bài 37)
### 📉 Giảm phát: tốt hay xấu? (bài 38)
### ⚖️ Can thiệp hay không can thiệp? (bài 39)
### 🍵 Danh nghĩa và thực (bài 40)
### 📝 Tóm tắt
- CPI đo giá rổ hàng tiêu dùng đại diện; chỉ số giảm phát GDP bao quát cả hàng tư liệu sản xuất. Một món hàng đắt lên chưa chắc là lạm phát.
- Siêu lạm phát, giảm lạm phát, giảm phát là các tình huống khác nhau.
- Giảm phát tốt khi do cạnh tranh và năng suất; xấu khi giá giảm mà doanh số không tăng; tệ nhất khi cung vượt cầu cộng nợ vay.
- Tranh luận can thiệp vs thụ động; cả hai đồng ý chính phủ phải cung cấp thể chế tốt.
- Lãi suất thực = lãi danh nghĩa − lạm phát.
## 💱 11. Tỷ giá hối đoái: danh nghĩa, thực và các chế độ
### 💱 Tỷ giá danh nghĩa (bài 41)
### 🏁 Tỷ giá thực và sức cạnh tranh (bài 42)
### 🔒 Tỷ giá cố định (bài 43)
### 🌊 Tỷ giá thả nổi (bài 44)
### 📝 Tóm tắt
- Tỷ giá là giá của một đồng tiền theo đồng tiền khác; “mất giá” khi cần nhiều nội tệ hơn cho một ngoại tệ.
- Tỷ giá thực = tỷ giá danh nghĩa điều chỉnh theo chênh lệch lạm phát; cho thấy sức cạnh tranh tốt hơn.
- Cố định: ổn định, dễ dự đoán nhưng rủi ro khi lạm phát cao (định giá quá cao).
- Thả nổi: tự ổn định, tự chủ tiền tệ nhưng bất định.
## 🇨🇳 12. Tỷ giá, đồng nhân dân tệ và khủng hoảng tài chính
### 🇨🇳 Nhân dân tệ bị định giá thấp (bài 45)
### 🇹🇭 Thái Lan 1997: neo có điều chỉnh (bài 46)
### 🎭 Hồng Kông và màn “đánh đôi” đầu cơ (bài 47)
### 📝 Tóm tắt
- Trung Quốc duy trì NDT thấp để bảo vệ xuất khẩu, gây sức ép từ Mỹ; đồng thời tạo bong bóng thanh khoản trong nước.
- Thái Lan 1997: neo có điều chỉnh tạo ảo tưởng an toàn; vay ngoại tệ + thu bằng baht + dự trữ thấp → khủng hoảng.
- Sau khủng hoảng: Thái thả nổi có quản lý; Malaysia neo lại; Trung Quốc, Hồng Kông giữ neo.
- Hồng Kông (currency board) bẻ gãy cú đánh đôi bằng tăng lãi suất và mua cổ phiếu.
## 🛡️ 13. Công nghiệp hóa, công nghệ và năng lực cạnh tranh
### 🛡️ Hai chiến lược công nghiệp hóa (bài 48–49)
### 🔧 Chính sách công nghệ cho tăng trưởng (bài 50)
### 🛣️ Hạ tầng mềm (bài 51)
### 🏆 Năng lực cạnh tranh: quốc gia và doanh nghiệp (bài 52)
### 📝 Tóm tắt
- Bảo hộ dễ thành thói quen, đẩy công nghiệp hóa vào chi phí cao và đình trệ (Ấn Độ, Brazil).
- Công nghiệp hóa bằng xuất khẩu: cạnh tranh, đổi mới, quy mô, cụm cung ứng; hiệp định AFTA, BTA, WTO đòi bảo hộ vừa phải.
- Công nghệ cứng và mềm; chính phủ thúc đẩy bằng giáo dục, cạnh tranh, luật pháp; độc quyền ít nâng cấp.
- Hạ tầng mềm quyết định hiệu quả của hạ tầng cứng.
- Cạnh tranh của quốc gia khác doanh nghiệp: không bị “đào thải” như doanh nghiệp.
## 🔀 14. Viện trợ, FDI và đo lường hiệu quả công
### 🔀 Tính thay thế được của tiền viện trợ (bài 53)
### 💰 Viện trợ nước ngoài: những điều cần biết (bài 64)
### 🧲 FDI và khối lượng tới hạn (bài 54)
### 📏 Đo lường hiệu quả so sánh (bài 55)
### 📝 Tóm tắt
- Tiền viện trợ có tính thay thế được: nguồn lực của nước nhận được giải phóng sang việc khác.
- ODA: giải ngân thấp hơn cam kết (VN 47%), gồm cả vay ưu đãi (yếu tố cho không ≥25%), viện trợ ràng buộc giảm giá trị 25%.
- Khối lượng tới hạn: cụm công nghiệp, dịch vụ, lao động, tiện ích tự củng cố thu hút FDI; các tỉnh khác phải tạo lợi thế động.
- CPM giúp chính quyền so sánh, học hỏi, minh bạch; tăng hiệu quả chi tiêu thay vì tăng thuế.
## 🏷️ 15. Bán phá giá và thương mại công bằng
### 🏷️ Bán phá giá là gì? (bài 56)
### 🦈 Phá giá triệt hạ (bài 57)
### 🌍 Phân biệt giá quốc tế và phá giá (bài 58)
### ⚖️ Giá trị công bằng: kinh tế thị trường và phi thị trường (bài 59)
### 📝 Tóm tắt
- Bán phá giá: bán ở nước ngoài dưới giá trị công bằng (giá nội địa hoặc chi phí sản xuất).
- Phá giá triệt hạ nhằm đuổi đối thủ để độc quyền; nhưng thực tế hiếm khả thi vì đối thủ mới sẽ vào lại.
- Phân biệt giá quốc tế đòi hỏi sức mạnh độc quyền trong nước; tổn thất rơi vào người tiêu dùng trong nước, nước nhập khẩu được lợi giá thấp.
- Nền kinh tế phi thị trường bị dùng giá nước thứ ba; cách chống đỡ là chứng minh hiệu quả sản xuất.
## 🌐 16. Toàn cầu hóa, tài nguyên, vàng và quy tắc 72
### 🌐 Toàn cầu hóa (bài 60–61)
### 🌳 Tài nguyên thiên nhiên và phát triển (bài 62)
### 🥇 Xu hướng giá vàng (bài 63)
### ⏱️ Quy tắc 72 (bài 65)
### 📝 Tóm tắt
- Toàn cầu hóa là sự hội nhập của hàng hóa, vốn, thông tin, con người; có người thắng kẻ thua nhưng không tham gia còn tệ hơn.
- Tài nguyên thiên nhiên là vốn; khai thác quá mức gây thiệt hại 8–10% GDP (Ấn Độ, Trung Quốc); giải pháp “người gây ô nhiễm phải trả”.
- Giá vàng tăng vì thiếu lựa chọn lưu giữ của cải an toàn khi USD, yên, euro đều có điểm yếu.
- Quy tắc 72: số năm gấp đôi ≈ 72 ÷ tốc độ tăng trưởng (%).
## ⛽ 17. Thuế cơ bản: nêm thuế, thuế trực thu – gián thu, thu nhập
### ⛽ Thuế làm lệch thị trường (bài 66)
### 🧾 Thuế trực thu và gián thu (bài 67)
### 🏠 Thu nhập kinh tế và thu nhập kế toán (bài 68)
### 📝 Tóm tắt
- Thuế tạo nêm giữa giá mua và giá bán, giảm sản lượng, cả hai bên chia gánh; c + d là tổn thất vô ích.
- Thuế có thể tốt khi nội hóa ngoại tác (xăng gây ô nhiễm).
- Nước đang phát triển dựa vào gián thu (dễ thu nhưng lũy thoái); phát triển rồi tỷ trọng trực thu tăng.
- Thu nhập kinh tế tính cả thay đổi giá tài sản; kế toán thì không, nhưng dễ đo hơn.
## 📐 18. Công bằng và hiệu quả trong hệ thống thuế
### 📐 Lũy thoái, tỷ lệ, lũy tiến (bài 69)
### ⚖️ Công bằng và hiệu quả (bài 70)
### 📝 Tóm tắt
- Lũy thoái: người giàu thuế suất bình quân thấp hơn; tỷ lệ: bằng nhau; lũy tiến: thuế suất biên tăng theo thu nhập.
- Quá lũy tiến làm cào bằng thu nhập sau thuế và triệt tiêu động lực.
- Công bằng chiều ngang (cùng thu nhập – cùng thuế) và chiều dọc (khác thu nhập – khác thuế).
- Thuế biên cao có thể làm người lao động chọn nghỉ → tổn thất hiệu quả; thuế khoán hiệu quả nhưng không công bằng.
## 🎁 19. Ưu đãi thuế, DNNN và cạnh tranh thuế
### 🎁 Ưu đãi thuế (bài 71)
### 🏭 Đánh thuế doanh nghiệp nhà nước (bài 72)
### 🏁 Cạnh tranh thuế (bài 73)
### ↔️ Dịch chuyển thuế (bài 74)
### 📝 Tóm tắt
- Ưu đãi thuế ít hiệu quả trong thu hút đầu tư; chế độ thuế ổn định và hạ tầng tốt mới là yếu tố chính. Ưu đãi cho ngành xấu hại gấp đôi.
- DNNN: yêu cầu hiệu quả ít nhất bằng tư nhân; quy tắc vốn mỏng; cùng một chế độ thuế và quản lý.
- Cạnh tranh thuế (Ireland 10%) có lợi và hại; nên tạo môi trường kinh doanh tốt chứ không chạy đua hạ thuế.
- Dịch chuyển thuế xuôi (sang người mua) và ngược (ép nhà cung cấp, nông dân).
## 🌳 20. Hàng hóa công, trách nhiệm người nộp thuế và hệ thống tài chính
### 🌳 Thuế và hàng hóa công (bài 75–76)
### 🏦 Hệ thống tài chính (bài 77)
### 🔓 Từ kìm hãm tới tự do hóa tài chính (bài 78)
### ⭐ Xếp hạng tín nhiệm (bài 79)
### 📝 Tóm tắt
- Hàng hóa công nhiều người dùng cùng lúc, khó thu phí → nhà nước tài trợ bằng thuế; người nộp thuế phải giám sát chi tiêu.
- Hệ thống tài chính dẫn vốn trực tiếp (thị trường tiền tệ, vốn) hoặc gián tiếp (trung gian), chuyển rủi ro, giám sát sử dụng vốn.
- Kìm hãm tài chính gây lãi âm, phân bổ sai; tự do hóa vội vàng có thể gây khủng hoảng — cần trình tự và thể chế.
- Xếp hạng tín nhiệm đánh giá khả năng trả nợ đúng hạn; VN: BB (S&P), B1 (Moody’s).
## 📣 21. Thông tin, thị trường hiệu quả và cơ cấu vốn
### 📣 Thông tin từ các định chế tài chính (bài 80)
### 📈 Giả thuyết thị trường hiệu quả (bài 81–82)
### 🍰 Vay nợ có tạo giá trị không? (bài 83)
### 📝 Tóm tắt
- Thông tin không chính thức có thể gây hiệu ứng bầy đàn và bank run; ngân hàng trung ương cần can thiệp kịp thời, điều tiết thông tin chính thức.
- Ba dạng hiệu quả: yếu (lịch sử giá), bán mạnh (thông tin công khai), mạnh (cả nội bộ) — mỗi dạng loại bỏ một cách kiếm lợi nhuận vượt trội.
- Thị trường nhỏ như VN khó hiệu quả; cần minh bạch và nhà phân tích chuyên nghiệp.
- Không thuế, thị trường hoàn hảo: cách tài trợ chỉ chia bánh, không làm bánh to hơn.
## 🔗 22. Chủ sở hữu – nhà quản lý và quyền chọn cổ phiếu
### 🔗 Quyền chọn cổ phiếu: ý tưởng (bài 84)
### 🕳️ Kẽ hở trong thực tế (bài 85)
### 🛠️ Sửa lỗi quyền chọn (bài 86)
### 📏 Đo lường hiệu quả điều hành (bài 87)
### 📝 Tóm tắt
- Quyền chọn cổ phiếu cho quản lý quyền mua ở giá thực hiện cố định để gắn lợi ích với cổ đông.
- Kẽ hở: thao túng thông tin, thưởng cho yếu tố ngoài tầm kiểm soát, mua lại cổ phiếu bằng nợ, không ghi chi phí.
- Giải pháp: giá thực hiện lũy tiến, điều chỉnh giá, giữ cổ phiếu, mua cổ phiếu quỹ, ghi chi phí cuối mỗi kỳ.
- Sản lượng, doanh thu, lợi nhuận ròng đều có hạn chế; đo hiệu quả điều hành là vấn đề mở.
## 🤝 23. Tiết kiệm, tín dụng vi mô và vốn mạo hiểm
### 🤝 Niềm tin để tiết kiệm (bài 88)
### 🐷 Người tiết kiệm nhỏ và đầu cơ (bài 89)
### 🏺 Tiết kiệm chính thức và phi chính thức (bài 90)
### 🎣 Tín dụng vi mô (bài 91)
### 🚀 Vốn đầu tư mạo hiểm (bài 92)
### 📝 Tóm tắt
- Niềm tin để tiết kiệm quyết định kênh chính thức hay phi chính thức; bảo hiểm tiền gửi và can thiệp kịp thời giữ niềm tin.
- Người tiết kiệm nhỏ ngại rủi ro, còn người đầu cơ chấp nhận rủi ro để có lợi suất cao.
- Khoảng 80% tiết kiệm hộ VN nằm ngoài ngân hàng do thói quen, thiếu tiếp cận, lạm phát và lợi suất thấp.
- Tín dụng vi mô nhắm tới nhóm sử dụng vốn hiệu quả; vốn mạo hiểm đầu tư cổ phần vào công ty non trẻ rủi ro cao.
## 🍜 24. Công cụ phân tích và hệ quả của chính sách công
### 🍜 Kinh tế lượng dễ hiểu (bài 93)
### 👩‍🔧 Hồi quy và vấn đề giới (bài 94)
### 🔲 Ma trận 2×2 chọn dự án (bài 95)
### 🕸️ Vốn xã hội (bài 96)
### 📣 6P marketing địa phương (bài 97)
### 🎯 Hệ quả ngoài dự tính của chính sách công (bài 98)
### 📝 Tóm tắt
- Kinh tế lượng: thu thập dữ liệu → ước lượng → dự báo; hồi quy kiểm soát các yếu tố khác để xem tác động riêng của giới tính.
- Ma trận 2×2: tốt cả hai → duyệt; xấu cả hai → bác; tốt kinh tế/xấu tài chính → thực hiện nhưng khó tài trợ; xấu kinh tế/tốt tài chính → bác dù bị áp lực.
- Vốn xã hội: niềm tin, mạng lưới, giá trị chung; hữu ích nhưng khó đo.
- 6P: thêm People và Profitability cho marketing địa phương.
- Chính sách công có thể có hệ quả ngoài dự tính vì người dân phản ứng theo khuyến khích; nên tự đặt mình vào vị trí đó.
