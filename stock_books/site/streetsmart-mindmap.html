# 🧮 Hướng dẫn định giá cổ phiếu (Streetsmart Guide to Valuing a Stock)
## 💥 1. Giới thiệu và tổng quan
### 💥 Bài học từ sụp đổ: LTCM và bong bóng công nghệ
### 🧭 Quyết định đầu tư và tỷ lệ định giá
### 🔟 10 nguyên tắc và lộ trình DCF
### 📝 Tóm tắt
- LTCM và bong bóng công nghệ: bỏ qua nguyên tắc tài chính là thất bại, dù thông minh đến đâu.
- Giá trị = hiện giá dòng tiền tương lai; quyết định dựa trên số lượng, thời điểm, rủi ro.
- Tỷ lệ định giá = giá trị ÷ giá: > 1 mua, < 1 bán/chờ.
- “Lần này khác” là câu nói của mọi cơn sốt; nguyên tắc không đổi.
- DCF bốn bước: dòng tiền → tỷ lệ chiết khấu → giá trị doanh nghiệp → giá trị mỗi cổ phiếu.
## ⚖️ 2. 10 nguyên tắc tài chính và cách dùng
### ⚖️ Nguyên tắc 1: lợi suất cao đòi rủi ro cao
### 🏁 Nguyên tắc 2: thị trường vốn hiệu quả khó thắng
### 😨 Nguyên tắc 3–4: ngại rủi ro, cung cầu
### 🧮 Nguyên tắc 5–7: trung bình kép, chi phí/thuế/lạm phát, giá trị thời gian
### 🧺 Nguyên tắc 8–9: phân bổ tài sản và đa dạng hoá
### 📐 Nguyên tắc 10: mô hình định giá tài sản – CAPM
### 📝 Tóm tắt
- Lợi suất cao ⇒ rủi ro cao; chỉ rủi ro hệ thống (beta) được thưởng.
- Thị trường khá hiệu quả nhưng Fama–French cho thấy BE/ME cao và P/E thấp có lợi; luôn có biên an toàn.
- Cung cầu chi phối giá ngắn hạn; thận trọng với tin xấu mơ hồ.
- Dùng lợi suất kép, giảm chi phí giao dịch, tận dụng tài khoản ưu đãi thuế.
- Phân bổ tài sản quyết định > 90% biến thiên; 20–25 cổ phiếu là đủ đa dạng.
- CAPM cho chi phí vốn chủ = Rf + β × phần bù thị trường.
## 📐 3. Định giá cổ phiếu: những điều sơ bộ
### 📐 Giá trị = hiện giá dòng tiền kỳ vọng
### 💡 Cổ phiếu đơn giản: công ty điện ABC
### 🫧 Chúng ta đã gây ra bong bóng công nghệ
### 📊 Lợi suất cổ đông và kỳ vọng thị trường
### 🎯 Giá cao hay thấp? Kỳ vọng tăng trưởng đã nằm trong giá
### 🧭 Nghệ thuật, khoa học hay phép màu? Ba trường phái
### 🧠 Cảm xúc, nhà phân tích và khi nào mua/bán
### 📝 Tóm tắt
- Giá trị = hiện giá dòng tiền kỳ vọng; thay đổi lợi nhuận và lãi suất thay đổi giá trị (ABC Utility).
- Bong bóng công nghệ: vốn hoá JDSU, ICGE, Lucent không thể được lợi nhuận hỗ trợ; ai cũng góp phần.
- Giá đã chứa kỳ vọng tăng trưởng: vượt kỳ vọng thì tăng, hụt thì sập.
- Ba trường phái: cơ bản, kỹ thuật, MPT; sách chọn DCF (FCFF) kết hợp đa dạng hoá.
- Cẩn thận nhà phân tích xung đột lợi ích và quản lý lợi nhuận; cắt lỗ khi giảm ≥ 20%.
## 🧾 4. Cách định giá một cổ phiếu (DCF)
### 🧾 Các khái niệm dòng tiền
### 🔁 Cách tiếp cận FCFF và chính sách cổ tức
### 🛠️ Phạm vi áp dụng và vì sao DCF thay vì EPS
### 4️⃣ Bốn bước DCF
### 💻 Ví dụ Microsoft
### ⚖️ Tăng trưởng vs giá trị, vốn hoá lớn vs nhỏ
### 📝 Tóm tắt
- FCFF = NOP − Thuế − Đầu tư ròng − ΔVốn lưu động; giá trị DN = Σ FCFF chiết khấu + giá trị còn lại + tài sản ngắn hạn.
- Giá trị còn lại = NOPAT ÷ WACC, chiếm 60–90% giá trị; giai đoạn vượt trội theo quy tắc 1-5-7-10.
- Dùng DCF thay vì EPS vì EPS bỏ qua thời gian, rủi ro, đầu tư cần thiết và dễ bị thao túng.
- Chính sách cổ tức không đổi giá trị hiện tại (Modigliani–Miller).
- Microsoft ví dụ: giá trị $38,86 so với giá $45,15 ⇒ định giá cao 16%.
## 🧮 5. Dự báo dòng tiền kỳ vọng
### 🧮 Năm anh em: các đại lượng dòng tiền
### 📈 Tăng trưởng và giai đoạn vượt trội
### 🌐 Ví dụ Cisco: tăng trưởng, NOPM, thuế
### 🏗️ Đầu tư ròng và vốn lưu động
### 💰 FCFF, giá trị còn lại và kết quả
### 📝 Tóm tắt
- Năm đại lượng: tăng trưởng, NOPM, thuế, đầu tư ròng, vốn lưu động tăng thêm.
- Dùng CAGR, định giá với ít nhất hai kịch bản tăng trưởng (nhà phân tích và 3–5%).
- NOPM thất thường thì dùng trung bình 3 năm; đầu tư ròng về 0 sau giai đoạn vượt trội.
- FCFF = NOPAT − đầu tư ròng − ΔVLĐ; giá trị còn lại = NOPAT ÷ WACC (≈ 60–90% giá trị).
- Cisco: $10,87 (g = 20%) và $4,64 (g = 5%) so với giá $14,45 ⇒ bị định giá cao.
## ⚖️ 6. Ước tính chi phí vốn
### ⚖️ WACC như lợi suất danh mục
### 📉 Lãi suất, WACC và giá cổ phiếu
### 📚 Giá trị thị trường vs sổ sách
### 📐 Chi phí vốn cổ phần: CAPM
### 🏦 Chi phí nợ và cổ phiếu ưu đãi
### 🧾 Bảng cân đối và ví dụ Cisco
### 📝 Tóm tắt
- WACC = trung bình có trọng số chi phí nợ sau thuế, ưu đãi và vốn cổ phần.
- Dùng thị giá cho cổ phiếu thường, sổ sách cho nợ và ưu đãi (thực tế phổ biến).
- CAPM: Rs = Rf + β × ERP; sách dùng ERP 3%, Rf 4,25%.
- Chi phí nợ sau thuế = (Rf + spread) × (1 − t); lãi suất giảm 1% có thể tăng giá cổ phiếu ≥10%.
- ConEd WACC 4,84%; Cisco WACC 10,04% ⇒ giá trị nội tại $10,87.
## 🌐 7. Tìm thông tin cho việc định giá
### 🌐 Nguồn thông tin chính
### 🧰 Trang web định giá DCF
### 🟢 Đầu vào dễ tìm (từ báo cáo)
### 🟡 Đầu vào cần ước tính
### 🔵 Đầu vào chi phí vốn
### 🧮 Ráp lại: Cisco $10,87
### 📝 Tóm tắt
- Trang web công ty và SEC/EDGAR là nguồn chính; Yahoo và MSN là hai trang miễn phí tốt nhất.
- Chia đầu vào: dễ tìm (báo cáo), cần ước tính (tăng trưởng, NOPM), chi phí vốn (Rf, β, ERP…).
- Dùng 3 năm dữ liệu để thấy xu hướng; hạ đồng thuận nhà phân tích xuống mức khả thi.
- Beta khác nhau giữa các nguồn: dùng cao hơn hoặc trung bình.
- Cisco: tất cả hợp lại ra $10,87; các trang định giá khác ra $4,55–$15,57.
## 🏦 8. Định giá cổ phiếu: ghép tất cả lại
### 🏦 Điều chỉnh khi định giá công ty tài chính
### 🏢 Citigroup (17/12/2002): giá $37,13
### 💼 Merrill Lynch (18/12/2002): giá $40,13
### 🧓 Berkshire Hathaway (18/12/2002): giá $72.000
### 🏘️ Định giá REIT: Washington REIT (20/12/2002)
### 🎯 Bài học rút ra
### 📝 Tóm tắt
- Công ty tài chính: gộp lãi vào NOP, nợ vào nợ ngắn hạn, VLĐ = 0, WACC ≈ chi phí vốn cổ phần.
- REIT: thuế 0, đầu tư/khấu hao cao, beta chỉnh (0,8), rất nhạy với lãi suất.
- Citigroup $47–$88 vs $37,13 ⇒ strong buy; Merrill $44–$73 vs $40,13 ⇒ buy; Berkshire $63k–$81k vs $72k ⇒ hold; WRE $16,85–$24,04 vs $25,55 ⇒ weak sell.
- Luôn định giá theo khoảng bằng cách đổi tăng trưởng, NOPM và WACC.
- Xếp hạng chỉ mang tính minh họa — hãy tự làm phân tích của mình.
