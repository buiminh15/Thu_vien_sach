# 🧓 Chọn cổ phiếu như Warren Buffett (Pick Stocks Like Warren Buffett)
## 🛒 1. Đầu tư như Buffett: cách làm, thành tích và cuộc đời
### 🛒 Ba cách đi theo Buffett
### 🏆 Thành tích của Buffett
### 🧒 Cuộc đời: từ Omaha đến Berkshire
### 📝 Tóm tắt
- Cách dễ nhất: mua Berkshire (A hoặc B); thêm cổ phiếu Berkshire đang giữ và quỹ kiểu Buffett.
- Berkshire: ~27%/năm cổ phiếu, giá trị sổ sách >23%/năm trong 36 năm, thắng S&P 32/36 năm.
- Khó đánh bại quỹ chỉ số: chi phí thấp, đa dạng, tự cập nhật; nên giữ một lõi chỉ số.
- Buffett sống giản dị, trung thực, trung thành cổ đông; học từ Graham rồi tự lập.
- Công thức cốt lõi: mua công ty tuyệt vời khi giá hơi rẻ, rồi giữ.
## 📉 2. Hai người thầy: Graham, Fisher và giá trị vs tăng trưởng
### 📉 Benjamin Graham: bài học từ cơn sụp 1929–32
### 🎭 Ông Thị Trường và điếu xì gà
### 🔍 Philip Fisher: công ty “bonanza” và 15 câu hỏi
### ⚔️ Giá trị vs tăng trưởng
### 📝 Tóm tắt
- Graham: biên an toàn, Mr. Market, không đầu cơ; Fisher: 15 câu hỏi, scuttlebutt, giữ mãi.
- Graham định lượng; Fisher định tính; Buffett kết hợp cả hai.
- Giá trị và tăng trưởng có chung gốc: mua doanh nghiệp tốt dưới giá trị — GARP là cầu nối.
- Sai lầm điển hình: giá trị mua/bán sớm; tăng trưởng mua/bán muộn.
- Chỉ bán khi mua nhầm, công ty đã thay đổi hoặc có cơ hội tốt hơn rõ ràng.
## 📜 3. 12 nguyên tắc, không đánh bạc, mua giá “hời”
### 📜 12 nguyên tắc đầu tư của Buffett
### 🎲 Nguyên tắc 1: đừng đánh bạc
### 💰 Nguyên tắc 2: mua giá hời — các thước đo
### 🧮 Giá trị nội tại và chiết khấu dòng tiền
### 📝 Tóm tắt
- 12 nguyên tắc: không đánh bạc, mua rẻ, trong vòng tròn năng lực, làm bài tập, ngược đám đông, công ty tuyệt vời, người đáng tin, giữ lâu, kinh doanh lý trí, học từ lỗi, tránh lỗi phổ biến, không đa dạng hoá thừa.
- Buffett chỉ đặt cược vào điều gần như chắc chắn; chờ cú ném béo.
- Thước đo: ROE cao và tăng, tăng trưởng ≥15%, biên lợi nhuận, giá trị sổ sách tăng, nợ ≤50%.
- Giá trị nội tại = dòng tiền chiết khấu; tăng trưởng dài hạn có thể biện minh P/E rất cao.
- Không có công thức thần kỳ: càng qua nhiều bộ lọc càng tốt.
## ⭕ 4. Mua cái bạn hiểu, làm bài tập, đi ngược đám đông
### ⭕ Vòng tròn năng lực
### 🕵️ Làm bài tập: thám tử thực địa
### 🔄 Đi ngược đám đông
### 📝 Tóm tắt
- Ở trong vòng tròn năng lực; Buffett tránh công nghệ, hàng hoá, cổ phiếu nước ngoài.
- Làm bài tập như thám tử: đến tận nơi, hỏi khách, nhà cung cấp, đối thủ.
- Tham lam khi người khác sợ hãi, sợ hãi khi người khác tham lam.
- Cần tự tin nhưng không quá mức; kiểm tra lại giả định; đừng nhầm bảo thủ với thông thường.
- Thử nghiệm bữa tiệc cocktail: nếu ai cũng khoe lãi, đừng mua.
## 🏰 5. Công ty tuyệt vời và những người quản lý đáng tin
### 🏰 GEICO (1976)
### 📰 Washington Post (1973)
### 🥤 Coca-Cola (1988–89)
### 💳 American Express (thập niên 1960)
### 🤝 Thuê người tốt: quản lý bạn ngưỡng mộ
### 📝 Tóm tắt
- GEICO: mua rẻ lúc gần phá sản, hào là bán trực tiếp giá rẻ; ~27%/năm.
- Washington Post: nhật báo độc quyền địa phương; giá trị nội tại cao hơn nhiều giá mua.
- Coca-Cola: mua P/E 15,2 vì thương hiệu số một toàn cầu; ~28%/năm trong 10 năm.
- American Express: tin xấu nhưng hiệu ứng mạng và hào doanh nghiệp còn nguyên; nghiên cứu định tính “Buffett 101”.
- Quản lý tốt: như chủ sở hữu, trung thực, tiết kiệm, công bằng với cổ đông.
## 🧘 6. Nhà đầu tư, không phải tay súng; hãy kinh doanh lạnh lùng
### 🧘 Lợi ích của việc ngồi yên
### 🎯 Vì sao nhiều người thành “tay súng”
### 💼 Be businesslike: cổ đông trước tiên
### 📝 Tóm tắt
- Thời gian giữ ưa thích là mãi mãi; hỏi “tôi có muốn sở hữu 10 năm không?”.
- Giao dịch nhiều làm giảm lợi nhuận: 11,4% so với 18,5%/năm (Barber–Odean).
- Người ta giao dịch nhiều vì động lượng, tự tin thái quá, môi giới, truyền thông, ảo tưởng kiểm soát.
- Dành 5–15% vốn cho “tiền đánh bạc”, giữ phần còn lại ổn định.
- Kinh doanh trước, tình cảm sau: cổ đông là trên hết; cổ phiếu không biết bạn sở hữu nó.
## 📝 7. Nhận sai lầm, tránh bẫy tâm lý, tập trung hay đa dạng
### 📝 Thừa nhận sai lầm và học hỏi
### 🧠 Những lỗi tâm lý phổ biến
### 🎯 Đừng đa dạng hoá thừa?
### 📝 Tóm tắt
- Buffett công khai liệt kê và phân tích sai lầm; nhận sai là dấu hiệu của người giỏi.
- Lỗi tâm lý lớn nhất: recency/ngoại suy; tránh loss aversion, neo giá, sunk cost, tự tin thái quá.
- Hoài nghi thị trường hiệu quả: giá thường lệch vì nhà đầu tư phi lý.
- Tập trung = kết quả cực đoan; chỉ hợp người rất giỏi. Nhà đầu tư thường nên đa dạng hoá hoặc dùng quỹ chỉ số.
- Quỹ nghiêng nhẹ về top cổ phiếu và giữ người thắng lâu thường tốt.
## 🔎 8. Bộ lọc kiểu Buffett và những người đi theo (Ruane, Hagstrom, Simpson, Browne)
### 🔎 Cách nhanh tìm cổ phiếu Buffett có thể mua
### 🌲 Bill Ruane – Sequoia Fund
### 🎯 Robert Hagstrom – Legg Mason Focus Trust
### 👑 Louis Simpson – GEICO, người kế nhiệm tiềm năng
### 📚 Chris Browne – Tweedy, Browne
### 📝 Tóm tắt
- Bộ lọc số liệu (owner earnings, biên ≥15%, ROE ≥15%, lợi suất lợi nhuận giữ lại, không định giá cao) chỉ là điểm bắt đầu.
- Ruane: giá trị bao hàm tăng trưởng; gợi ý một nửa chỉ số, một nửa trái phiếu cộng quỹ dự phòng 3–4 năm.
- Hagstrom: tập trung 15–20 cổ phiếu quay vòng thấp; nhưng chiến lược nào cũng có lúc phai.
- Simpson: bảo thủ, tập trung, tìm giá hợp lý cho doanh nghiệp tốt.
- Browne: giá trị + tăng trưởng gắn bó; dùng giao dịch nội bộ, học thuật; ít bán, hiểu cổ phiếu thua.
## 🧪 9. Whitman, Schloss, Torray và Walczak: bốn phong cách giá trị
### 🧪 Martin Whitman – Third Avenue
### 🔢 Walter Schloss – Walter & Edwin Schloss Associates
### 🏷️ Robert Torray – Torray Fund
### 🤔 Edwin Walczak – Vontobel U.S. Value
### 📝 Tóm tắt
- Whitman: thụ động, mua cả công nghệ khi rẻ, giá trị = nhạy với giá; cảnh giác với đánh giá quản lý.
- Schloss: con số và nợ; 15,7%/năm; không giữ vĩnh viễn; giữ tiền nếu không có gì đáng mua.
- Torray: công ty tốt giá hợp lý, 3–5% mỗi vị thế; chi phí và thuế ăn hết lợi nhuận quỹ.
- Walczak: khó dự báo, định tính 90%; tự vấn về tập trung và giữ lâu.
- Chung: kiên nhẫn, chọn lọc, tránh chi phí và quay vòng.
## ✂️ 10. Gipson, Price và các nhà đầu tư giá trị khác
### ✂️ James Gipson – Clipper Fund
### 🐴 Michael Price – Mutual Series
### 🧑‍🤝‍🧑 Một loạt nhà đầu tư giá trị khác
### 📝 Tóm tắt
- Clipper: tập trung ~30 mã, nhượng quyền mạnh, chiết khấu 30%; thua 4 năm rồi thắng đậm 2000.
- Mutual Series: cổ phiếu rẻ, arbitrage, phá sản; nghiên cứu kỹ; bán khi giá ~85% giá trị.
- Cuộc tranh luận Chase: lợi ích cổ đông vs nhân viên.
- Royce: mua “cảm cúm không viêm phổi”; Gabelli: cần chất xúc tác; Olstein: giá, giá, giá.
- Lời khuyên chung: đọc bản cáo bạch, xem hồ sơ dài hạn và vị thế lớn nhất trước khi mua quỹ.
## 🧭 11. Tổng hợp: phẩm chất, công ty tuyệt vời và danh ngôn Buffett
### 🧭 Ba lựa chọn và phẩm chất nhà đầu tư giỏi
### 🏆 Doanh nghiệp tuyệt vời theo Train
### 📣 Quảng cáo tìm mua của Berkshire
### 💬 Danh ngôn từ chủ tịch
### 📝 Tóm tắt
- Ba cách: mua Berkshire, cổ phiếu Buffett giữ, hoặc quỹ Buffett-like.
- Nhà đầu tư xuất sắc: logic không cảm xúc, giữ chiến lược, nghiên cứu tốt, ngược dòng, kinh nghiệm.
- Doanh nghiệp tuyệt vời: dễ hiểu, ROE cao ít nợ, tiền mặt, hào, quản lý vì cổ đông.
- Berkshire mua: ≥$50 triệu lợi nhuận, ổn định, ít nợ, có quản lý, đơn giản, có giá chào.
- Tính khí quan trọng hơn trí tuệ; tránh rồng hơn diệt rồng.
## 📜 12. Phụ lục: Schloss, Whitman, đại hội Berkshire và Phil Carret
### 📜 “65 năm ở Phố Wall” – Walter Schloss
### ⚖️ Whitman: giá trị vs tăng trưởng
### 🎪 Cuối tuần ở đại hội Berkshire (4/2001)
### 🪑 Phil Carret: “nếu có cổ phiếu tốt, hãy ngồi lên nó”
### 📝 Tóm tắt
- Schloss: mua dưới sổ sách, can đảm mua thêm khi giá giảm; bán dần theo thang; chấp nhận hạn chế của mình.
- Whitman: đối lập giữa giá trị và “tăng trưởng được thừa nhận” — bốn yếu tố: không nợ, quản lý hợp lý, dễ hiểu, giá ≤50%.
- Đại hội Berkshire: “tránh thẻ tín dụng, đọc nhiều, tiết kiệm”; “beta” là tín hiệu kéo khoá ví.
- Carret: ngồi yên với cổ phiếu tốt; quản lý quan trọng; đừng thay đổi cảm xúc theo thị trường.
- Mọi con đường dẫn đến Jerusalem: nhiều phong cách vẫn thành công nếu kỷ luật.
