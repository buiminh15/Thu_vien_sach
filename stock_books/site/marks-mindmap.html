# 🧭 Điều quan trọng nhất được làm sáng tỏ
## 🎨 1. Suy nghĩ cấp thứ hai
### 🎨 Đầu tư là nghệ thuật, không phải thuật toán
### 🧠 Cấp thứ nhất và cấp thứ hai
### 🔲 Ma trận 2×2: khác biệt và đúng hơn
### 📝 Tóm tắt
- Đầu tư là nghệ thuật; phương pháp cố định sẽ bị bắt chước và mất tác dụng.
- Lợi nhuận trung bình thì dễ (quỹ chỉ số), vượt trội thì cần nghĩ khác và đúng hơn số đông.
- Cấp một: kết luận giống mọi người. Cấp hai: xét đồng thuận, xác suất, giá đã phản ánh gì.
- Phép thử: “Và ai mà không biết điều đó?”
- Vượt trội = quan điểm không đồng thuận + chính xác.
## 🏛️ 2. Hiểu biên độ thị trường (hiệu quả thị trường) và hạn chế
### 🏛️ Giả thuyết thị trường hiệu quả
### 🔍 Khi nào thị trường hiệu quả, khi nào không?
### ⚖️ Kết luận thực tế của Marks
### 📝 Tóm tắt
- EMH: giá phản ánh nhanh và hợp lý mọi thông tin ⇒ khó đánh bại thị trường ⇒ quỹ chỉ số.
- Marks: “hiệu quả” = tiếp thu nhanh, không phải luôn đúng; tâm lý và silo tạo định giá sai.
- Thị trường hiệu quả hơn khi tài sản phổ biến, được chấp nhận, dễ hiểu, thông tin đều.
- Bất hiệu quả là điều kiện cần cho vượt trội, không phải đủ; cần kỹ năng hơn người khác.
- Chọn thị trường kém hiệu quả để tập trung nỗ lực; coi hiệu quả là giả định có thể bác bỏ.
## 🧭 3. Giá trị
### 🧭 Hai trường phái: kỹ thuật và cơ bản
### 💎 Đầu tư giá trị vs đầu tư tăng trưởng
### ⏳ Giữ vững niềm tin khi giá chưa đồng ý
### 📝 Tóm tắt
- Giá trị nội tại là điểm khởi đầu bắt buộc: không có nó, thành công chỉ là hy vọng.
- Phân tích kỹ thuật/đà không có nền tảng; hai phương pháp cơ bản là giá trị và tăng trưởng.
- Giá trị nhất quán hơn, tăng trưởng kịch tính hơn nhưng khó dự đoán (Nifty Fifty).
- Biên an toàn: mua thấp hơn giá trị; phải kiên trì dù giá tiếp tục giảm.
- Đúng chưa chắc được chứng minh ngay; cần niềm tin dựa trên phân tích.
## 🏷️ 4. Mối quan hệ giữa giá cả và giá trị
### 🏷️ Giá là điểm xuất phát
### 🧲 Điều gì quyết định giá: giá trị, kỹ thuật, tâm lý
### 🫧 Bong bóng và bốn đường đến lợi nhuận
### 📝 Tóm tắt
- Thành công đến từ mua khôn ngoan, không phải mua “thứ tốt”: giá phải là điểm khởi đầu.
- Giá chịu ảnh hưởng của giá trị cơ bản, yếu tố kỹ thuật (cung cầu phi giá trị) và tâm lý.
- Tâm lý là khoa học quan trọng nhất; mua khi không ai thích, tránh mua ở đỉnh phổ biến.
- Bong bóng: phần sự thật + tham lam + bỏ qua định giá; cuối cùng định giá phải có ý nghĩa.
- Đáng tin nhất để kiếm tiền: mua dưới giá trị; tránh đòn bẩy làm khoản đầu tư xấu thành tai họa.
## ⚠️ 5. Hiểu biết về rủi ro
### ⚠️ Vì sao phải hiểu rủi ro?
### 📈 Đường rủi ro–lợi nhuận bị hiểu sai
### 💥 Rủi ro là gì? Không phải biến động
### 🔮 Vì sao rủi ro khó đo?
### 🎲 Phân phối xác suất và không chắc chắn
### 📝 Tóm tắt
- Rủi ro là điều không thể tránh; cần hiểu, nhận ra khi cao, và kiểm soát.
- Rủi ro cao hơn chỉ hứa hẹn lợi nhuận kỳ vọng cao hơn, không đảm bảo; phân phối rộng hơn và có thể thua lỗ.
- Rủi ro thật là khả năng mất vốn vĩnh viễn, không phải biến động; còn nhiều loại rủi ro mang tính cá nhân.
- Rủi ro chủ quan, ẩn, không đo chính xác được kể cả sau khi xảy ra; Sharpe và VaR chỉ là gần đúng.
- Nghĩ theo phân phối xác suất, tránh kịch bản đơn; đuôi dày và “thiên nga đen” bị đánh giá thấp.
## 🔎 6. Nhận diện rủi ro
### 🔎 Rủi ro nằm ở đâu?
### 😎 Rủi ro nhất là tin rằng không có rủi ro
### 📐 Đường thị trường vốn dịch xuống và phẳng đi
### 🧪 Cách chẩn đoán “tâm trạng rủi ro” (Oaktree, 7/2007)
### 📝 Tóm tắt
- Rủi ro lớn nhất là trả giá quá cao; rủi ro cao và lợi suất thấp là hai mặt của giá cao.
- Niềm tin rằng không có rủi ro là điều rủi ro nhất; bong bóng và khủng hoảng đều có “câu chuyện giảm rủi ro”.
- Rủi ro không bị loại bỏ, chỉ chuyển giao; thiết bị an toàn làm người ta liều hơn (moral hazard).
- Lãi suất thấp và tâm lý lạc quan làm đường thị trường vốn thấp và phẳng: phần bù rủi ro mỏng.
- Nghịch lý rủi ro: sợ ⇒ giảm rủi ro; chủ quan ⇒ tạo rủi ro. Rủi ro nằm ở nơi ít được nhận thức nhất.
## 🛡️ 7. Kiểm soát rủi ro
### 🛡️ Kiểm soát rủi ro là điều vô hình
### 🎯 Thế nào là làm tốt?
### 🔫 Cạm bẫy: không biết “tồi tệ đến mức nào là tồi tệ”
### ⚖️ Kiểm soát rủi ro ≠ tránh rủi ro
### 📝 Tóm tắt
- Nhà đầu tư giỏi chấp nhận rủi ro khôn ngoan và kiểm soát nó; thành tích nhất quán, không thảm họa.
- Kiểm soát rủi ro vô hình trong thời kỳ tốt; thành quả là các khoản lỗ không xảy ra.
- Giá trị gia tăng có thể là cùng lợi nhuận với rủi ro thấp hơn (hình 7.2), không chỉ alpha cao hơn.
- Chấp nhận rủi ro đúng: nhận thức, phân tích, đa dạng hoá, được trả công xứng đáng.
- Kiểm soát rủi ro khác tránh rủi ro; lỗ sâu cần lãi lớn hơn rất nhiều để phục hồi.
## 🔄 8. Chú ý đến các chu kỳ
### 🔄 Hai quy tắc về chu kỳ
### 🏦 Chu kỳ tín dụng
### 🧱 “Lần này thì khác” — bốn từ nên gây sợ
### 📝 Tóm tắt
- Hầu hết mọi thứ có tính chu kỳ vì có sự tham gia của con người: cảm xúc, tâm lý.
- Chu kỳ tự điều chỉnh: thành công gieo hạt giống thất bại và ngược lại.
- Chu kỳ tín dụng khuếch đại chu kỳ kinh tế; khoản vay tồi nhất được cấp vào thời điểm tốt nhất.
- “Lần này thì khác” là câu cảnh báo; ngoại suy xu hướng là điều nguy hiểm nhất.
- Bạn không thể dự đoán chu kỳ, nhưng có thể chuẩn bị; cơ hội tốt nhất nằm ở cực đoan.
## ⏱️ 9. Nhận thức về con lắc
### ⏱️ Hình ảnh con lắc
### 😰 Hai rủi ro: mất tiền và bỏ lỡ cơ hội
### 📈 Ba giai đoạn thị trường bò và gấu
### 📝 Quan sát chính về con lắc
### 📝 Tóm tắt
- Tâm lý nhà đầu tư dao động như con lắc: sợ hãi ↔ tham lam; e ngại ↔ chấp nhận rủi ro.
- Con lắc hiếm khi ở giữa; dao động ra cực tạo năng lượng quay lại; quay lại nhanh hơn đi.
- Hai rủi ro: mất tiền và bỏ lỡ cơ hội — ở mỗi cực một rủi ro bị bỏ quên.
- Ba giai đoạn bò/gấu: người khôn làm ở đầu, kẻ dại làm ở cuối.
- Không biết khi nào và bao xa, nhưng chắc chắn sẽ đảo chiều; cực tối là lúc cơ hội lớn nhất.
## 🧠 10. Đối phó với ảnh hưởng tiêu cực
### 🧠 Sai lầm đến từ tâm lý, không phải phân tích
### 🔥 Các ảnh hưởng tiêu cực
### 💻 Ví dụ: bong bóng công nghệ
### 🛡️ Vũ khí kháng cự (Oaktree)
### 📝 Tóm tắt
- Sai lầm lớn nhất của nhà đầu tư là tâm lý, không phải phân tích.
- Các lực chính: tham lam, sợ hãi, đình chỉ hoài nghi, theo bầy đàn, ghen tị, cái tôi, đầu hàng.
- Viên đạn bạc/bữa trưa miễn phí không tồn tại; bong bóng bắt đầu từ một phần sự thật.
- Từ chối tham gia khi tham lam làm tích cực bị đánh giá quá cao; không bán/bán tháo khi sợ hãi.
- Vũ khí: giá trị nội tại, hiểu chu kỳ, hoài nghi, khiêm tốn, bạn đồng hành.
## 🧭 11. Chủ nghĩa đối kháng
### 🧭 Vì sao phải đi ngược đám đông?
### ⚠️ Giới hạn của chủ nghĩa đối kháng
### ❌ Điều ai cũng thích thì không còn rẻ
### 🧗 Hoài nghi — cả với lạc quan lẫn bi quan
### 📝 Tóm tắt
- Quan điểm đồng thuận là thứ cần chơi ngược; ở các cực, đa số đều sai.
- Đối kháng phải dựa trên phân tích và giá trị, không phải phản xạ “ngược lại”.
- Khoản đầu tư ai cũng thích thì không còn rẻ; tiền lớn kiếm từ điều bị đánh giá thấp.
- Hoài nghi áp dụng cho cả lạc quan quá mức lẫn bi quan quá mức.
- Cần kiên định với vị thế khó chịu, đủ vốn và thời gian để chờ giá hội tụ.
## 🗂️ 12. Tìm kiếm món hời
### 🗂️ Từ “tập hợp khả thi” đến lựa chọn tương đối
### 🆚 Món hời hình thành ngược với bong bóng
### 📜 Ví dụ từ sự nghiệp Marks
### 📝 Tóm tắt
- Chọn từ tập khả thi theo tiêu chuẩn tuyệt đối, rồi theo lựa chọn tương đối.
- Mục tiêu là món hời (giá thấp so với giá trị), không phải tài sản tốt.
- Món hời hình thành ngược với bong bóng: bị bỏ qua, kỳ thị, có khiếm khuyết, tâm lý chi phối.
- Tìm ở nơi ít người đến: ít biết, gây tranh cãi, bị thoái vốn, sau kỷ lục tệ.
- Điều kiện cần của món hời: nhận thức tệ hơn thực tế nhiều.
## ⏳ 13. Kiên nhẫn chờ cơ hội
### ⏳ Chờ đợi thay vì săn lùng
### ⚾ Bóng chày: gậy trên vai
### 🐈 Con mèo, cái cây, củ cà rốt và cây gậy
### 🌊 Môi trường lợi suất cao và người bán bị ép
### 📝 Tóm tắt
- Chờ đợi món hời đến với mình; thị trường không cung cấp lợi nhuận chỉ vì bạn cần.
- Đầu tư không có “đánh lỗi”: chỉ vung gậy khi cú ném ở điểm ngọt.
- Môi trường lợi suất thấp: tránh “tìm kiếm lợi suất”; cà rốt và gậy dụ nhà đầu tư vào rủi ro.
- Cơ hội lớn nhất đến từ người bán bị ép (gọi ký quỹ, rút vốn, vi phạm hướng dẫn).
- Bảo vệ mình khỏi áp lực ép bán và định vị làm người mua cuối cùng.
## 🔭 14. Biết những gì bạn không biết
### 🔭 Biết những gì có thể biết
### 📉 Bằng chứng về giá trị (thấp) của dự báo
### 🧩 Nghịch lý của dự báo (Johnson tóm tắt)
### 🙋 Trường phái “Tôi biết” và “Tôi không biết”
### 📝 Tóm tắt
- Hiểu giới hạn kiến thức là lợi thế: biết những gì có thể biết, nhất là ở cấp công ty.
- Dự báo vĩ mô thường sai, ngoại suy, bỏ lỡ thay đổi lớn và không nhất quán.
- Hai trường phái: “Tôi biết” (tự tin, quyết liệt) và “Tôi không biết” (thận trọng, đa dạng, phòng thủ).
- Nguy hiểm không phải điều bạn không biết mà là điều bạn chắc chắn nhưng sai.
- Đừng quên khác biệt giữa xác suất và kết quả, nhất là các kết quả hiếm.
## 🧭 15. Cảm nhận vị trí của chúng ta
### 🧭 Ba lựa chọn đối với chu kỳ
### 🌡️ Đo nhiệt độ của thị trường
### 🔥 Case study: 2004 – giữa 2007 (trước khủng hoảng)
### 📝 Tóm tắt
- Không thể biết mình đi đâu nhưng có thể biết mình đang ở đâu trong chu kỳ.
- Ba lựa chọn: dự đoán (không đáng tin), mua-giữ phớt lờ (bỏ qua chu kỳ), xác định vị trí (ưu tiên).
- Đo nhiệt độ thị trường qua tâm lý, tín dụng, định giá, phần bù; không cần dự đoán.
- Quá nhiều tiền theo đuổi quá ít thương vụ ⇒ giá lên, lợi suất xuống, rủi ro tăng.
- Phản ứng với thực tế hiện tại thay vì chờ tương lai được làm rõ.
## 🎲 16. Đánh giá vai trò của may mắn
### 🎲 Ngẫu nhiên, may mắn và kỹ năng
### 🪙 Cuộc thi lật đồng xu của Buffett
### 🔀 Lịch sử thay thế và chất lượng quyết định
### 🧠 Hệ quả cho cách đầu tư
### 📝 Tóm tắt
- May mắn và ngẫu nhiên ảnh hưởng lớn đến kết quả; kết quả ngắn hạn là kẻ mạo danh của kỹ năng.
- Quyết định tốt được đánh giá theo thông tin và lý lẽ lúc ra quyết định, không theo kết quả.
- Lịch sử thay thế: cái đã xảy ra chỉ là một trong nhiều khả năng.
- Cần nhiều quan sát (nhiều năm) trước khi kết luận về kỹ năng; xem quy trình, không chỉ thành tích.
- Chấp nhận bất định: phân phối xác suất, phòng thủ, đối kháng ở cực.
## 🎾 17. Đầu tư phòng thủ
### 🎾 Trò chơi của kẻ thua và trò chơi của người thắng
### 🛡️ Phòng thủ là gì?
### 📏 Biên an toàn
### ⚖️ Cân bằng tấn công–phòng thủ, và "đầu tư với tâm lý sợ hãi"
### 📝 Tóm tắt
- Không thể vừa tối đa hoá lợi nhuận vừa tránh thua lỗ; phải chọn lập trường tấn công/phòng thủ/cân bằng.
- Đầu tư gần “trò chơi của kẻ thua”: thắng bằng ít lỗi, vì ngẫu nhiên và biến động cao.
- Phòng thủ: loại khoản thua khỏi danh mục, tránh năm xấu; tập trung và đòn bẩy là tấn công.
- Biên an toàn (giá thấp) giúp kết quả chấp nhận được khi tương lai không như mong đợi.
- Nhiều sự nghiệp kết thúc vì quá nhiều cú thua; đầu tư với tâm lý sợ hãi.
## 🪤 18. Tránh những cạm bẫy
### 🪤 Hai nguồn lỗi và "thất bại của trí tưởng tượng"
### 😱 Ba cách bị ảnh hưởng tiêu cực làm hại
### 📚 Mười một bài học từ khủng hoảng (12/2007)
### 🛠️ Cách tránh
### 📝 Tóm tắt
- Lỗi phân tích và lỗi tâm lý; lỗi lớn nhất tại cực đoan chu kỳ và điểm chuyển giao.
- Thất bại của trí tưởng tượng: không hình dung dải kết quả và hậu quả dây chuyền; quên tương quan.
- Ba cách bị hại: khuất phục, tham gia không biết, không tận dụng.
- Mười một bài học khủng hoảng tóm gọn: chú ý cung/cầu vốn và sự thiếu thận trọng.
- Sai lầm lớn nhất: bán ở đáy; hãy biết “sai lầm của hôm nay”.
## 📐 19. Thêm giá trị
### 📐 Alpha, beta và đầu tư thụ động/chủ động
### 🔲 Ma trận: phong cách và đối xứng
### 🎯 Khát vọng của Oaktree
### 📝 Tóm tắt
- Lợi nhuận thị trường dễ; thêm giá trị đòi hỏi kỹ năng (alpha).
- y = α + β·x: beta giải thích phần do thị trường, alpha là kỹ năng.
- Tăng beta (đòn bẩy, cổ phiếu biến động) chỉ là chấp nhận thêm rủi ro, không phải kỹ năng.
- Kỹ năng thật thể hiện bất đối xứng: thu nhiều hơn khi tăng, mất ít hơn khi giảm.
- Một năm không nói lên điều gì; phải xem nhiều chu kỳ và hiệu suất ngoài phong cách.
## 🎯 20. Kỳ vọng hợp lý
### 🎯 Mục tiêu lợi nhuận phải rõ ràng và hợp lý
### 🕵️ Vụ Madoff — bài học về kỳ vọng
### 📉 Không thể chọn đáy
### 🎤 Độc thoại kỳ vọng 2005–07 và "lợi nhuận đủ tốt"
### 📝 Tóm tắt
- Mục tiêu lợi nhuận phải rõ ràng, hợp lý với rủi ro; hợp lý thường là một chữ số đến hai chữ số thấp.
- Lợi nhuận cao đòi môi trường mua cực tốt, kỹ năng phi thường, rủi ro rộng, đòn bẩy hoặc may mắn.
- Madoff: lợi nhuận đều đặn ~10% “quá tốt để là thật”; hỏi “Tại sao lại là tôi?”.
- Không thể chọn đáy; “rẻ” ≠ “sẽ không giảm nữa”; thấy rẻ thì mua, rẻ hơn thì mua thêm.
- Chấp nhận “lợi nhuận đủ tốt”, đừng đuổi theo mức không cần.
## 💎 21. Kết nối tất cả lại với nhau
### 💎 Giá trị và giá
### 🔁 Chu kỳ, con lắc và tâm lý
### ⚠️ Rủi ro, phòng thủ và biên an toàn
### 🧭 Biết điều không biết, kỳ vọng hợp lý, kỹ năng thật
### 📝 Tóm tắt
- Giá trị là nền tảng: mua dưới giá trị là con đường đáng tin nhất; chọn món hời, không phải tài sản tốt.
- Chu kỳ và con lắc tâm lý luôn tồn tại; chống thái quá của đám đông, biết mình đang ở đâu.
- Rủi ro là mất vốn vĩnh viễn; phòng thủ, biên an toàn, tương quan và tránh đòn bẩy.
- Không biết vĩ mô, hãy biết điều có thể biết; kỳ vọng hợp lý, hoài nghi lời hứa quá tốt.
- Kỹ năng thật = hiệu suất bất đối xứng qua nhiều chu kỳ.
