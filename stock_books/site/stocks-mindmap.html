# 📈 Hiểu về cổ phiếu (Understanding Stocks)
## 🏛️ 1. Chào mừng đến thị trường chứng khoán
### 🏛️ Cổ phiếu là gì?
### 🏦 Sàn giao dịch và chủ thể thị trường
### 📊 Chỉ số và cách “ghi điểm”
### 🤝 Ai mua khi không ai muốn mua? Vì sao nên mua cổ phiếu? Rủi ro
### 📝 Tóm tắt
- Cổ phiếu là quyền sở hữu một phần công ty; mua để kiếm tiền, không có bảo đảm.
- Ba sàn chính: NYSE, AMEX, Nasdaq; specialist/market maker bảo đảm luôn có người đối ứng.
- Ba loại người chơi: nhà đầu tư, nhà giao dịch ngắn hạn, tổ chức chuyên nghiệp.
- Chỉ số Dow 30, Nasdaq Composite, S&P 500 đo thị trường; đánh bại chỉ số rất khó.
- Cổ phiếu có lợi suất dài hạn tốt nhất nhưng rủi ro ngắn hạn; rủi ro luôn tồn tại.
## 📜 2. Cổ phiếu không phải khoản đầu tư duy nhất
### 📜 Trái phiếu
### 🧺 Quỹ tương hỗ và quỹ chỉ số
### 💵 Tiền mặt và bất động sản
### 🐂 Thị trường bò, gấu và đi ngang
### 📝 Tóm tắt
- Trái phiếu = cho vay lấy lãi cố định; giá trái phiếu nghịch chiều với lãi suất.
- Quỹ tương hỗ cho đa dạng hoá và thuận tiện; quỹ chỉ số rẻ và khó bị nhà quản lý chủ động đánh bại.
- Tiền mặt bảo vệ khi gấu và là vốn mua cơ hội; BĐS ít thanh khoản, REIT thanh khoản hơn.
- Ba trạng thái thị trường: bò, gấu, đi ngang.
- Không có quy tắc nào bảo bạn phải đầu tư mọi đồng vào cổ phiếu.
## 🏭 3. Cách phân loại cổ phiếu
### 🏭 Ngành (sector)
### 🧩 Cổ phiếu thu nhập, giá trị, tăng trưởng
### 🪙 Penny stock và cảnh báo lừa đảo
### 👮 SEC – cảnh sát của ngành đầu tư
### 📝 Tóm tắt
- Cổ phiếu phân loại theo ngành và theo tính chất: thu nhập, giá trị, tăng trưởng, penny.
- Cổ phiếu thu nhập trả cổ tức nhưng vẫn rủi ro; tăng trưởng biến động; giá trị cần định giá cẩn thận.
- Penny stock rẻ vì lý do, dễ bị thao túng; coi chừng boiler room.
- SEC bảo vệ nhà đầu tư; kiến thức là phòng vệ tốt nhất.
- Theo dõi ngành mạnh/yếu cho manh mối về kinh tế.
## 🧺 4. Những điều thú vị bạn có thể làm với cổ phiếu
### 🧺 Đa dạng hoá và phân bổ tài sản
### ❄️ Lãi kép
### ✂️ Chia tách cổ phiếu (split)
### 🐻 Bán khống (short selling)
### 🔢 Cổ phiếu lưu hành, float, vốn hoá, IPO
### 📝 Tóm tắt
- Đa dạng hoá và phân bổ tài sản theo khả năng chịu rủi ro, tuổi, mục tiêu.
- Lãi kép: lãi trên lãi, đầu tư sớm; không bảo đảm.
- Chia tách cổ phiếu không thay đổi giá trị; reverse split thường là dấu hiệu yếu.
- Bán khống lãi khi giá giảm nhưng lỗ không giới hạn.
- Vốn hoá, float, IPO: IPO nhiều rủi ro cho nhà đầu tư cá nhân.
## 🔤 5. Hiểu giá cổ phiếu
### 🔤 Báo giá cơ bản và mã giao dịch
### 📋 Báo giá chi tiết: bid, ask, spread
### ⚖️ Giá có phải tất cả?
### 🌙 Giao dịch ngoài giờ
### 📝 Tóm tắt
- Báo giá cho biết giá hiện tại; mỗi cổ phiếu có mã (1–3 chữ NYSE, 4–5 chữ Nasdaq).
- Bid là giá bán nhận được, ask là giá mua phải trả; spread là chênh lệch, càng nhỏ càng tốt.
- Báo giá chi tiết: biên giá, khối lượng, P/E, vốn hoá, cổ tức.
- Giá cao hay thấp không quyết định cổ phiếu rẻ hay đắt; cần P/E và giá trị công ty.
- Giao dịch ngoài giờ khối lượng thấp, nhiều rủi ro cho người mới.
## 🏢 6. Mua cổ phiếu ở đâu
### 🏢 Chọn công ty môi giới
### 📝 Các loại lệnh
### 💳 Margin (vay môi giới)
### 📉 Sụp đổ 1929
### 📝 Tóm tắt
- Chọn full-service (tư vấn, hoa hồng cao, xung đột lợi ích) hay online/discount (rẻ, tự quyết).
- Lệnh thị trường nhanh nhưng giá kém; limit giá tốt nhưng có thể không khớp; stop-loss cắt lỗ.
- Margin khuếch đại lãi lỗ, có margin call; tác giả khuyên tránh.
- ECN khớp lệnh điện tử rẻ và nhanh; thời điểm đặt lệnh tốt sau 10:00 sáng.
- Bài học 1929 và 1987: margin, định giá quá cao và hoảng loạn.
## 🧭 7. Chiến lược đầu tư kiếm tiền chậm
### 🧭 Ba lưu ý về chiến lược
### 🪨 Mua và giữ, mua khi giảm, câu đáy, trung bình giá
### 🎯 Giá trị, tăng trưởng, đà, đối kháng
### 🔠 CANSLIM (William O’Neil)
### 📝 Tóm tắt
- Chiến lược chỉ tốt khi hợp người dùng và điều kiện thị trường; tiền là thước đo.
- Mua-giữ dễ nhất nhưng cần chọn đúng công ty và giá; mua khi giảm và câu đáy dễ bẫy.
- Trung bình giá có kế hoạch, tốt hơn mua thêm tuỳ hứng.
- Value, growth (GARP), momentum, contrarian là các trường phái chính.
- CANSLIM là hệ thống quy tắc kết hợp cơ bản và kỹ thuật.
## ⏱️ 8. Chiến lược giao dịch kiếm tiền nhanh
### ⏱️ Day trading, market timing, bán khống khi hồi
### 🧺 ETF – quỹ giao dịch trên sàn
### 📰 Giao dịch theo tin
### 📜 Quyền chọn (options)
### 🛡️ Covered call – bán quyền chọn mua có cổ phiếu
### 📝 Tóm tắt
- Day trading, timing, bán khống khi hồi rất khó thắng; chỉ ít người kiếm tiền ổn định.
- ETF giao dịch như cổ phiếu, rẻ, đa dạng; Qs cho phép bán khống không cần uptick.
- Giao dịch theo tin khó: “mua tin đồn, bán tin tức”.
- Quyền chọn: call/put, strike, ngày hết hạn; ~90% hết hạn vô giá trị.
- Covered call kiếm premium trong thị trường đi ngang nhưng giới hạn lãi.
## 🔍 9. Phân tích cơ bản: nhập môn
### 🔍 Tổng quan
### 🧱 Các bước trong phân tích cơ bản
### 📑 Bảng cân đối kế toán
### 📘 Báo cáo thường niên
### 📝 Tóm tắt
- Phân tích cơ bản nghiên cứu công ty để tìm cổ phiếu giá hợp lý so với lợi nhuận.
- Các bước: ngành, công ty dẫn đầu, ban quản lý, insiders.
- Bảng cân đối: Tài sản = Nợ + Vốn chủ; so sánh với ngành và các năm trước.
- Báo cáo thường niên: chú ý chú thích và rủi ro; cẩn thận PR.
- Nếu không hiểu công ty kiếm tiền thế nào, đừng đầu tư.
## 🧾 10. Phân tích cơ bản: công cụ và chiến thuật
### 🧾 Báo cáo kết quả kinh doanh và EPS
### 📐 Các hệ số định giá
### ⚠️ Hạn chế của phân tích cơ bản
### 🧓 Chân dung Warren Buffett
### 📝 Tóm tắt
- Báo cáo kết quả kinh doanh cho doanh thu, chi phí, lợi nhuận ròng; EPS = lợi nhuận ÷ cổ phiếu.
- Dự báo lợi nhuận ảnh hưởng mạnh tới giá; coi chừng “nấu sổ sách” và whisper number.
- P/E, PEG, P/S, ROE là các công cụ định giá chính — không dùng đơn lẻ.
- Phân tích cơ bản phụ thuộc thông tin công ty, tốn thời gian, không bắt được tâm lý.
- Buffett: mua công ty đơn giản, hiểu được, dưới giá trị và giữ lâu.
## 📈 11. Phân tích kỹ thuật: nhập môn
### 📈 Biểu đồ giá và ba loại biểu đồ
### ↗️ Xu hướng
### 🧱 Hỗ trợ và kháng cự
### 🔷 Mẫu hình giá và khoảng trống
### 🎭 Hạn chế & chân dung Jesse Livermore
### 📝 Tóm tắt
- Phân tích kỹ thuật dùng biểu đồ giá để loại cảm xúc và tìm thời điểm mua/bán.
- Ba loại biểu đồ: đường, thanh, nến; ba loại xu hướng: tăng, giảm, đi ngang.
- Hỗ trợ là nơi người mua thắng, kháng cự là nơi người bán thắng; phá vỡ là tín hiệu quan trọng.
- Mẫu hình: head and shoulders, double top/bottom; khoảng trống: breakaway, continuation, exhaustion.
- Không bảo đảm lãi; dễ có tín hiệu giả; nên kết hợp chỉ báo.
## 📦 12. Phân tích kỹ thuật: công cụ và chiến thuật
### 📦 Khối lượng (volume)
### 📏 Trung bình động và OBV
### 🔄 RSI và Bollinger bands
### 🌽 Hàng hoá và hợp đồng tương lai (hộp tham khảo)
### 📝 Tóm tắt
- Khối lượng là nhiên liệu của giá; thanh khoản cao giúp vào ra dễ.
- MA (50/200 ngày) làm hỗ trợ–kháng cự; OBV xác nhận dòng tiền.
- RSI > 70 mua quá mức, < 30 bán quá mức; Bollinger bands báo biến động và đảo chiều.
- Giữ đơn giản, kết hợp chỉ báo, tránh “analysis paralysis”.
- Tương lai/hàng hoá cực rủi ro: > 95% người giao dịch thua.
## 🧠 13. Tâm lý cổ phiếu: phân tích tâm lý thị trường
### 🧠 Phân tích tâm lý và đám đông
### 🌡️ Bốn chỉ báo tâm lý
### 🎣 Hai trò lừa đảo phổ biến
### 📝 Tóm tắt
- Phân tích tâm lý tìm xem đám đông làm gì rồi thường làm ngược lại.
- VIX là chỉ báo đối kháng: cao ⇒ mua, thấp ⇒ thận trọng.
- Truyền thông, khảo sát bản tin, rút tiền khỏi quỹ, capitulation đều là manh mối tâm lý.
- Pump and dump và giao dịch nội gián là các trò lừa/bất hợp pháp phổ biến.
- Tâm lý có thể báo trước nhưng thời điểm thì khó đoán (Greenspan 1996 → đỉnh 2000).
## 🏦 14. Điều gì khiến cổ phiếu tăng hay giảm
### 🏦 Cục Dự trữ Liên bang (Fed)
### 💵 Đồng đô la và lạm phát
### 📊 Các chỉ số kinh tế
### 📉 Giảm phát và chính trị
### ⚖️ Cung cầu và nhận thức
### 📝 Tóm tắt
- Thị trường ghét bất định: chiến tranh, khủng bố, suy thoái làm nhà đầu tư chạy sang tiền mặt, vàng, BĐS.
- Hạ lãi suất của Fed thường đẩy thị trường lên, tăng lãi suất kéo xuống.
- Đô la mạnh/yếu, lạm phát, CPI, PPI, thất nghiệp, GDP là các chỉ số cần theo dõi.
- Giảm phát hiếm nhưng nguy hiểm; hãy giảm nợ và tăng tiết kiệm.
- Cuối cùng giá do cung cầu và nhận thức.
## ✂️ 15. Vì sao nhà đầu tư thua lỗ
### ✂️ Sai lầm 1–2: không bán lỗ, để lãi thành lỗ
### 😤 Sai lầm 3: quá cảm xúc
### 🧺 Sai lầm 4–6
### 📣 Sai lầm 7–8: nghe tip và theo đám đông
### 🛟 Sai lầm 9–10 và bài học bong bóng tulip
### 📝 Tóm tắt
- Cắt lỗ sớm (quy tắc 10%) và chốt lãi từng phần (30-30).
- Kiểm soát cảm xúc: tham lam, hy vọng, tự tin thái quá đều làm mất tiền.
- Đa dạng hoá (≤ 10% mỗi mã), kỷ luật nhưng linh hoạt, học từ sai lầm.
- Đừng nghe tip, đừng theo đám đông; chuẩn bị cho điều tệ nhất bằng tiền mặt.
- Quan trọng là giữ được tiền; bong bóng tulip và Internet cho thấy bầy đàn nguy hiểm.
## 🗣️ 16. Tác giả thực sự nghĩ gì về thị trường chứng khoán
### 🗣️ Quan điểm chính
### 🏠 Sắp xếp tài chính cá nhân
### ⚠️ Mua-giữ không dành cho mọi người; thị trường không công bằng
### 🌐 “Chiến lược giao dịch hiệu quả” — time-zone trading (chỉ để hiểu)
### 🎭 Trò chơi của các nhà phân tích và kết luận
### 📝 Tóm tắt
- Giữ nhiều tiền mặt, nghe nhà giao dịch, tâm lý chi phối ngắn hạn.
- Không tin dự báo lợi nhuận; kết hợp phân tích cơ bản và kỹ thuật.
- Sắp xếp tài chính: nhà, quỹ, giảm nợ trước khi đầu tư cổ phiếu riêng lẻ.
- Mua-giữ không dành cho tất cả; thị trường không công bằng với cá nhân; nhà phân tích có xung đột lợi ích.
- Kiến thức là vũ khí; đầu tư tốt nhất là vào con người.
