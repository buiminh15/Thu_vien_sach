### 📝 Tóm tắt
- Lạnh nhân tạo: Perkins 1834 (4 bộ phận chính), tủ lạnh kín GE 1928, R12/R22 từ 1930; ứng dụng lớn nhất là bảo quản thực phẩm.
- Bay hơi chất lỏng thu nhiệt; áp suất sôi càng thấp nhiệt độ sôi càng thấp (R12: 0 °C ở 3,1 bar, −41 °C ở 0,6 bar).
- Vòng kín ga lạnh: dàn bay hơi → ống hút → máy nén → ống đẩy → dàn ngưng → (bình chứa) → van tiết lưu.
- 4 thiết bị chính: máy nén, dàn ngưng, tiết lưu, bay hơi; thiết bị phụ: bình chứa, tách dầu, tách lỏng, hồi nhiệt, phin sấy lọc, mắt ga…
## 📏 2. Những kiến thức nhiệt lạnh cơ sở
### 📏 Áp suất và các loại áp suất
### 🌡️ Nhiệt độ và các thang nhiệt độ

### 🔥 Nhiệt hiện, nhiệt ẩn và cách tính
### 🧂 Nước đá, đá muối, đá khô
### ⚡ Entanpy, entropy, công suất lạnh
### ♨️ Truyền nhiệt – truyền lạnh
### 📝 Tóm tắt
- p tuyệt đối = pk + pd (trên khí quyển) hoặc pk − pck (dưới khí quyển).
- 1 atm = 1,013 bar = 760 mmHg; 1 bar = 10⁵ Pa.
- °C = (°F − 32)·5/9; K = °C + 273.
- Nhiệt hiện Q = m·C·Δt; nhiệt ẩn Q = m·r; nhiệt độ đứng yên suốt lúc chuyển pha.
- Ở cùng áp suất, nhiệt độ ngưng tụ = nhiệt độ sôi = nhiệt độ bão hòa.
- Entanpy: chỉ quan tâm Δh; năm thông số trạng thái p, t, v, h, s.
- 1 TR = 3516 W = 12 000 Btu/h; 1 kW = 1 kJ/s.
- Ba cách truyền nhiệt: dẫn nhiệt, đối lưu, bức xạ; dàn trao đổi nhiệt chủ yếu dẫn nhiệt + đối lưu.
## ✅ 3. Ga lạnh (môi chất lạnh)
### ✅ Yêu cầu đối với ga lạnh
### 🧪 Các ga lạnh thường dùng
### 🌍 CFC – HCFC – HFC: thân thiện môi trường
### 📊 Áp suất – nhiệt độ bão hòa
### 🛢️ Bình chứa ga và quy tắc an toàn
### ⛽ Áp suất đầu đẩy
### 🛢️ Dầu nhớt lạnh và ẩm trong ga
### 🔎 Nhận biết, thay đổi ga và lượng ga nạp
### 📈 Đồ thị Mollier (lg p – h)
### 📝 Tóm tắt
- Ga lạnh hấp thụ nhiệt khi bay hơi ở áp thấp và thải nhiệt khi ngưng ở áp cao; không có ga lý tưởng.
- CFC (R11, R12, R13, R502) đã cấm; HCFC (R22) cấm 2040; HFC (R134a, R410A, R404A, R407C) không phá ozon.
- Nhận biết ga: đo áp suất (cộng 1,013 bar) và nhiệt độ lúc có đủ lỏng – hơi rồi tra bảng bão hòa.
- Ngưng tụ ≈ môi trường + 15…18 °C; bay hơi ≈ buồng lạnh − 10 °C.
- Ẩm gây tắc tiết lưu và sinh axit; dùng phin sấy, hút chân không, mắt ga (xanh=khô, vàng=cẩn thận, nâu=ướt).
- Không nạp đầy bình quá 80% bằng lỏng; tránh lửa trần (phosgen); chú ý thông gió.
- Mollier: nén đẳng entropy, ngưng đẳng áp, tiết lưu đẳng entanpy, bay hơi đẳng áp; q₀ = h₁ − h₄, l = h₂ − h₁.
## 🧊 4. Cấu tạo của tủ lạnh
### 🧊 Tổng quan và nguyên lý làm việc
### ⚙️ Máy nén (blốc) tủ lạnh
### 🔬 Thử nghiệm và sửa chữa blốc
### ♨️ Dàn ngưng tụ
### ❄️ Dàn bay hơi
### 🧵 Ống mao
### 🧂 Phin sấy lọc
### 📝 Tóm tắt
- Tủ lạnh = tủ cách nhiệt + hệ thống lạnh + hệ thống điện tự động.
- Blốc: máy nén kín pittông; Q₀ = m(h₁−h₄), N = m(h₂−h₁), Qk = Q₀ + N.
- Tỉ số nén freon 9–10, tối đa 13; t bay hơi −1 °C → Q₀ −4%; t ngưng +1 °C → Q₀ −1,5%.
- Thử blốc bằng áp kế: >32 bar rất tốt, <17 bar quá yếu; kim tụt chậm/nhanh cho biết clape đẩy đóng muội/vênh.
- Chỉ thay blốc nhỏ bằng blốc lớn, không làm ngược lại.
- Dàn ngưng: ống thép + cánh/vỏ tủ; dàn bay hơi: tấm nhôm cán ép là phổ biến nhất, dễ gỉ ở mối nối đồng–nhôm.
- Ống mao Ø0,6–2 mm, dài 0,5–5 m; cân cáp theo áp suất khí nén (150–210 psi cho tủ đối lưu tự nhiên).
- Phin sấy lọc: zeolit 4A tốt nhất, đặt trước ống mao, luôn thay mới khi sửa chữa; không dùng metanol.
## 🔌 5. Động cơ, thiết bị điện và tự động của tủ lạnh
### 🔌 Đại cương về hệ thống điện tủ lạnh
### 🔧 Động cơ tủ lạnh
### 🧲 Rơle khởi động kiểu dòng điện
### 🛡️ Rơle bảo vệ quá tải
### 🌡️ Rơle nhiệt độ (thermostat)
### 🧊 Hệ thống xả băng
### 📈 Chạy thử động cơ blốc và dòng làm việc
### 🗺️ Sơ đồ điện tủ lạnh
### 📝 Tóm tắt
- Động cơ tủ lạnh một pha có 3 cọc C (chung), R (chạy), S (khởi động); RR S.
- Xác định C–S–R: đo điện trở — S–R lớn nhất, C–R nhỏ nhất.
- Rơle khởi động kiểu dòng: cuộn nối tiếp với cuộn R; đóng K khi dòng lớn, ngắt khi rôto đạt ~75% tốc độ.
- Rơle bảo vệ: thanh lưỡng kim + dây điện trở, chống quá tải khi cuộn dây > 120 °C.
- Thermostat: bầu cảm nhiệt + hộp xếp; vi sai càng nhỏ, máy đóng ngắt càng nhiều, tuổi thọ càng giảm.
- Xả băng điện trở: máy nén ngừng; xả băng hơi nóng: máy nén vẫn chạy, van điện từ mở.
- Dòng làm việc I ≈ N/(U·cosφ) và tăng theo nhiệt độ bay hơi/ngưng tụ.
## 📋 6. Đặc tính vận hành của tủ lạnh
### 📋 Thông số kỹ thuật chính
### 🏷️ Nhiệt độ các loại tủ
### ⏱️ Áp suất trong chu kỳ chạy – nghỉ
### 📐 Hệ số thời gian làm việc b
### 💡 Điện năng tiêu thụ
### 📝 Tóm tắt
- Dung tích hữu ích là thông số quan trọng nhất; công suất động cơ tăng theo dung tích.
- HBP, MBP, LBP là ba loại blốc cho nhiệt độ sôi cao, trung bình, thấp.
- Ngăn đông phụ thuộc vị trí núm; ngăn lạnh phụ thuộc nhiệt độ môi trường.
- Sau khi dừng phải chờ 3–5 phút áp suất cân bằng rồi mới khởi động lại.
- b = Tl/Tck; môi trường >33 °C tủ chạy liên tục.
- Ngưng tụ +1 °C hoặc bay hơi −1 °C đều làm điện tăng ~1,5%.
- Điện năng đo ở chế độ chuẩn (không tải) so với chỉ tiêu để chẩn đoán hư hỏng.
## 🚚 7. Sử dụng và bảo quản tủ lạnh
### 🚚 Vận chuyển tủ lạnh
### 📍 Chọn vị trí đặt tủ
### ⚡ Kiểm tra nguồn điện
### 🎛️ Điều chỉnh nhiệt độ
### 🥩 Bảo quản thực phẩm
### ❄️ Xả băng và vệ sinh bảo quản
### 🦺 Yêu cầu về an toàn
### 📝 Tóm tắt
- Vận chuyển đúng tư thế; tủ đứng bị để ngang phải chờ ~1 ngày trước khi chạy.
- Đặt tủ cách tường ≥ 10 cm, thoáng, tránh nhiệt, kê thăng bằng.
- Điện áp lệch ≤ ±10%; ổn áp ≥ 1,5 lần công suất; khởi động chỉ một tiếng "cạch".
- Thực phẩm đông bọc kín; không kết đông gà vịt, thịt tươi trong ngăn đông thường.
- Không dùng vật cứng nạy băng, không làm kem trong ngăn đông.
- Đệm cửa lau bằng Na₂CO₃ 4%; vệ sinh mỗi tháng.
- Tránh lửa trần khi sửa tủ (phosgen); nối đất và ngắt điện khi sửa.
## ✅ 8. Hư hỏng và sửa chữa tủ lạnh
### ✅ Dấu hiệu tủ hoạt động bình thường
### 🩺 Bảng chẩn đoán triệu chứng – nguyên nhân – sửa chữa
### 🧰 Hư hỏng bên ngoài hệ thống lạnh
### 🔄 Khởi động một động cơ bị "bó"
### 🔩 Hư hỏng bên trong và bộ nạp 3 dây
### 📝 Tóm tắt
- Tủ bình thường: êm, dàn lạnh dần, dàn ngưng nóng đều, sau 30–40 phút chạy theo chu kỳ.
- Ngưng tụ ≈ môi trường + 17 K; vượt nhiều → dàn ngưng bẩn/bị bịt hoặc có khí không ngưng.
- Nhiều "hỏng blốc" thực ra là hỏng thiết bị ngoài: rơle, thermostat, dây nối lỏng, nguồn điện.
- Thử đệm cửa bằng dải giấy; cách nhiệt ướt gây chạy liên tục và vỏ lạnh/đổ mồ hôi.
- Dây thử khởi động: giữ nút không quá 2 giây; tụ phải phóng qua điện trở 20 kΩ.
- Khởi động blốc bó: thêm tụ, tăng áp, hoặc cả hai; nhấn ≤ 1–2 giây.
- Bộ nạp 3 dây có 4 kiểu lắp tùy blốc; tủ gia đình thường chỉ dùng phía hạ áp.
## ❄️ 9. Cấu tạo máy điều hòa phòng
### ❄️ Đặc điểm chung
### 🪟 Máy điều hòa cửa sổ (1 cụm)
### 🏠 Máy điều hòa 2 cụm (split)
### 🔁 Máy điều hòa 2 chiều (bơm nhiệt)
### 💧 Máy hút ẩm
### 🔧 Các thiết bị của máy điều hòa
### 📝 Tóm tắt
- ĐHKK dân dụng có hai kiểu: cửa sổ (1 cụm) và 2 cụm (cụm nóng, cụm lạnh); chủ yếu 1,75–7 kW.
- Máy cửa sổ lấy được gió tươi nhưng ồn; máy 2 cụm êm, lắp đặt phức tạp hơn, chênh cao ≤ 3 m, ống ≤ 5 m.
- Máy 2 chiều có van đảo chiều 4 ngả; đảo chiều mất khoảng 10 giây; hiệu áp tối thiểu 3,5 bar.
- Ống mao cho chế độ sưởi dài hơn hoặc cần ống mao phụ qua van một chiều.
- Máy hút ẩm: gió qua dàn lạnh (ngưng ẩm) rồi qua dàn nóng (sưởi ấm).
- Máy nén ĐHKK: pittông, rôto lăn, xoắn ốc; động cơ 0,56–2,5 kW.
- Hồi nhiệt, ống tiêu âm, phin sấy lọc, van điện từ, van một chiều là các thiết bị phụ quan trọng.
## ⚙️ 10. Động cơ, thiết bị điện và tự động của máy điều hòa
### ⚙️ Động cơ một pha có tụ khởi động và tụ làm việc
### 🧲 Rơle khởi động kiểu điện áp
### 🛡️ Rơle bảo vệ quá tải
### 🌡️ Rơle nhiệt độ và xả băng
### 🗺️ Sơ đồ điện máy điều hòa phòng
### 📝 Tóm tắt
- Blốc điều hòa dùng rơle điện áp + tụ khởi động + tụ làm việc; blốc 3 pha cần bảo vệ thứ tự pha.
- Rơle điện áp: tiếp điểm thường đóng, ngắt khi điện áp cuộn đủ lớn lúc rôto ~75% tốc độ; dây rất mảnh.
- Rơle dòng chỉ dùng cho tủ lạnh nhỏ; rơle điện áp dùng được cho nhiều công suất khác nhau và không gây tia lửa.
- Rơle quá tải đĩa lưỡng kim lắp ngay trên vỏ nhận cả tín hiệu dòng và nhiệt độ vỏ.
- Thermostat điện trở (thermistor) chính xác hơn hộp xếp.
- Ở Việt Nam máy 2 chiều không cần xả băng tự động.
- Sơ đồ điều hòa 2 chiều có thêm van điện từ Y1 điều khiển van đảo chiều.
## 📋 11. Đặc tính vận hành, tính toán, lựa chọn máy
### 📋 Các thông số kỹ thuật chính
### ⚡ Công suất động cơ và năng suất lạnh
### 🌡️ Khi nhiệt độ trong nhà và ngoài trời thay đổi
### 📐 Ước tính năng suất lạnh cần thiết
### 🛒 Nguyên tắc chọn máy điều hòa
### 📝 Tóm tắt
- Năng suất lạnh: 6 000–24 000 Btu/h theo bậc 3 000; 36 000 và 48 000 là ranh giới với thương nghiệp.
- Nhiệt độ ngoài trời tăng → năng suất lạnh giảm, áp đẩy và dòng làm việc tăng.
- Nhiệt độ bay hơi tăng 1 °C → năng suất lạnh tăng ~3%.
- Phin lọc bẩn → gió yếu → năng suất lạnh giảm; ống ga dài và chênh cao lớn cũng làm giảm năng suất.
- Ước tính nhanh: phòng ở 400–500 Btu/h/m²; phòng khách 500–600; văn phòng 700–800.
- Biến tần tiết kiệm 30–50% điện; chọn máy năng suất bằng hoặc cao hơn tính toán.
## 🏗️ 12. Lắp đặt, sử dụng, bảo dưỡng và sửa chữa máy điều hòa
### 🏗️ Nguyên tắc chung khi lắp đặt
### 🪟 Vị trí lắp máy cửa sổ
### 🏠 Lắp máy 2 cụm
### 🔨 Thi công: treo dàn, đi ống, thoát nước, nạp ga
### 📱 Sử dụng điều khiển từ xa và các chế độ
### 🧼 Bảo dưỡng máy điều hòa
### 🛠️ Sửa chữa máy điều hòa
### 📝 Tóm tắt
- Lắp máy cửa sổ: hướng bắc, không che chớp gió, dàn ngưng thông thoáng; máy hơi nghiêng vào trong để có lớp nước ngưng.
- Dàn nóng cách tường: sau ≥ 300 mm, bên ≥ 100 mm, trước ≥ 600 mm; nghiêng không quá 5°.
- Máy gia dụng: chênh cao ≤ 3 m, ống ga ≤ 5 m (một số hãng 15 m / 10 m); bổ sung ga theo mét ống lỏng (Φ1/4": 20 g/m).
- Hút chân không dàn lạnh và ống nối trước khi mở van; không dùng dầu bịt lỗ thoát nước.
- Dây nối giữa hai cụm không nhỏ hơn 1,6 mm, sụt áp ≤ 2 V, phải tiếp đất.
- AUTO: ≥30 °C lạnh 27 °C; 27–30 lạnh 26; 24–27 hút ẩm 24; 22–24 giám sát 23; <22 sưởi.
- Phin lọc khí vệ sinh 2 tuần/lần; vệ sinh dàn nóng/lạnh ít nhất mỗi năm.
- Nhiều "hư hỏng" thực ra là hiện tượng bình thường (chờ 3 phút, tiếng ga chảy, sương, xả băng).
## 🔶 13. Đường ống và kỹ thuật gia công đường ống
### 🔶 Ống đồng mềm và ống đồng cứng
### ✂️ Cắt ống

### 📝 Tóm tắt
- Ống đồng lạnh làm sạch bên trong, bịt hai đầu; ống mềm cuộn 7,6/15 m, ống cứng thẳng 6,1 m.
- Bán kính uốn tối thiểu R ≥ 5d; dùng lò xo uốn ống hoặc dụng cụ cần xoay.
- Cắt ống: quay mặt cắt xuống khi nạo bavia; làm sạch mạt đồng.
- Loe: ống nhô A đúng cỡ (≈1 mm); tiến nửa vòng lùi 1/4 vòng; loe đủ 90°; ram ống nếu nứt.
- Hàn thiếc cho đường nước; hàn bạc cho đường ga; độ bền do khe hở măng sông.
- Khi hàn thổi nitơ/CO₂ bảo vệ — không dùng ga lạnh, oxy, khí nén.
- Thắt ống chống nước hàn chảy vào trong; kẹp ống công nghệ trước khi hàn bịt.
- Siết mũ ren theo mômen: Ø9,5: 33–40 N·m; Ø12,7: 50–62; Ø15,9: 63–77; Ø19,1: 100–120.

### 📝 Tóm tắt
- Bộ nạp 3 dây: van L (hạ áp, LO, đường hút), van H (cao áp, HI), đầu C giữa nối chai ga/bơm chân không.
- Hút chân không khoảng 1 giờ, tráng ga 2 lần trước khi nạp.
- Van dịch vụ dàn nóng: vặn xuống = khóa; nâng lên = khóa cửa dịch vụ, thông hệ; lưng chừng = thông cả ba ngả.
- Thử kín bằng nitơ: 7 bar trong 1 giờ, 12 bar trong 24 giờ; hiệu chỉnh theo nhiệt độ T₂/T₁; không dùng oxi.
- Đèn halide: ngọn lửa xanh lục/xanh da trời khi gặp halogen; đặt vòi hút phía dưới vì ga nặng hơn không khí.
- Sửa rò: xả sạch ga, không nung phin lọc, không cưa ống; hàn bạc cho thép/đồng, epoxy cho nhôm.
- Nạp ga tủ lạnh ở dạng hơi vào đường hút, nạp từ từ; dùng xi lanh nạp ga để nạp chính xác.
- Ampe kìm ngoặm một dây; vạn năng kế phải đúng nấc, nối tiếp khi đo dòng, song song khi đo áp.

### 📝 Tóm tắt
- Trước khi thay blốc phải xác định chính xác hỏng điện hay cơ: dùng phích riêng, tháo rơle, đo thông mạch – cách điện.
- Thử nén bằng van trích: chân không giảm nhanh về 680 → 330 mbar thì van xả rò.
- Ống mao: không cắt bằng dao cắt ống hay cưa; dùng dũa tam giác rồi bẻ; thay ống mao đúng trở lực.
- Nạp đủ ga: tk ≈ tmt + 17 °C; thừa ga: cả ba áp suất cao; thiếu ga: cả ba thấp.
- Thử còn ga bằng hơ nóng ống trước phin; chính xác hơn dùng van trích: lỏng xì ra là đủ ga.
- Thu hồi ga trước khi tháo; không cưa ống; bịt kín đầu ống; đeo kính.
- Nguyên nhân cháy blốc: ẩm, bẩn, khí, quá tải, thiếu ga, áp đẩy cao (đầu đẩy ≥ 170 °C dầu mất khả năng bôi trơn).
- Thay blốc mới: vệ sinh kỹ, hai phin sấy lọc, hút chân không ≥ 1 giờ + 3 bước, nạp đúng lượng, kiểm tra nhiều chu kỳ.
