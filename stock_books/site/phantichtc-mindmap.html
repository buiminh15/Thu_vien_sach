# 📈 Phân tích tài chính
## 🧭 1. Vai trò của quản trị tài chính
### 🧭 Quản trị tài chính là gì?
### 🎯 Mục tiêu của công ty
### 🏢 Tổ chức công ty và chức năng tài chính
### 📝 Tóm tắt
- Quản trị tài chính gồm quyết định đầu tư, tài trợ, quản lý tài sản.
- Mục tiêu: tối đa hóa giá trị tài sản chủ sở hữu → tối đa hóa thị giá cổ phiếu, vì nó tính đến thời gian, rủi ro, cổ tức.
- EAT và EPS đều có hạn chế (bỏ qua thời giá tiền, rủi ro, cổ tức).
- Vấn đề đại diện giữa cổ đông và giám đốc cần giám sát và khuyến khích; trách nhiệm xã hội và các bên liên quan.
## 🏛️ 2. Môi trường kinh doanh và tài chính
### 🏛️ Các loại hình doanh nghiệp
### 💸 Môi trường thuế
### 📝 Tóm tắt
- Loại hình doanh nghiệp quyết định trách nhiệm pháp lý, khả năng huy động vốn, thuế.
- Công ty cổ phần: trách nhiệm hữu hạn, dễ huy động vốn, sống mãi, nhưng bị đánh thuế 2 lần.
- Thu nhập chịu thuế = doanh thu − chi phí hợp lý (khấu hao, lãi vay).
- Khấu hao là chi phí được trừ thuế → lá chắn thuế; đường thẳng: giá trị ÷ số năm.
## 🪙 3. Thời giá tiền tệ
### 🪙 Lãi đơn, lãi kép, FV và PV của một số tiền
### 🔁 Dòng tiền: niên kim, vĩnh cửu và hỗn tạp
### 🔄 Ghép lãi nhiều lần trong năm; lãi suất danh nghĩa và hiệu dụng
### 🏠 Vay trả góp
### 📝 Tóm tắt
- Lãi đơn chỉ tính trên gốc; lãi kép tính cả lãi trên lãi: FV = P(1+i)ⁿ; PV = FV/(1+i)ⁿ.
- Niên kim: FVA = R·[(1+i)ⁿ−1]/i; PVA = R·[1−(1+i)⁻ⁿ]/i; vĩnh cửu: R/i; đầu kỳ nhân thêm (1+i).
- Ghép lãi nhiều lần: (1+i/m)^(mn); liên tục: e^(in); lãi suất hiệu dụng ≥ danh nghĩa.
- Vay trả góp: khoản trả đều R = Vay / PVIFA; lãi giảm dần, gốc tăng dần.
## ⚖️ 4. Định giá chứng khoán (trái phiếu)
### ⚖️ Các cặp khái niệm về giá trị
### 📜 Trái phiếu và nguyên tắc định giá
### 📝 Tóm tắt
- Giá trị thanh lý ≠ giá trị hoạt động; sổ sách ≠ thị trường; thị trường ≠ lý thuyết.
- Giá trái phiếu = hiện giá dòng lãi + hiện giá mệnh giá chiết khấu ở lãi suất yêu cầu.
- Vĩnh cửu: I/k; zero-coupon: MV/(1+k)ⁿ; bán niên: nửa lãi, gấp đôi kỳ, nửa lãi suất.
- k_d > coupon → giá mệnh giá.
## 📈 5. Lợi nhuận và rủi ro
### 📈 Lợi nhuận và rủi ro
### 📐 Đo lường rủi ro
### 🎲 Thái độ đối với rủi ro
### 🧺 Danh mục đầu tư và đa dạng hóa
### 📝 Tóm tắt
- Lợi nhuận = (cổ tức + lợi vốn)/giá mua; rủi ro = sai biệt giữa lợi nhuận thực và kỳ vọng.
- Đo rủi ro bằng độ lệch chuẩn; so sánh khác quy mô dùng hệ số biến đổi CV = σ/E(R).
- Ngại rủi ro: CE < giá trị kỳ vọng; phần chênh là phần bù rủi ro.
- Danh mục: lợi nhuận trung bình trọng số; rủi ro phụ thuộc tương quan; đa dạng hóa loại bỏ rủi ro không hệ thống, còn lại rủi ro hệ thống (beta).
## 📈 6. Mô hình định giá tài sản vốn (CAPM)
### 📈 Giới thiệu và giả định
### 📉 Đường đặc thù chứng khoán và beta
### 🧮 Mô hình CAPM và đường SML
### 🔬 Ưu nhược điểm và phê phán
### 🔀 Lý thuyết định giá kinh doanh chênh lệch (APT)
### 📝 Tóm tắt
- CAPM: E(R) = R_f + β[E(R_m) − R_f]; SML là đường thẳng; β = 0 → R_f; β = 1 → thị trường.
- β đo rủi ro hệ thống, ước lượng bằng hồi quy; β_p = trung bình trọng số.
- Hạn chế: hiệu ứng quy mô, PE/MB, tháng Giêng, Fama–French; beta vẫn hữu ích cho tài chính công ty.
- APT/đa yếu tố: lợi nhuận phụ thuộc nhiều yếu tố rủi ro, mỗi yếu tố có giá λ.
## 📑 7. Phân tích báo cáo tài chính
### 📑 Mục đích và nội dung phân tích
### 💹 Phân tích khả năng sinh lời
### 🛟 Rủi ro thanh toán ngắn hạn
### ⛓️ Rủi ro thanh toán dài hạn
### 📝 Tóm tắt
- Ba báo cáo: cân đối kế toán, kết quả kinh doanh, lưu chuyển tiền tệ.
- ROA = biên lợi nhuận × vòng quay tài sản; ROE = biên ròng × vòng quay × đòn bẩy (DuPont).
- ROE > ROA khi ROA > chi phí nợ; đòn bẩy khuếch đại cả lãi lẫn lỗ.
- Thanh toán ngắn hạn: hiện hành (>1), nhanh, vòng quay phải thu/tồn kho/phải trả.
- Thanh toán dài hạn: nợ/vốn, ngân lưu/nợ, bảo đảm lãi vay = EBIT/lãi vay.
## 💼 8. Quản trị tiền mặt và chứng khoán đầu tư
### 💼 Vì sao giữ tiền mặt
### ⚖️ Số dư tiền mặt mục tiêu và mô hình Baumol
### 🎢 Mô hình Miller–Orr
### 🚚 Tiền đang chuyển (float) và đầu tư tiền nhàn rỗi
### 📝 Tóm tắt
- Ba động cơ giữ tiền: giao dịch, đầu cơ, dự phòng.
- Số dư tối ưu cân bằng chi phí cơ hội (giữ nhiều) và chi phí giao dịch (giữ ít).
- Baumol: C* = √(2FT/K) với giả định đơn giản; Miller–Orr xử lý thu chi ngẫu nhiên với ngưỡng L, Z, H.
- Tiền đang chuyển gây tổn thất chi phí cơ hội; đầu tư tiền nhàn rỗi vào chứng khoán ngắn hạn.
## 🧾 9. Quản trị khoản phải thu và hàng tồn kho
### 🧾 Quản trị khoản phải thu: đánh đổi lợi nhuận – rủi ro
### 🧮 Ví dụ 1: nới lỏng tiêu chuẩn bán chịu
### 📆 Ví dụ 2–3: thời hạn và chiết khấu
### 📦 Quản trị và kiểm soát tồn kho
### 📝 Tóm tắt
- Bán chịu: so sánh lợi nhuận tăng thêm với phí tổn đầu tư vào khoản phải thu (và nợ xấu).
- Phí tổn đầu tư phải thu = phải thu tăng × (chi phí khả biến/giá bán) × chi phí cơ hội.
- Chiết khấu: tiết kiệm chi phí cơ hội vs chi phí chiết khấu; chọn chính sách có lợi nhuận ròng cao nhất.
- Tồn kho: phân loại ABC; EOQ = √(2SO/C); điểm đặt hàng = thời gian chờ × lượng dùng/ngày (+ dự trữ an toàn).
## 🏗️ 10. Dự toán vốn đầu tư
### 🏗️ Bài toán dự toán vốn đầu tư
### 💵 Vì sao dùng ngân lưu, không dùng lợi nhuận?
### 🧭 Các tiêu chuẩn đánh giá dự án
### 💰 Chọn dự án khi giới hạn ngân sách
### 📝 Tóm tắt
- Dự án đánh giá bằng ngân lưu tăng thêm sau thuế, chiết khấu về hiện tại; khấu hao tạo lá chắn thuế.
- NPV > 0 → chấp nhận; IRR là suất làm NPV = 0 (có thể nhiều nghiệm).
- Hoàn vốn và ARR đơn giản nhưng bỏ qua thời giá tiền hoặc dòng tiền sau hoàn vốn.
- PI = NPV/ICO + 1; khi giới hạn ngân sách, xếp hạng theo PI.
## 🎚️ 11. Chi phí sử dụng vốn
### 🎚️ Chi phí vốn là gì?
### 🏦 Chi phí nợ và cổ phiếu ưu đãi
### 📊 Chi phí vốn cổ phần thường
### 🧮 WACC — chi phí vốn bình quân trọng số
### 📝 Tóm tắt
- Chi phí vốn = suất sinh lời yêu cầu = suất chiết khấu của dự án.
- Chi phí nợ sau thuế = R_D(1 − T); cổ phiếu ưu đãi R_p = D_p/P_net, không được giảm thuế.
- Chi phí vốn cổ phần: DCF (D₁/P₀ + g) và CAPM; thường lấy trung bình.
- WACC dùng cho dự án rủi ro như công ty; dự án rủi ro khác phải điều chỉnh (+/−).
## ⚙️ 12. Đòn bẩy hoạt động và đòn bẩy tài chính
### ⚙️ Đòn bẩy hoạt động
### ⚖️ Phân tích hòa vốn
### 📐 Độ bẩy hoạt động (DOL)
### 🏦 Đòn bẩy tài chính và điểm bàng quan EBIT–EPS
### 📏 Độ bẩy tài chính (DFL), rủi ro tài chính, đòn bẩy tổng hợp
### 📝 Tóm tắt
- Đòn bẩy hoạt động = chi phí cố định; khuếch đại thay đổi sản lượng thành thay đổi EBIT.
- Hòa vốn Q = F/(P − V); DOL = Q(P−V)/[Q(P−V) − F], cao nhất gần điểm hòa vốn.
- Đòn bẩy tài chính = nguồn vốn chi phí cố định; điểm bàng quan EBIT–EPS cho biết khi nào nợ tốt hơn cổ phiếu thường.
- DFL = EBIT/[EBIT − I − PD/(1−t)]; DTL = DOL × DFL; đòn bẩy cao khuếch đại cả lãi lẫn rủi ro.
## 🍰 13. Quyết định cơ cấu vốn của công ty
### 🍰 Đặt vấn đề
### 🎯 Lý thuyết cơ cấu vốn tối ưu (truyền thống)
### 🧱 Lý thuyết lợi nhuận hoạt động ròng (NOI)
### 🧩 Lý thuyết M&M (Modigliani – Miller, 1958)
### 📝 Tóm tắt
- Cơ cấu vốn tối ưu (truyền thống): có điểm nợ tối ưu cân đối rủi ro và lợi nhuận; thuế, rủi ro kinh doanh, chủ động tài chính, thái độ quản lý ảnh hưởng.
- NOI: k_o và V không đổi; nợ tăng làm k_e tăng; giá cổ phiếu không đổi.
- M&M: không thuế, thị trường hoàn hảo → giá trị công ty độc lập với cơ cấu vốn; arbitrage đảm bảo.
- Ví dụ BCL: nợ 50% nâng E(EPS) từ 2,40 lên 3,36 nhưng tăng rủi ro (EPS âm khi doanh thu thấp).
## 🔑 14. Thuê tài sản: thuê hay mua?
### 🔑 Hai loại thuê tài sản
### 🎁 Lợi ích của việc thuê
### 🧮 So sánh chi phí thuê và chi phí mua
### 📒 Tác động đến báo cáo tài chính
### 📝 Tóm tắt
- Thuê hoạt động linh hoạt, phí cao; thuê tài chính là phương pháp tài trợ giống vay nợ.
- Lợi ích: tránh rủi ro sở hữu, linh hoạt, thuế, kịp thời, giảm hạn chế tín dụng.
- Chi phí thuê chiết khấu theo chi phí nợ sau thuế; chi phí mua trừ lá chắn khấu hao và thanh lý (thanh lý theo WACC).
- Thuê tài chính ghi vào tài sản và nợ; thuê hoạt động không.
## 📜 15. Công cụ tài chính phái sinh: hợp đồng tương lai và quyền chọn
### 📜 Hợp đồng kỳ hạn và hợp đồng tương lai
### 🏧 Ký quỹ và tính theo giá thị trường hàng ngày
### ↕️ Giá trị hợp đồng khi đáo hạn và định giá tương lai
### 🎯 Quyền chọn (options)
### 📝 Tóm tắt
- Phái sinh: giá trị phụ thuộc tài sản cơ sở; forward thương lượng riêng, futures chuẩn hóa và tính hàng ngày.
- Giá tương lai F₀ = S₀(1 + r_f − d)^T theo nguyên tắc không arbitrage.
- Ký quỹ, bảo chứng duy trì, marking to market giảm rủi ro thanh toán.
- Quyền chọn: call/put; giá trị đáo hạn max(S−X;0), max(X−S;0); người mua trả phí; các yếu tố ảnh hưởng giá.
## 🌍 16. Phân tích tài chính quốc tế
### 🌍 Những yếu tố ảnh hưởng khi phân tích tài chính quốc tế
### 💱 Ba loại rủi ro tỷ giá
### 🏦 Thị trường ngoại hối Việt Nam (tư liệu lịch sử)
### 🏷️ Yết giá và tỷ giá chéo
### ⚡ Giao dịch giao ngay, kỳ hạn và hoán đổi
### 📝 Tóm tắt
- Đa dạng hóa quốc tế giảm cả rủi ro hệ thống; thuế khác nhau; có rủi ro chính trị.
- Ba loại rủi ro tỷ giá: chuyển đổi, giao dịch, kinh tế.
- Yết giá trực tiếp/gián tiếp; tỷ giá mua/bán; tỷ giá chéo qua USD.
- Kỳ hạn tính theo IRP: F = S(1 + i_VND·n)/(1 + i_USD·n); hoán đổi = giao ngay + kỳ hạn; có thu ngoại tệ → bán kỳ hạn, có nợ ngoại tệ → mua kỳ hạn.
## 🔥 17. Rủi ro tỷ giá và cách tự bảo hiểm
### 🔥 Rủi ro tỷ giá phát sinh ở đâu?
### 🛡️ Có nên tự bảo hiểm không?
### 🧰 Bảy phương pháp tự bảo hiểm
### 🏦 Tự bảo hiểm bằng thị trường tiền tệ
### 📝 Tóm tắt
- Rủi ro tỷ giá phát sinh khi thu chi bằng hai đồng tiền khác nhau: đầu tư, xuất nhập khẩu, tín dụng.
- Quyết định ngừa hay không dựa vào dự báo, khả năng chịu đựng và thái độ rủi ro; khoản thiệt là phí bảo hiểm.
- Bảy cách: song hành, quỹ dự phòng, kỳ hạn, hoán đổi, tương lai, quyền chọn, thị trường tiền tệ.
- Xuất khẩu: bán kỳ hạn/mua put/vay ngoại tệ bán ngay; nhập khẩu: mua kỳ hạn/mua call/vay nội tệ mua ngoại tệ ngay.
