# 🏦 Fundamentals of Corporate Finance
## 🏢 1. Doanh nghiệp và nhà quản lý tài chính
### 🏢 Các hình thức tổ chức kinh doanh
### 🧭 Hai quyết định lớn của nhà quản lý tài chính
### 🎯 Mục tiêu của công ty và vấn đề đại diện
### 📝 Tóm tắt
- Công ty cổ phần có trách nhiệm hữu hạn và tách sở hữu khỏi quản lý, đổi lại bị đánh thuế hai lần.
- Hai quyết định cốt lõi: đầu tư và tài trợ.
- Nhà quản lý tài chính là cầu nối giữa công ty và thị trường tài chính.
- Mục tiêu: tối đa hóa giá trị thị trường cổ phần, trong khuôn khổ đạo đức.
- Vấn đề đại diện được kiềm chế bằng thù lao, giám sát và nguy cơ bị thâu tóm.
## 📈 2. Giá trị thời gian của tiền
### 📈 Giá trị tương lai và giá trị hiện tại
### 🧮 Nhiều dòng tiền, niên kim và vĩnh viễn
### 🎈 Lạm phát và lãi suất hiệu dụng
### 📝 Tóm tắt
- FV = PV(1+r)^t; PV = FV/(1+r)^t.
- PV của nhiều dòng tiền là tổng PV từng dòng.
- Vĩnh viễn: C/r; niên kim có công thức tắt; có biến thể tăng trưởng.
- Phân biệt lãi danh nghĩa và lãi thực, không trộn lẫn.
- EAR phản ánh lãi kép; APR thì không.
## 🗺️ 3. Hoạch định tài chính
### 🗺️ Hoạch định tài chính là gì?
### 🧩 Mô hình phần trăm doanh thu
### 🚀 Tăng trưởng và tài trợ bên ngoài
### 📝 Tóm tắt
- Kế hoạch tài chính nêu chiến lược và dự phóng báo cáo tài chính; quá trình lập cũng quan trọng như kết quả.
- Hoạch định rộng hơn dự báo: phải nghĩ đến biến cố bất lợi.
- Mô hình phần trăm doanh thu cho ra EFN.
- Tăng trưởng nội bộ không cần tài trợ ngoài; bền vững giữ nguyên đòn bẩy.
- Tăng trưởng nhanh đòi hỏi nhiều vốn hơn.
## 📋 4. Kế toán và tài chính
### 📋 Ba báo cáo tài chính
### ⚖️ Giá trị sổ sách và giá trị thị trường
### 💵 Lợi nhuận khác dòng tiền
### 🧾 Thuế
### 📝 Tóm tắt
- Ba báo cáo: cân đối (thời điểm), kết quả (kỳ), lưu chuyển tiền tệ.
- Sổ sách dựa trên chi phí lịch sử, không phải giá trị thị trường.
- Lợi nhuận khác dòng tiền vì khấu hao và chênh lệch thời điểm ghi nhận.
- Lãi vay được trừ thuế còn cổ tức thì không.
## 🔢 5. Phân tích báo cáo tài chính
### 🔢 Bốn nhóm tỷ số
### 🧬 Hệ thống Du Pont
### 🚧 Cạm bẫy khi dùng tỷ số
### 📝 Tóm tắt
- Bốn nhóm: đòn bẩy, thanh khoản, hiệu quả, sinh lời (cộng định giá thị trường).
- Du Pont phân rã ROE thành các nhân tố.
- Cần mốc so sánh và phán đoán, không dùng máy móc.
- Tỷ số giúp đặt câu hỏi hơn là đưa đáp án.
## 🔄 6. Quản lý vốn lưu động và hoạch định ngắn hạn
### 🔄 Vốn lưu động và chu kỳ tiền mặt
### 🔗 Liên hệ giữa tài trợ dài hạn và ngắn hạn
### 🗓️ Ngân sách tiền mặt và kế hoạch tài trợ ngắn hạn
### 🏦 Chi phí thực của khoản vay ngân hàng
### 📝 Tóm tắt
- Vốn lưu động ròng nảy sinh từ độ trễ thu–chi.
- CCC = kỳ tồn kho + kỳ thu tiền − kỳ trả tiền.
- Chính sách tài trợ dài hạn quyết định mô hình vay/dư tiền ngắn hạn.
- Ngân sách tiền mặt phát hiện thiếu hụt trước khi nó xảy ra.
- Chi phí vay thực khác lãi niêm yết.
## ⏳ 7. Quản lý tiền mặt và hàng tồn kho
### ⏳ Float: khoảng chênh giữa sổ sách và tài khoản
### 📦 Hàng tồn kho và mô hình EOQ
### 💰 Giữ bao nhiêu tiền mặt?
### 📝 Tóm tắt
- Float giúp "chơi" độ trễ séc nhưng cần dự báo chính xác.
- Lockbox và ngân hàng tập trung rút ngắn thời gian thu tiền.
- EOQ cân bằng chi phí đặt hàng và giữ hàng.
- Tiền mặt cũng như tồn kho: có chi phí cơ hội.
## 🧾 8. Quản lý tín dụng và thu nợ
### 🧾 Điều khoản bán và lãi suất ẩn
### 🔎 Phân tích tín dụng
### ⚖️ Quyết định cấp tín dụng
### 📞 Chính sách thu nợ và phá sản
### 📝 Tóm tắt
- Năm bước: điều khoản, hợp đồng, phân tích, chính sách tín dụng, thu nợ.
- Bỏ qua chiết khấu thanh toán sớm là khoản vay rất đắt.
- Cấp tín dụng đáng làm nếu giá trị kỳ vọng dương, tính cả khả năng mua lặp lại.
- Bảng tuổi nợ theo dõi nợ quá hạn.
## 📜 9. Định giá trái phiếu
### 📜 Đặc điểm của trái phiếu
### 🧮 Giá và lợi suất
### 🎢 Rủi ro lãi suất và rủi ro tín dụng
### 📝 Tóm tắt
- Giá = PV(coupon) + PV(mệnh giá) tại YTM.
- Giá và lợi suất ngược chiều.
- Kỳ hạn càng dài, rủi ro lãi suất càng lớn.
- Rủi ro tín dụng đòi phần bù vỡ nợ; xếp hạng đo rủi ro đó.
## 🏛️ 10. Định giá cổ phiếu
### 🏛️ Cổ phiếu và các loại giá trị
### 🧮 Mô hình chiết khấu cổ tức
### 🌱 Cổ phiếu tăng trưởng, cổ phiếu thu nhập và P/E
### 📝 Tóm tắt
- Giá cổ phiếu = PV cổ tức + PV giá bán tương lai.
- Gordon: P₀ = DIV₁/(r − g).
- r = tỷ suất cổ tức + g.
- P/E phản ánh cơ hội tăng trưởng (PVGO).
## 📚 11. Rủi ro, lợi suất và chi phí cơ hội của vốn
### 📚 Lịch sử thị trường vốn
### 📏 Đo rủi ro
### 🧺 Đa dạng hóa
### 📝 Tóm tắt
- Phần bù rủi ro lịch sử khoảng 9,4%; độ lệch chuẩn thị trường ~20%.
- Chi phí cơ hội ≈ lãi phi rủi ro + phần bù rủi ro.
- Đa dạng hóa loại bỏ rủi ro riêng.
- Rủi ro thị trường không thể loại bỏ và mới được bù đắp.
## ➕ 12. Giá trị hiện tại ròng và các tiêu chí đầu tư khác
### ➕ Giá trị hiện tại ròng (NPV)
### 📐 IRR, hoàn vốn, lợi nhuận kế toán
### 🧩 Dự án tác động lẫn nhau
### 📝 Tóm tắt
- NPV dương → tăng giá trị cổ đông.
- IRR có thể gây hiểu nhầm với dự án loại trừ nhau hoặc dòng tiền đổi dấu nhiều lần.
- Hoàn vốn và lợi nhuận kế toán chỉ là quy tắc thô.
- EAC và PI giúp so sánh dự án đặc biệt.
## ✅ 13. Phân tích dòng tiền chiết khấu để ra quyết định đầu tư
### ✅ Danh sách kiểm tra dòng tiền dự án
### 🧱 Các nguyên tắc nhất quán
### ⛏️ Ví dụ tổng hợp: Blooper Industries
### 📝 Tóm tắt
- Chiết khấu dòng tiền tăng thêm, không phải lợi nhuận.
- Bỏ chi phí chìm; tính chi phí cơ hội và vốn lưu động.
- Nhất quán danh nghĩa/thực; tách đầu tư với tài trợ.
- Khấu hao tạo lá chắn thuế.
## 📊 14. Rủi ro, lợi suất và ngân sách vốn
### 📊 Beta: đo rủi ro thị trường
### 📈 CAPM và đường thị trường chứng khoán (SML)
### 🏗️ Rủi ro dự án và chi phí vốn
### 📝 Tóm tắt
- Beta đo rủi ro thị trường của chứng khoán.
- CAPM: r = r_f + β(r_m − r_f).
- Chi phí vốn phải gắn với rủi ro của dự án.
- Beta danh mục là trung bình trọng số.
## ⚖️ 15. Chi phí vốn
### ⚖️ Công thức WACC
### 🧩 Ước lượng từng thành phần
### 🧭 Cách dùng và giới hạn của WACC
### 📝 Tóm tắt
- WACC = trung bình có trọng số của chi phí nợ sau thuế và chi phí vốn chủ.
- Trọng số theo giá trị thị trường.
- Chi phí vốn chủ qua CAPM hoặc DDM.
- Điều chỉnh WACC theo rủi ro dự án.
## 🏗️ 16. Phân tích dự án
### 🏗️ Quy trình đầu tư trong công ty lớn
### 🎛️ Công cụ "nếu... thì sao?"
### ⚖️ Hòa vốn và đòn bẩy hoạt động
### 📝 Tóm tắt
- Luôn hỏi vì sao dự án có NPV dương.
- Độ nhạy, kịch bản, mô phỏng, hòa vốn: các cách thử dự báo.
- Đòn bẩy hoạt động làm lợi nhuận nhạy với doanh thu.
- Tính linh hoạt có giá trị (quyền chọn thực).
## 📈 17. Tổng quan về tài trợ doanh nghiệp
### 📈 Cổ phiếu thường và cổ phiếu ưu đãi
### 💳 Nợ doanh nghiệp
### 🔀 Chứng khoán chuyển đổi và mô hình tài trợ
### 📝 Tóm tắt
- Cổ phiếu thường: biến động, quyền biểu quyết; ưu đãi: cổ tức cố định.
- Lãi vay trừ thuế, cổ tức thì không.
- Nợ có nhiều dạng: lãi cố định/thả nổi, ngắn/dài hạn, có/không bảo đảm...
- Trái phiếu chuyển đổi có quyền đổi sang cổ phiếu.
- Thực tế: lợi nhuận giữ lại + nợ là nguồn chính.
## 🌱 18. Cách công ty phát hành chứng khoán
### 🌱 Vốn mạo hiểm
### 🚀 Phát hành lần đầu ra công chúng (IPO)
### 🏛️ Phát hành chung và bán riêng lẻ
### 📝 Tóm tắt
- Vốn mạo hiểm giữ nhà sáng lập cùng chiều lợi ích và tài trợ theo giai đoạn.
- IPO có chi phí trực tiếp, spread và underpricing.
- Phát hành thêm thường làm giá cổ phiếu giảm.
- Bán riêng lẻ rẻ hơn nhưng kém thanh khoản.
## 🔑 19. Thuê tài sản (Phụ lục B)
### 🔑 Hai loại hợp đồng thuê
### 🧾 Thuế và kế toán
### ⚖️ Thuê hay mua?
### 📝 Tóm tắt
- Thuê hoạt động ngắn, hủy được; thuê tài chính dài, như vay.
- Thuê tài chính được ghi nhận như nợ trên bảng cân đối.
- Quyết định thuê hay mua dựa vào NPV dòng tiền chênh lệch, chiết khấu bằng lãi vay sau thuế.
## ❓ 20. Đòn bẩy và cơ cấu vốn (Phụ lục B)
### ❓ Câu hỏi cơ cấu vốn
### 🔌 Tác động của đòn bẩy tài chính
### 📝 Tóm tắt
- Cơ cấu vốn là cách chia tài trợ giữa nợ và vốn chủ.
- Đòn bẩy khuếch đại EPS và ROE cả hai chiều.
- Thực tế có thuế và chi phí kiệt quệ nên có đánh đổi.
## 🏰 21. Sáp nhập, mua lại và quyền kiểm soát doanh nghiệp
### 🏰 Thị trường quyền kiểm soát
### ✅ Động cơ hợp lý và đáng ngờ
### ⚔️ Chiến thuật và LBO
### 📝 Tóm tắt
- Bốn cách thay đổi quyền kiểm soát: proxy, mua lại, LBO, bán bớt hoạt động.
- Sáp nhập hợp lý khi V(AB) > V_A + V_B.
- NPV bên mua = lợi ích − phần bù.
- Động cơ đa dạng hóa và tăng EPS giả tạo đáng ngờ.
## 💱 22. Quản lý tài chính quốc tế
### 💱 Thị trường ngoại hối
### 🔗 Bốn quan hệ cơ bản
### 🛡️ Phòng ngừa và ngân sách vốn quốc tế
### 📝 Tóm tắt
- Spot áp dụng ngay, forward cho ngày tương lai.
- PPP, Fisher quốc tế, IRP, forward là ước tính tỷ giá tương lai.
- Hedge để khóa tỷ giá.
- Ngân sách vốn quốc tế cần nhất quán về đồng tiền.
