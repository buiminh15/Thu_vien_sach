# 🗓 Stock Trader's Almanac 2005

### 📝 Tóm tắt
- Almanac dùng lịch sử/mùa vụ làm công cụ phụ, không phải công thức chắc thắng.

## 📆 3. 6 tháng tốt nhất (tháng 11–4) và MACD

## 1️⃣ 4. Mùa vụ trong năm: tháng, quý và các “mùa” rally
### 1️⃣ Tháng đầu quý mạnh nhất

- Tháng đầu của ba quý đầu (1, 4, 7) là mạnh nhất.

## 🗳 5. Chính trị và chu kỳ: tổng thống, thập niên

### 📝 Tóm tắt
- Năm sau bầu cử thường yếu: “trả nợ” cho năm bầu cử.

- Tổng thống Dân chủ + Quốc hội Cộng hòa cho Dow tốt nhất (11,5%); bế tắc là tốt.
## 🗓 6. Ngày và tuần: thứ trong tuần, đầu tháng, nghỉ lễ, triple witching
### 🗓 Thứ trong tuần
### 1️⃣ Ngày giao dịch đầu tháng & 8 ngày “siêu”
### 🎄 Nghỉ lễ và Triple Witching
### 📝 Tóm tắt
- Thứ Hai mạnh, thứ Sáu yếu (từ 1990); thứ Hai đóng góp gần 6 lần các ngày còn lại gộp.
- Ngày đầu tháng đóng góp lớn hơn tổng điểm tăng của Dow.
- 8 ngày siêu: 3 ngày cuối + 2 đầu + 3 giữa tháng.
- Triple witching: tuần hết hạn thường mạnh, tuần sau yếu.
