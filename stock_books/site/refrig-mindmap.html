# 🧊 Sổ tay kỹ thuật viên tủ lạnh nén (WHO/EPI)
## 📘 1. Ống đồng tủ lạnh: cắt, doa, uốn, loe, nong
### 📘 Cách dùng sổ tay (Phần A)
### 🔧 Đặc tính ống tủ lạnh
### ✂️ Cắt và doa ống
### ↪️ Uốn ống
### 🔔 Loe ống (flare)
### ⭕ Nong ống (swage)
### 📝 Tóm tắt
- Chỉ dùng ống đồng mềm, sạch, chuyên dụng tủ lạnh; đo theo đường kính ngoài (6 mm, 8 mm); cuộn 6 m.
- Cắt ống bằng dao cắt, tăng lực dần, rồi doa với đầu ống chúc xuống.
- Uốn từng chút bằng lò xo uốn; bán kính uốn tối thiểu 1 inch với ống 6 mm.
- Loe: lồng đai ốc trước, nhô = đường kính ÷ 3, bôi dầu, vặn côn chậm. Nong: nhô = đường kính + 3 mm.
## 🔥 2. Hàn đồng (brazing), hàn thiếc (soldering) và sửa tạm
### 🔥 Chuẩn bị: ủ mềm và làm sạch
### 🔩 Hàn đồng mối nong
### 🔥 Đèn hàn
### 💡 Hàn thiếc điện và đèn thử
### 🩹 Sửa tạm rò rỉ
### 📝 Tóm tắt
- Ủ ống tới đỏ sẫm, để nguội chậm; làm sạch bằng bùi nhùi thép, không dùng giấy nhám.
- Hàn đồng mối nong: khe vừa khít, ít flux, chạm que thử nhiệt, vòng hàn trọn, không xê dịch.
- Đèn hàn: axetylen xanh có chóp nhọn; propan nóng hơn nên lửa nhỏ hơn; kiểm rò khí bằng nước xà phòng.
- Hàn thiếc cho điện (thiếc có lõi flux); sửa tạm: epoxy cho áp thấp, que hàn nhiệt cho áp cao — chỉ tạm.
## 📌 3. Đấu nối vào hệ thống và an toàn khi dùng R12
### 📌 Van chọc ống (line tap valve)
### 🧵 Nối vào ống xử lý (process tube) của máy nén
### ☠️ 15 quy tắc an toàn với R12
### 📝 Tóm tắt
- Van chọc ống: chọn ống thẳng, vặn van chọc ra hết, siết đều, vặn cùng chiều kim đồng hồ để chọc, ngược lại để rút; xong thì bịt bằng van chọc và nắp.
- Ống xử lý: ba cách nối — loe (tạm, không hàn), hàn (vĩnh viễn), khớp nối nhanh (nhanh, tạm); luôn bảo vệ máy nén khỏi nhiệt.
- Xong việc: bóp lại và hàn bít ống xử lý.
- An toàn R12: thông gió, tránh nguồn nhiệt, găng/kính, bình không đầy quá 3/4, không xả cạn, không vượt áp thử; hiện nay R12 phải thu hồi chứ không xả.
## ♻️ 4. Chu trình làm lạnh và đồng hồ phân tích (system analyser)
### ♻️ Hệ thống làm lạnh hoạt động thế nào
### 🧰 Đồng hồ phân tích (system analyser)
### 📏 Nối đồng hồ để đo áp suất
### 📝 Tóm tắt
- Vòng môi chất: máy nén → ống đẩy → dàn ngưng → lọc hút ẩm → mao dẫn (phun) → dàn bay hơi (lạnh) → ống hút → máy nén.
- Phía áp cao (đỏ): máy nén → mao dẫn; phía áp thấp (xanh): mao dẫn → dàn bay hơi → ống hút.
- Mao dẫn có thể chạy trong hoặc quấn ngoài ống hút để trao đổi nhiệt; một số tủ có hai dàn ngưng làm mát dầu.
- Manifold: đo = đóng hai van; nạp = mở van xanh; hút chân không = mở cả hai.
## ⚠️ 5. Xả môi chất, hút chân không, nạp gas và tìm rò rỉ
### ⚠️ Xả môi chất khỏi hệ thống (theo sổ tay 1985)
### 🌬️ Hút chân không (evacuate)
### 🛢️ Chuyển R12 lỏng sang bình dịch vụ
### ⛽ Nạp gas vào hệ thống
### 🔎 Tìm rò rỉ R12
### 📝 Tóm tắt
- Trình tự: xả (nay thu hồi) → sửa → hút chân không ≥ 28 inchHg (−0,9 bar), giữ được → nạp khí (bình thẳng đứng) → tìm rò.
- Hút chân không: bơm chạy ~5 phút; bơm nóng thì nghỉ 15 phút; chân không phải được giữ khi tắt bơm.
- Nạp: phải cho chút R12 vào trước khi chạy máy nén; dừng khi có sương muối trên ống hút; bóp ống xử lý 2 lần rồi hàn bít.
- Đèn dò propan: lửa xanh nhạt bình thường, chuyển xanh lục là có R12; nhiều khí trong phòng thì phải thông gió.
## ⚡ 6. An toàn điện và mạch điện của tủ lạnh nén
### ⚡ Quy tắc an toàn điện
### 🧲 Động cơ máy nén: cuộn chạy và cuộn khởi động
### 🔌 Sơ đồ mạch điện tương tác
### 🚦 Mạch khởi động
### 🌡️ Mạch điều khiển, bảo vệ, tụ và đèn
### 📝 Tóm tắt
- An toàn điện: rút phích, nối đất, xả tụ, thay dây cũ, đậy nắp, cầu chì đúng; làm việc khi cắm điện cần gỗ/thảm cao su và dụng cụ cách điện.
- Cuộn chạy luôn có dòng khi máy chạy; cuộn khởi động chỉ vài giây đầu.
- Rơ-le từ: dòng lớn qua cuộn rơ-le nâng pit-tông, đóng tiếp điểm cho cuộn khởi động, rồi mở khi đạt tốc độ. PTC: nguội điện trở thấp, nóng điện trở cao.
- Thermostat (+4 đến +8 °C vắc-xin) đóng/mở; bảo vệ động cơ nghỉ 5–10 phút; tụ khởi động/tụ chạy; mạch đèn tách biệt.
## 🧰 7. Đo kiểm điện, ống chữ T và bảng đổi áp suất
### 🧰 Chuẩn bị đo kiểm
### 🧲 Thử rơ-le từ (magnetic relay)
### 🔥 Thử thiết bị khởi động PTC
### 🛡️ Thử bảo vệ động cơ
### 🔋 Thử tụ điện
### 🔌 Nhận biết chân C – R – S của động cơ
### 🔀 Phụ lục 1: ống chữ T và bảng đổi đơn vị
### 📝 Tóm tắt
- Trước hết rút phích, xác định linh kiện, tháo nắp hộp đấu dây; thử đèn trước khi dùng.
- Rơ-le từ: cuộn sáng, tiếp điểm mở không sáng (dựng đứng), tiếp điểm đóng sáng (lật ngược). PTC: đường chạy sáng liên tục, đường khởi động sáng rồi tắt sau ~3 phút.
- Bảo vệ ngoài: đèn sáng; bảo vệ trong: sáng cả ba cặp chân. Tụ: xả trước, nhìn rồi đo ohm — kim lên rồi trở về là tốt.
- C–R thấp nhất, C–S trung bình, S–R cao nhất (= tổng).
