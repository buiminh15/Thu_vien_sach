# 🎓 Tự học MBA Marketing trong 30 ngày
## 🎯 1. Nhập môn Marketing
### 🎯 Marketing là gì?
### 🏪 Hiểu thị trường: hai loại thị trường
### 🧪 Marketing hỗn hợp (4P + 1)
### 🌐 Marketing trong thời đại Internet
### 📚 Tình huống: Alibris, Harold và Boo.com
### 🧱 Thương mại điện tử, marketing lan truyền & mối đe doạ mới
### 📝 Tóm tắt
- Marketing = đưa đúng sản phẩm, đúng dịch vụ, đúng thị trường, đúng thời điểm, đúng giá.
- Hai loại thị trường: hàng tiêu dùng (B2C) và doanh nghiệp (B2B); B2B lớn và nhiều lợi nhuận hơn.
- Marketing hỗn hợp: 4P (giá, sản phẩm, xúc tiến, điểm bán) + People; là các yếu tố công ty kiểm soát được.
- Yếu tố không kiểm soát: kinh tế, pháp luật, đối thủ mới, công nghệ.
- Internet thay đổi chiều sâu (richness) và độ lan tỏa (reach) của thông tin, mở ra dữ liệu thời gian thực và marketing lan truyền.
- Internet hạ rào cản thâm nhập; công nghệ không thay thế được giá trị khác biệt và mô hình kinh doanh bền (bài học Boo.com).
## 🔄 2. Hành vi của người tiêu dùng
### 🔄 Từ “bán hàng” sang “marketing”
### 🧑‍🤝‍🧑 Tìm hiểu khách hàng
### ⚖️ Đặc điểm – Lợi ích – Bằng chứng
### 🏢 Nhu cầu của doanh nghiệp – người mua (B2B)
### 🔍 Nghiên cứu thị trường
### 💳 Tránh rủi ro vỡ nợ của khách hàng
### 📝 Tóm tắt
- Bán hàng tập trung nhu cầu người bán; marketing tập trung nhu cầu người mua (Levitt). Nhu cầu còn mãi, sản phẩm thì không.
- Hiểu khách hàng bằng tháp Maslow 5 tầng: sinh lý, an toàn, xã hội, được quý trọng, tự thể hiện.
- Khách hàng trả tiền cho lợi ích, không phải đặc điểm; cần bằng chứng để chuyển tải lợi ích.
- Trong B2B có ít nhất 3 vai trò: người sử dụng, người lập đơn hàng, người mua không sử dụng.
- Nghiên cứu thị trường 7 bước; chọn mẫu ngẫu nhiên hoặc phi ngẫu nhiên; kết hợp văn phòng, thực địa, kiểm tra thị trường.
- Bảo vệ doanh nghiệp khỏi vỡ nợ: điều khoản thương mại, kiểm tra tín dụng, bảo hiểm/bao thanh toán, theo dõi con nợ.
## 🧭 3. Chiến lược marketing
### 🧭 Chiến lược marketing gồm những gì?
### ♟️ Ba chiến lược cạnh tranh phổ quát (Porter)
### 🔭 Phân tích môi trường: 5 lực lượng & PEST
### 📏 Quy mô thị trường & thị phần
### 🧩 Vị thế cạnh tranh: SWOT & bản đồ nhận thức
### 🍰 Phân khúc thị trường
### 🏷️ Xây dựng thương hiệu
### 📝 Tóm tắt
- Ba chiến lược phổ quát của Porter: chi phí thấp, khác biệt hoá, tập trung. Chi phí thấp ≠ giá thấp.
- Đường cong kinh nghiệm: sản lượng tích luỹ gấp đôi → chi phí đơn vị giảm 20–30%; vì thế thị phần quan trọng.
- Người đi đầu không phải lúc nào cũng thắng; người theo sau có khả năng thành công cao hơn.
- Năm lực lượng Porter + PEST/PESTEL phân tích môi trường ngoài; SWOT + bản đồ nhận thức xác định vị thế cạnh tranh.
- Phân khúc thị trường: đo lường được, tiếp cận được, có khả năng chi trả, quy mô vừa phải.
- Thương hiệu tạo lòng trung thành và price premium, nhưng khó xây trên Internet.
## 🎁 4. Sản phẩm và dịch vụ
### 🎁 Sản phẩm là gì? “Gói sản phẩm”
### 🗂️ Phân loại sản phẩm
### 📈 Vòng đời sản phẩm
### 💡 Đề xuất bán hàng độc đáo (USP) & dãy sản phẩm
### 🧑‍🚀 Chu kỳ chấp nhận: ai là người mua đầu tiên?
### ✅ Chất lượng
### 📝 Tóm tắt
- Sản phẩm là “gói thoả mãn” gồm cả yếu tố vật chất và dịch vụ (thiết kế, thương hiệu, bao bì, bảo hành, hậu mãi…).
- Phân loại: tiêu dùng (tiện dụng, định giá lỗ kéo khách, mua sắm, đặc biệt) và công nghiệp (tư liệu sản xuất, vật tư, nhiên liệu/dịch vụ).
- Vòng đời 5 giai đoạn: R&D, giới thiệu, tăng trưởng, trưởng thành, sụt giảm – có thể tung lại bằng tái định vị.
- Dãy sản phẩm: độ sâu (cùng loại) và chiều rộng (nhiều loại); USP định vị khác biệt.
- Chu kỳ chấp nhận: 2,5% – 13,5% – 34% – 34% – 16%; tìm người thích đổi mới trước.
- Chất lượng marketing = giữ lời hứa; từ thanh tra → Deming/TQM/Six Sigma; bài học Toyota.
## 📣 5. Quảng cáo và xúc tiến sản phẩm
### 📣 Quảng cáo & xúc tiến (A&P): bức tranh chung
### ❓ Năm câu hỏi của chiến lược quảng cáo
### 💬 Thông điệp: AIDA & UACCA
### 📡 Lựa chọn phương tiện
### 📊 Đánh giá kết quả quảng cáo
### 📰 Sức mạnh của PR
### 🌐 Website, SEO và quảng cáo trên Internet
### 🤝 Bán hàng & đàm phán
### 📝 Tóm tắt
- A&P là biện pháp tốn kém để người ta nói chuyện với nhau; bắt đầu bằng 5 câu hỏi từ mục tiêu tới đánh giá.
- Thông điệp theo AIDA (chú ý – quan tâm – ham muốn – hành động); biến sự kiện thành lợi ích.
- ATL (đại chúng) vs BTL (cá nhân); chiến lược đẩy vs kéo.
- Đo hiệu quả bằng kết quả cuối (chi phí mỗi đơn hàng), trên web nên dùng thời gian dừng lại hơn là hits.
- PR: rẻ, đáng tin hơn quảng cáo, quan trọng khi khủng hoảng; thông cáo báo chí phải ngắn, hấp dẫn, không quảng cáo.
- Website thân thiện + SEO (từ khoá, liên kết, uy tín) + quảng cáo trả tiền; bán hàng và đàm phán là kỹ năng học được.
## 🚚 6. Điểm bán hàng và phân phối sản phẩm
### 🚚 Place – “đoạn đường cuối cùng”
### 🔗 Cấu trúc kênh phân phối
### 🛒 Các kênh phân phối cụ thể
### 📦 Hậu cần & quản lý tồn kho
### 🤲 Thuê ngoài (Outsourcing)
### 📝 Tóm tắt
- Place là cách sản phẩm đến tay khách; kênh phân phối là tập hợp doanh nghiệp đưa sản phẩm tới người dùng.
- Kênh thông thường (cạnh tranh) vs HMS (hợp tác chiều ngang) vs VMS (liên kết chiều dọc: tập đoàn, hợp đồng, được quản lý).
- Nhượng quyền là dạng hợp đồng phổ biến; bên nhận trả phí + bản quyền.
- Chọn kênh theo nhu cầu khách, hình ảnh, chi phí, đẩy–kéo, dòng tiền…
- Hậu cần: JIT, VMI, CIRS; xung đột tồn kho giữa marketing – sản xuất – tài chính; EOQ = √(2RO/C).
- Thuê ngoài: giảm chi phí, tập trung cốt lõi nhưng rủi ro bảo mật, chất lượng, mất kiểm soát.
## 🎓 7. Định giá
### 🎓 Định giá nhìn từ trường kinh doanh
### 📉 Độ co giãn của cầu theo giá
### 🏛️ Bốn cấu trúc thị trường
### 🧱 Chi phí cố định, biến đổi và bán biến đổi
### ⚖️ Phân tích điểm hoà vốn (BEP)
### 📦 Đàm phán đơn hàng đặc biệt
### 🎯 Các chiến lược định giá
### ✂️ Loại bỏ sản phẩm không sinh lời
### 📝 Tóm tắt
- Độ co giãn của cầu = %Δ cầu ÷ %Δ giá; >1 co giãn, <1 không co giãn.
- Bốn cấu trúc thị trường: độc quyền, độc quyền nhóm, cạnh tranh hoàn hảo, cạnh tranh độc quyền.
- Chi phí cố định (không đổi theo sản lượng), khả biến (tỷ lệ thuận), bán khả biến (tách đôi).
- BEP = F ÷ (P − V); sản lượng mục tiêu = (F + lợi nhuận mục tiêu) ÷ (P − V); biên an toàn đo khoảng cách tới hoà vốn.
- Chiến lược: hớt váng, thâm nhập, theo giá trị, thời gian thực, đấu giá, tự đặt giá.
- Ra quyết định loại bỏ sản phẩm dựa trên số dư đảm phí, không phải chi phí cố định phân bổ.
## 🔢 8. Toán học dành cho marketing
### 🔢 Vì sao cần toán trong marketing?
### 🌳 Lý thuyết ra quyết định & Cây quyết định
### 📊 Thống kê mô tả
### 🔮 Dự báo doanh số
### 📈 Quan hệ nhân quả: hồi quy tuyến tính
### 📋 Khảo sát và cỡ mẫu
### 🗓️ Quản lý hoạt động marketing
### 💰 Quyết định đầu tư marketing
### 📝 Tóm tắt
- Người làm marketing phải biết diễn giải dữ liệu: cây quyết định, giá trị kỳ vọng (xác suất × lợi nhuận).
- Thống kê: trung bình, trung vị, mode, phạm vi, độ lệch chuẩn; phân phối chuẩn 68,2 – 95,5 – 99,7%.
- Dự báo = xu hướng + chu kỳ + ngẫu nhiên; trung bình động (có trọng số), làm mịn mũ; chọn mô hình bằng thử–sai.
- Hồi quy tuyến tính, hệ số tương quan, R² để kiểm tra quan hệ; cỡ mẫu càng lớn càng chính xác (≥ 250).
- Gantt, CPM (đường tới hạn), PERT, lập trình tuyến tính, lý thuyết xếp hàng hỗ trợ quản lý hoạt động.
- Thẩm định đầu tư: hoàn vốn (đơn giản nhưng thiếu), DCF/NPV (giá trị thời gian của tiền), IRR.
## 🧩 9. Quản lý hoạt động marketing
### 🧩 Chiến lược – Cơ cấu – Con người – Hệ thống
### 🏗️ Cơ cấu tổ chức – các lựa chọn
### 👥 Xây dựng và lãnh đạo các đội
### 🏛️ Ban giám đốc
### 🧑‍💼 Nhân sự: tuyển dụng
### 🎁 Hệ thống: khen thưởng & đánh giá
### 🌊 Quản lý thay đổi
### 📝 Tóm tắt
- Chữ P thứ năm (People): chiến lược – cơ cấu – con người – hệ thống tác động lẫn nhau.
- Cơ cấu: thứ bậc, phạm vi kiểm soát (hẹp/rộng), trực tuyến–tham mưu, chức năng, ma trận, SBU; không cơ cấu nào phù hợp mãi.
- Đội 5–20 người; 8 vai trò Belbin; 5 yếu tố: cân bằng vai trò, tầm nhìn, ngôn ngữ chung, hợp tính, lãnh đạo tốt.
- Giám đốc có nghĩa vụ pháp lý với công ty; cổ đông kiểm soát qua điều lệ và tái cử.
- Tuyển dụng tốn kém: mô tả công việc trước, nhiều kênh, kiểm tra tham khảo, thư mời bằng văn bản, lịch sự với người không được chọn.
- Khen thưởng công bằng, đánh giá hai chiều hướng kết quả; quản lý thay đổi bằng lý do, chia nhỏ, tham gia, thưởng sớm, dự kiến phản đối.
## ⚖️ 10. Marketing và pháp luật
### ⚖️ Vì sao nhà quản trị cần hiểu luật?
### 📜 Quy định thương mại
### 👷 Pháp luật về lao động
### 💡 Sở hữu trí tuệ (IP)
### 🧭 Đạo đức trong marketing
### 📝 Tóm tắt
- Nhà quản trị cần hiểu luật đủ để biết khi nào cần tư vấn pháp lý; tìm quy định từng nước qua Doing Business, WTO, WIPO.
- Quảng cáo phải trung thực; hàng hoá phải phù hợp mục đích và đạt chất lượng; bán từ xa có quyền huỷ trong 7 ngày làm việc; bảo vệ dữ liệu; giấy phép tín dụng.
- Luật lao động: không phân biệt đối xử, hợp đồng trong 2 tháng, lưu hồ sơ, an toàn, tránh sa thải bất công.
- IP: bằng sáng chế (20 năm), bản quyền (70 năm sau khi tác giả mất), thiết kế (tối đa 25 năm), nhãn hiệu (10 năm gia hạn), tên và tên miền.
- Đạo đức: khu vực trách nhiệm, 7 bổn phận của Ross, giải quyết xung đột các bên liên quan, bảo vệ người tố cáo.
- Đạo đức có thể tăng giá trị dài hạn; xu hướng triple bottom line (lợi nhuận – con người – hành tinh).
## 🧭 11. Kế hoạch marketing và ngân sách
### 🧭 Từ chiến lược đến kế hoạch
### 🔲 Ma trận phát triển Ansoff (1965)
### 🐄 Ma trận Boston (BCG, 1969)
### 📘 Kế hoạch marketing và kế hoạch kinh doanh
### 💼 Lập ngân sách
### 📉 Phân tích chênh lệch ngân sách & ngân sách mềm
### 📝 Tóm tắt
- Ansoff: thâm nhập thị trường (rủi ro thấp) → phát triển sản phẩm / thị trường → đa dạng hoá (cao nhất).
- Boston: ngôi sao, bò sữa, dấu hỏi, chó — dùng dòng tiền của bò sữa nuôi ngôi sao. GE–McKinsey dùng sức mạnh doanh nghiệp và sức hấp dẫn ngành.
- Kế hoạch kinh doanh 3–5 năm, xem lại hằng năm và theo dõi hằng quý; phần tóm tắt là quan trọng nhất.
- Ngân sách: mục tiêu thực tế nhưng thách thức, do người chịu trách nhiệm lập, thoả thuận rõ như “hợp đồng ảo”, chốt trước năm mới ≥ 1 tháng.
- Ngân sách cuốn chiếu; chênh lệch bất lợi để trong ngoặc đơn.
- Ngân sách mềm điều chỉnh theo doanh số thực tế; ngân sách chi tiết phải tính mùa vụ và xu hướng.
## 🎓 12. Những vấn đề cốt lõi (Kế toán – Tài chính – Hành vi tổ chức – Chiến lược)
### 🎓 Bốn môn cốt lõi của MBA
### 📒 Kế toán & tài chính: ý tưởng nền tảng
### 💧 Báo cáo lưu chuyển tiền mặt
### 📈 Báo cáo lời và lỗ (thu nhập)
### ⚖️ Bảng cân đối kế toán
### 🧮 Phân tích bằng tỷ số (5 nhóm “kiểm tra”)
### 🏦 Tìm nguồn tài chính
### 🧠 Hành vi tổ chức: động cơ
### 🧭 Lãnh đạo & quản lý
### 🔭 Chiến lược: tầm nhìn – sứ mệnh – mục tiêu – thẻ điểm cân bằng
### 📝 Tóm tắt
- Bốn môn lõi MBA: Marketing, Tài chính & Kế toán, Hành vi tổ chức, Chiến lược.
- Lời lãi chỉ là con số kế toán, dòng tiền mới quyết định sống còn; ba báo cáo: lưu chuyển tiền mặt, lời–lỗ (4 mức lợi nhuận), bảng cân đối (tài sản = nguồn vốn).
- Phân tích tỷ số theo 5 nhóm: sinh lời, thanh khoản, khả năng thanh toán, tăng trưởng, thị trường.
- Nguồn vốn: nợ (ngân hàng, trái phiếu, thương phiếu, cho thuê, bao thanh toán) và vốn chủ sở hữu (thiên thần, VC, liên doanh, thị trường chứng khoán); đòn bẩy tăng ROSC nhưng tăng rủi ro.
- Động cơ: Hawthorne, Thuyết X–Y, Herzberg (động cơ vs duy trì); lãnh đạo vs quản lý; POSDCORB, Mintzberg, MBWA.
- Chiến lược: tầm nhìn → sứ mệnh → mục tiêu; thẻ điểm cân bằng 4 quan điểm.
