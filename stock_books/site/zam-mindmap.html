# 🔭 Ahead of the Market
## ⚠️ 1. Những chủ đề chính
### ⚠️ Khủng hoảng niềm tin và nghịch lý của nhà phân tích
### 🧭 Hai nguyên tắc nền tảng
### 📊 Bằng chứng: năm danh mục theo mức điều chỉnh
### 📝 Tóm tắt
- Khuyến nghị của nhà phân tích thiên lệch, nên bỏ qua phần lớn.
- Phải gộp nhiều nhà phân tích và xem thay đổi theo thời gian.
- Điều chỉnh ước tính lợi nhuận là tín hiệu mạnh nhất.
- Dữ liệu của tác giả cho thấy chênh lệch lớn giữa nhóm bị hạ và nhóm được nâng ước tính, chưa tính phí giao dịch.
## 👔 2. Vì sao nhà phân tích thiên lệch
### 👔 Nhà phân tích là ai và tồn tại để làm gì
### 🎭 Hai nguồn thiên lệch chính
### 🏅 Có nhà phân tích xuất sắc không?
### 📝 Tóm tắt
- Nhà phân tích tồn tại để phục vụ nhà đầu tư tổ chức.
- Thù lao gắn với ảnh hưởng và doanh thu ngân hàng đầu tư.
- Hai thiên lệch: ngại nói bán; chịu áp lực ngân hàng đầu tư.
- Chọn nhà phân tích theo thành tích chính xác, không theo lương.
- Tránh trả hoa hồng theo giao dịch; tránh chiến lược gia vĩ mô.
## 🔎 3. Mổ xẻ báo cáo của nhà phân tích
### 🔎 Điều gì làm nghiên cứu của họ đặc biệt?
### ⚖️ Regulation FD
### 🧩 Năm phần của một báo cáo
### 🌀 Ba đường để nhà phân tích làm giá chuyển động
### 📝 Tóm tắt
- Báo cáo của nhà phân tích làm giá chuyển động vì công khai và có tổ chức hành động theo.
- Reg FD làm tăng tính công bằng nhưng giảm lượng thông tin.
- Báo cáo có năm phần; ước tính lợi nhuận là quan trọng nhất.
- Câu trung tính ≈ tiêu cực; xem lý do điều chỉnh để đánh giá chất lượng.
## 🍽️ 4. Tầm quan trọng của lợi nhuận và điều chỉnh ước tính
### 🍽️ Lợi nhuận là thứ bạn "ăn được"
### 🏦 Nhà đầu tư tổ chức và độ trễ phản ứng
### 🐢 Vì sao có analyst creep?
### ⚖️ Khuyến nghị so với điều chỉnh ước tính
### 📝 Tóm tắt
- Lợi nhuận là thứ quyết định giá trị cổ phiếu; kỳ vọng tương lai quan trọng hơn quá khứ.
- Nhà đầu tư tổ chức phản ứng chậm, tạo độ trễ giá.
- Analyst creep: nâng hôm nay → dễ nâng tiếp.
- Điều chỉnh ước tính có tương quan theo thời gian, khuyến nghị thì không.
## 🗂️ 5. Dùng ước tính lợi nhuận để chọn cổ phiếu
### 🗂️ Bước 1: Tìm đúng dữ liệu
### 💰 Bước 2–4: Lọc và đo
### 🧰 Quản lý danh mục bằng điều chỉnh ước tính
### 📝 Tóm tắt
- Theo dõi đồng thuận năm tài chính hiện tại.
- Chỉ mua công ty được dự báo có lãi.
- Tín hiệu mua: tăng hơn ~3% trong 30 ngày; xem phân bố ước tính.
- Ưu tiên nâng do doanh thu, tránh nâng do kế toán.
- Chiến lược có thể kém hơn trong đợt bán tháo hoảng loạn.
## 📣 6. Bất ngờ về lợi nhuận (earnings surprise)
### 📣 Bất ngờ lợi nhuận là gì?
### 🎚️ Vì sao cùng một bất ngờ, phản ứng khác nhau?
### 🎲 Năm trò chơi của công ty với báo cáo lợi nhuận
### 📝 Tóm tắt
- Bất ngờ = EPS thực tế so với đồng thuận.
- Cùng mức bất ngờ có thể cho phản ứng khác nhau tùy chất lượng và kỳ vọng.
- Công ty có thể "chơi" con số bằng nhiều cách.
- Cẩn thận với tăng trưởng bằng mua lại liên tiếp.
## ✅ 7. Dùng bất ngờ lợi nhuận trong quy trình đầu tư
### ✅ Phản ứng với bất ngờ: bước 1 – xác định đúng mức bất ngờ
### 🔬 Bước 2–3: chất lượng và doanh thu
### 🪳 Dự đoán bất ngờ: hiệu ứng con gián
### 📝 Tóm tắt
- Bất ngờ "sạch" vượt đồng thuận và ước tính gần nhất, không có khoản bất thường hay cảnh báo.
- Ưu tiên bất ngờ cả lợi nhuận và doanh thu.
- Post-earnings drift kéo dài khoảng ba tháng.
- Hiệu ứng con gián giúp dự đoán bất ngờ.
- Đồng thuận điều chỉnh trước công bố là tín hiệu dự đoán mạnh nhất.
## 🏷️ 8. Tất cả hội tụ: Zacks Rank
### 🏷️ Zacks Rank là gì?
### 📈 Kết quả theo công bố của tác giả
### 🔍 Hai ví dụ trong sách
### 📝 Tóm tắt
- Zacks Rank gói gọn điều chỉnh ước tính và bất ngờ thành một hạng 1–5.
- Bốn yếu tố: Agreement, Magnitude, Upside, Surprise.
- Không thiên lệch: số cổ phiếu hạng 1 bằng hạng 5.
- Kết quả công bố rất cao nhưng chưa tính phí giao dịch.
## 🧑‍🤝‍🧑 9. Áp dụng Zacks Rank hiệu quả
### 🧑‍🤝‍🧑 Mỗi trường phái dùng thế nào?
### ⚠️ Hạn chế
### 6️⃣ Sáu bước áp dụng
### 📝 Tóm tắt
- Hạng #1 + định giá hợp lý là tổ hợp tốt.
- Một nửa hạng #1 đổi sau một tháng → vòng quay cao.
- Sáu bước: số vị thế, ngành, chọn, thời điểm, bán, tái cân bằng.
- Đừng bình quân giá xuống với hạng #1.
## 🎓 10. Dùng khuyến nghị của nhà phân tích đúng cách
### 🎓 Điểm khuyến nghị đồng thuận
### 📉 Vì sao cổ phiếu được khuyến nghị nhiều nhất làm tệ?
### 🐷 Piggybacking: bám theo thay đổi
### 📝 Tóm tắt
- Điểm khuyến nghị đồng thuận điều chỉnh thiên lệch như điểm trung bình.
- Cổ phiếu được khuyến nghị nhiều nhất thất bại nặng trong thị trường gấu.
- Thay đổi khuyến nghị có thông tin hơn mức khuyến nghị.
- Piggybacking có vòng quay rất cao, chỉ dùng cho vài cổ phiếu.
## 🙈 11. Cổ phiếu bị bỏ rơi và ước tính tăng trưởng dài hạn
### 🙈 Cổ phiếu bị bỏ rơi
### 🚀 Ước tính tăng trưởng dài hạn (LTG)
### 📝 Tóm tắt
- Cổ phiếu bị bỏ rơi có thể đang bị định giá thấp.
- Độ bao phủ phụ thuộc phí ngân hàng đầu tư và sự chú ý của nhà đầu tư.
- Tránh LTG > 30%; ưu tiên LTG vừa được nâng.
- Điều chỉnh ước tính EPS vẫn là tín hiệu chính.
## 🏷️ 12. Định giá, bất định lợi nhuận và mô hình Fed
### 🏷️ P/E và PEG
### 🎲 Bất định lợi nhuận
### 🏛️ Mô hình Fed
### 📝 Tóm tắt
- Forward P/E và PEG đo giá có xứng tăng trưởng không; tránh forward P/E trên ~65.
- Công ty có ước tính ổn định (bất định thấp) thường tốt hơn.
- Mô hình Fed: giá trị hợp lý = EPS dự phóng ÷ lợi suất Kho bạc 10 năm.
- Dùng để phân bổ cổ phiếu/trái phiếu, không canh thị trường chính xác.
## 🎯 13. Kết luận: tổng hợp bốn chiến lược chính
### 🎯 Điều ta biết
### 1️⃣ Bốn chiến lược chính
### ➕ Bốn chiến lược phụ
### 📌 Tự làm được không? Lưu ý thực tế
### 📝 Tóm tắt
- Không dùng một nhà phân tích; lượng hóa và theo dõi thay đổi.
- Bốn chiến lược chính: điều chỉnh ước tính, bất ngờ, Zacks Rank, piggybacking.
- Bốn chiến lược phụ: bị bỏ rơi, LTG, định giá, bất định.
- Vòng quay cao: phí giao dịch quyết định hiệu quả thực.
