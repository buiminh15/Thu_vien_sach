# 💰 Phong cách đầu tư Warren Buffett
## 🏆 1. Nhà đầu tư vĩ đại nhất thế giới
### 🏆 Người giàu duy nhất nhờ biết đầu tư
### 🧒 Khởi nghiệp đầu tư
### 🤝 Công ty hợp danh đầu tư Buffett (1956–1969)
### 📈 Berkshire Hathaway và thành tích
### 🧠 Con người, vòng tròn khả năng và Buffett ngày nay
### 📝 Tóm tắt
- Buffett khởi nghiệp với 100 đô la năm 1956; công ty hợp danh 13 năm đạt lãi kép 29,5%/năm, vượt Dow 20 điểm/năm.
- Vụ American Express 1963: dùng 40% tài sản mua khi giá rớt thảm → lãi gấp ba. Đây là Graham “đích thực”.
- Berkshire Hathaway: giá trị sổ sách/cổ phiếu tăng 22,2%/năm 1965–2003, vượt S&P 11,8 điểm dù đóng thuế.
- Ngày nay ông ít mua cổ phiếu lớn vì giữ kỷ luật “vòng tròn khả năng” và “mua chắc chắn giá chiết khấu”.
- Nhà đầu tư cá nhân có thể theo Berkshire hoặc áp dụng phương pháp và mở rộng vòng tròn khả năng.
## 📘 2. Học vấn của Warren Buffett
### 📘 Benjamin Graham: biên độ an toàn
### 🔎 Philip Fisher: chất lượng và tin đồn
### 💵 John Burr Williams: giá trị nội tại
### 🦊 Charles Munger: “hàng rào mô hình trí tuệ”
### 🧬 Bước ngoặt: tổng hợp bốn người thầy
### 📝 Tóm tắt
- Graham: đầu tư = phân tích kỹ + an toàn vốn + lợi nhuận thoả đáng; biên độ an toàn khi mua dưới giá trị nội tại; thị trường dao động vì sợ hãi và tham lam.
- Fisher: công ty vượt trội + quản lý chất lượng; “tin đồn”; danh mục tập trung; ở trong vòng tròn khả năng.
- Williams: giá trị = hiện giá dòng tiền tương lai chiết khấu; Buffett dùng lãi suất trái phiếu Mỹ dài hạn làm tỷ lệ chiết khấu.
- Munger: mua công ty tuyệt vời giá hợp lý; hàng rào mô hình trí tuệ; tâm lý học.
- Buffett tổng hợp cả bốn thành một phương pháp duy nhất, nay xấp xỉ 50% Graham – 50% Fisher.
## 🧵 3. “Ngành kinh doanh chính của chúng tôi là bảo hiểm”
### 🧵 Thuở ban đầu: dệt may và bài học
### 💧 Bảo hiểm: float và chi phí thả nổi
### 🚗 GEICO
### 🛡️ General Re và tập đoàn tái bảo hiểm
### 📦 Bảo hiểm là hàng hóa tiện nghi
### 📝 Tóm tắt
- Dệt may thất bại, nhưng tiền lãi mua được công ty bảo hiểm — nền móng của Berkshire.
- Float: phí bảo hiểm thu trước, đầu tư trong thời gian chờ bồi thường. Chi phí float âm = lợi nhuận bảo hiểm.
- GEICO: hồ sơ tốt + bán trực tiếp; Buffett mua khi giá rớt còn 2 đô la, sau đó mua trọn 2,3 tỷ đô la (1996).
- General Re: mua ~16 tỷ đô la cổ phiếu; sai lầm định giá thấp hợp đồng gây thua lỗ 5 năm, phục hồi 2002.
- Bảo hiểm là hàng hóa tiện nghi: Buffett không cạnh tranh giá mà dùng sức mạnh tài chính và kỷ luật định giá.
## 🏢 4. Mua một doanh nghiệp
### 🏢 Tư duy chủ sở hữu
### 🍫 Những thương vụ mua lại công ty
### 🥤 Những cổ phiếu tiêu biểu
### 📋 12 nguyên lý Phong cách đầu tư Warren Buffett
### 📝 Tóm tắt
- Mua cổ phiếu = mua doanh nghiệp; áp dụng tư duy chủ sở hữu cho cả hai.
- Tiêu chuẩn: doanh nghiệp đơn giản, lợi nhuận ổn định, ROE tốt, nợ thấp, ban quản lý tốt, giá hấp dẫn.
- See’s Candy là bước ngoặt: trả giá cao cho chất lượng. Các thương vụ Clayton, McLane, Pampered Chef cho thấy con người quản lý là then chốt.
- Cổ phiếu tiêu biểu: Coca-Cola, Gillette, Washington Post, Wells Fargo — đều đơn giản, dễ hiểu, thương hiệu/mạnh, mua khi thị trường sợ hãi.
- 12 nguyên lý chia 4 nhóm: kinh doanh, quản lý, tài chính, giá trị.
## 🧭 5. Hướng dẫn đầu tư: Nguyên lý kinh doanh
### 🧭 Chúng ta là nhà phân tích kinh doanh
### 1️⃣ Nguyên lý 1: Doanh nghiệp đơn giản, dễ hiểu
### 2️⃣ Nguyên lý 2: Lịch sử hoạt động ổn định
### 3️⃣ Nguyên lý 3: Triển vọng dài hạn và “quyền kinh doanh”
### 🥾 Ví dụ điển hình: Justin Industries (2000)
### 📝 Tóm tắt
- Buffett phân tích doanh nghiệp chứ không phải thị trường: ba câu hỏi nhóm nguyên lý kinh doanh.
- Đơn giản, dễ hiểu và trong vòng tròn khả năng; xác định giới hạn hiểu biết chuẩn xác quan trọng hơn vòng tròn lớn.
- Lịch sử ổn định, tránh công ty đang thay đổi căn bản hoặc cứu vãn khó khăn.
- Triển vọng dài hạn = “quyền kinh doanh”: sản phẩm không thay thế, không bị điều chỉnh giá, có hào ngăn cản cạnh tranh bền.
- Hàng hóa thiết yếu chỉ có lãi khi là nhà cung cấp chi phí thấp; Justin cho thấy hàng hóa thiết yếu có thể thành nhượng quyền nhờ thương hiệu.
## 🧑‍💼 6. Hướng dẫn đầu tư: Nguyên lý quản lý
### 🧑‍💼 Ba phẩm chất của ban quản lý
### 🧮 Sự hợp lý: phân bổ vốn
### 🗣️ Sự trung thực (candor)
### 🐑 Tính cưỡng chế tổ chức (institutional imperative)
### ⚠️ Lương CEO, quyền chọn cổ phiếu, kế toán
### 📝 Tóm tắt
- Buffett chỉ đầu tư vào công ty có quản lý ông khâm phục: hợp lý, trung thực, dám chống cưỡng chế tổ chức.
- Phân bổ vốn hợp lý: giữ lại nếu lợi nhuận tái đầu tư > chi phí vốn; nếu không thì trả lại cổ đông (cổ tức hoặc mua lại cổ phiếu khi giá thấp hơn giá trị).
- Trung thực: báo cáo đầy đủ, thừa nhận sai lầm, không giấu sau GAAP.
- Tính cưỡng chế tổ chức: sự bắt chước mù quáng; Goizueta, Ringwalt, Clayton chống lại nó.
- Lương CEO quá lớn, quyền chọn không tính chi phí, Ban Giám đốc không độc lập, kế toán mờ ám là cờ đỏ.
## 📊 7. Hướng dẫn đầu tư: Nguyên lý tài chính
### 📊 Tư duy tài chính kiểu Buffett
### 📈 Nguyên lý 7: Lợi nhuận trên vốn cổ phần (ROE)
### 💰 Nguyên lý 8: “Lợi nhuận chủ sở hữu”
### ✂️ Nguyên lý 9: Lợi nhuận biên
### 1️⃣ Nguyên lý 10: Phép thử “một đô la”
### 📝 Tóm tắt
- Dùng trung bình 4–5 năm; tránh mưu mẹo tài chính.
- ROE (không phải EPS), tính theo giá vốn chứng khoán, loại khoản bất thường; ROE tốt phải đến từ ít nợ.
- Lợi nhuận chủ sở hữu = thu nhập ròng + khấu hao − chi phí vốn (và vốn lưu động thêm); dòng tiền mặt thường đánh lạc hướng.
- Lợi nhuận biên cao do quản lý chi phí tốt (Berkshire chi phí trụ sở <1% lợi nhuận).
- Phép thử một đô la: mỗi đô la giữ lại → ≥ 1 đô la giá trị thị trường (Coca-Cola 7,2; Gillette 9,21).
## ⚖️ 8. Hướng dẫn đầu tư: Nguyên lý giá trị
### ⚖️ Giá cả và giá trị
### 🧮 Nguyên lý 11: Giá trị của công ty
### 🏷️ Nguyên lý 12: Mua giá hấp dẫn — biên độ an toàn
### 🧾 Các ví dụ định giá
### 🏁 Kết luận: 12 nguyên lý hợp lại
### 📝 Tóm tắt
- Giá cả là thứ bạn trả; giá trị là thứ bạn thu được.
- Giá trị = hiện giá chiết khấu của lợi nhuận chủ sở hữu tương lai; chỉ định giá doanh nghiệp dự đoán được.
- Tỷ lệ chiết khấu: lãi suất trái phiếu chính phủ dài hạn (tối thiểu 10% khi lãi suất thấp); không cộng phần bù rủi ro mà dùng biên độ an toàn.
- Mô hình hai bước: tăng trưởng nhanh giai đoạn đầu, sau đó chậm; Coca-Cola 1988: 20,7–48,4 tỷ so với giá ~15 tỷ.
- Chỉ mua khi giá thấp hơn đáng kể giá trị; khi khả năng thành công cao, đặt cược lớn.
## 💼 9. Đầu tư vào những chứng khoán thu nhập cố định
### 💼 Tư duy “trái phiếu như một doanh nghiệp”
### ⚡ Trái phiếu WPPSS (1983)
### 🗑️ Trái phiếu rác: RJR Nabisco, Level 3, Qwest, Amazon
### 🔀 Mua bán song hành (arbitrage)
### 🔁 Cổ phiếu ưu đãi chuyển đổi và MidAmerican
### 📝 Tóm tắt
- Buffett đầu tư thu nhập cố định theo cùng nguyên tắc cổ phiếu: giá trị, biên độ an toàn, quản lý tốt.
- WPPSS, RJR, Level 3, Qwest, Amazon: mua khi thị trường hoảng loạn nhưng nền tảng doanh nghiệp vững.
- Mua bán song hành: ít nhưng lớn, chỉ thương vụ đã công bố, ~25%/năm; rút trước đợt sụp đổ 1989.
- Cổ phiếu ưu đãi chuyển đổi: thu nhập ổn định + quyền chọn tăng giá (Gillette, American Express, MidAmerican).
## 🎬 10. Quản lý danh mục đầu tư
### 🎬 Chủ động, theo chỉ số, hay tập trung?
### 🎯 Năm nguyên tắc vàng của nhà đầu tư tập trung
### ⚖️ Buffett và lý thuyết danh mục hiện đại
### 👑 Những nhà đầu tư siêu hạng
### 🧾 Mua, bán và thuế
### 🧗 Khó khăn và thách thức
### 📝 Tóm tắt
- Quản lý chủ động thường thua (khoảng 90% quỹ thua thị trường); chỉ số cho kết quả trung bình; tập trung cho phép vượt trội.
- Năm nguyên tắc vàng: công ty nổi bật, 10–20 cổ phiếu, chọn tốt nhất, giữ 5–10 năm, kiên trì trước biến động.
- Rủi ro (Buffett) = khả năng thiệt hại, không phải biến động giá; đầu tư tập trung giảm rủi ro nhờ hiểu sâu.
- Munger, Ruane (Sequoia), Simpson là nhà đầu tư tập trung với thành tích vượt trội nhưng biến động cao.
- Giữ lâu giảm chi phí giao dịch và hoãn thuế (“khoản vay không lãi”).
## 🧠 11. Tâm lý tiền bạc
### 🧠 Tính cách nhà đầu tư thực sự
### 🎭 Ngài Thị Trường (Mr. Market)
### 🧩 Tài chính hành vi: Munger và Thaler
### 🧘 Tâm lý nhà đầu tư tập trung
### 📝 Tóm tắt
- Thành công đầu tư cần kiểm soát cảm xúc hơn là IQ cao: bình tĩnh, kiên nhẫn, sáng suốt.
- Ngài Thị Trường: báo giá thất thường, bạn không bị buộc phải theo; tận dụng khi ông cực đoan, đừng để ông chi phối.
- Tài chính hành vi: quá tự tin, phản ứng thái quá, cận thị, ác cảm thua lỗ, tính toán trí tuệ.
- Sợ hãi khi người khác tham lam, tham lam khi người khác sợ hãi; bi quan tạo cơ hội mua giá tốt.
- Phiếu đục lỗ 20 lỗ: kiên nhẫn chờ cơ hội lớn.
## 🌍 12. Nhân vật “không duy lý”
### 🌍 Vì sao Buffett khác biệt?
### 🪜 Bốn bước đầu tư theo phong cách Buffett
### 💎 Điều cốt lõi
### 📝 Tóm tắt
- Buffett khác vì nghiên cứu doanh nghiệp, không chạy theo giá; người khác dự đoán thay đổi giá ngắn hạn.
- Bốn bước: tách khỏi thị trường chứng khoán; không lo nền kinh tế; mua doanh nghiệp, không mua cổ phiếu; quản lý danh mục nhỏ tập trung.
- Đánh giá doanh nghiệp theo 12 nguyên lý; chỉ ở bước cuối mới xét giá thị trường (biên độ an toàn).
- Điểm cốt lõi là phân bổ vốn hợp lý; thành công cần suy nghĩ độc lập và can đảm theo đuổi niềm tin.
