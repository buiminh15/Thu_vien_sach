# 📉 Crash Profits
## 👨‍🏫 1. Chương trình ngầm của người môi giới
### 👨‍🏫 Lời mở đầu của tác giả
### 📉 Câu chuyện của Linda và cổ phiếu UCBS
### 🎭 Bốn chiêu thức giữ chân khách hàng
### 🔎 Điều gì đã xảy ra sau đó (ghi chú ngoài sách)
### 📝 Tóm tắt
- Môi giới có xung đột lợi ích: họ muốn giữ bạn trong thị trường.
- Lỗ trên giấy cũng là lỗ thật về giá trị tài sản.
- Bình quân giá là công cụ, không phải phép màu: nó có thể kéo bạn dồn thêm vào sai lầm.
- Không ai biết đáy; lập luận "đừng bán ở đáy" là lời dọa.
- Tin tức, xếp hạng và con số lợi nhuận đều cần được kiểm chứng.
## 💸 2. Bong bóng
### 💸 Vì sao phải lên sàn để huy động vốn
### 🎯 Quyền chọn cổ phiếu (stock options)
### 🏚️ Chiêu công ty con (subsidiary shell game)
### 🧮 Lợi nhuận "ma" từ quỹ hưu trí
### 🎲 Phái sinh (derivatives)
### 🔎 Điều gì đã xảy ra sau đó (ghi chú ngoài sách)
### 📝 Tóm tắt
- Bong bóng nuôi bằng nhu cầu huy động vốn khổng lồ qua thị trường chứng khoán.
- Quyền chọn tạo động cơ kéo giá cổ phiếu lên bằng mọi giá.
- Công ty con dưới 50% giúp giấu nợ/lỗ ngoài báo cáo hợp nhất.
- Lãi dự kiến của quỹ hưu trí có thể biến lỗ thành lãi trên giấy.
- Phái sinh tự tạo khó định giá và dễ che giấu rủi ro.
- "Hợp pháp" chưa chắc là an toàn cho nhà đầu tư.
## 📢 3. Cơn sốt quảng bá của Phố Wall
### 📢 Cách tin đẹp đến tay nhà đầu tư
### 🤫 Phân tích viên biết nhưng không nói

### 🔎 Điều gì đã xảy ra sau đó (ghi chú ngoài sách)
### 📝 Tóm tắt
- Phân tích viên bị chi phối bởi thu nhập ngân hàng đầu tư, không phải bởi thành tích dự báo.
- Khách VIP được cảnh báo riêng, nhà đầu tư nhỏ thì không.
- Hạ xếp hạng từ từ hoặc ngừng theo dõi là cách tránh gây sốc nhưng làm hại người tin vào xếp hạng cũ.
- Mất càng sâu thì càng khó gỡ: lỗ 98% cần tăng 4.900% để hòa vốn.
- Luôn hỏi: người đưa lời khuyên được trả tiền từ đâu?
## 🕵️ 4. Bong bóng vỡ
### 🕵️ Kiểm toán viên quay lại
### 🕳️ Quỹ hưu trí từ "mỏ vàng" thành "gánh nặng"
### 🙈 Kiểm toán viên cùng che đậy
### 🩹 Giải pháp của chính phủ: vá víu
### 📝 Tóm tắt
- Kiểm soát thực tế mới quyết định có phải hợp nhất, không chỉ tỷ lệ sở hữu.
- Khi thị trường giảm, quỹ hưu trí doanh nghiệp từ thặng dư thành thâm hụt, làm lợi nhuận công bố giảm.
- Kiểm toán viên cũng có xung đột lợi ích vì kiếm tiền tư vấn từ chính khách hàng.
- Phần lớn công ty có sai phạm đều từng nhận ý kiến kiểm toán "sạch".
- Luật mới 2002 chỉ giải quyết một phần.
## 📰 5. Bộ đồ vệ sinh du lịch 17.000 USD
### 📰 Hàng loạt tin xấu
### 💔 Hối hận của CEO
### 🌪️ Nợ nần gặp giảm phát
### 🧹 Dọn nhà và từ chức
### 📝 Tóm tắt
- Làn sóng bê bối 2002 khiến nhiều lãnh đạo bị truy tố.
- Chi tiêu xa xỉ bằng tiền công ty (Tyco) trở thành biểu tượng của lạm quyền.
- Nợ đến hạn kết hợp giảm phát là tổ hợp nguy hiểm nhất cho một công ty.
- Công bố đầy đủ, dù đau, thường tốt hơn che giấu.
- Cải cách đề xuất: tính quyền chọn thành chi phí, công bố giao dịch bán cổ phiếu nội bộ.
## 🧑‍💼 6. Bán ngay những cổ phiếu này!
### 🧑‍💼 Người bán hàng hay cố vấn?
### ⏳ "Đầu tư dài hạn luôn thắng"?
### 🏠 Trả nợ nhà thay vì vay thêm
### 📉 Bán một cách thông minh
### 📝 Tóm tắt
- Chọn cố vấn thu phí rõ ràng thay vì người hưởng hoa hồng.
- "Dài hạn luôn thắng" dựa trên giả định về thời điểm mua và việc bạn mua cả thị trường.
- Trả nợ lãi cao là khoản "đầu tư" không rủi ro.
- Bán có kỷ luật: dựa trên xếp hạng độc lập, trạng thái thị trường, bán dần.
- Các quy tắc đường trung bình động chỉ là trợ giúp tùy ý, không đảm bảo.
## 💧 7. Đưa tiền về nơi an toàn
### 💧 Quỹ thị trường tiền tệ là gì?
### 🏛️ Quỹ chỉ đầu tư trái phiếu kho bạc (Treasury-only)
### 🧾 Trái phiếu công ty không an toàn như tưởng
### 🔁 Trái phiếu chính phủ và "yếu tố ghen tị"
### 📝 Tóm tắt
- Tiền bán cổ phiếu cần chỗ cất an toàn, thanh khoản.
- Quỹ tiền tệ cho vay ngắn hạn; quỹ Treasury-only chỉ mua chứng khoán kho bạc ngắn hạn.
- Trái phiếu doanh nghiệp có thể giảm giá mạnh như cổ phiếu khi bị hạ hạng hoặc vỡ nợ.
- Lãi suất tăng làm giá trái phiếu đang lưu hành giảm; kỳ hạn dài chịu nhiều nhất.
- Kỳ hạn ngắn giảm rủi ro biến động giá.
## 🏛️ 8. Thâm hụt ngân sách phình to
### 🏛️ Ủy ban cải cách kế toán
### 🧾 Thặng dư giả, thâm hụt thật
### 4️⃣ Vì sao thủ thuật của chính phủ nguy hiểm hơn?
### 📝 Tóm tắt
- Số "thặng dư" của Bộ Tài chính khác xa số tiền chính phủ thực tế vay.
- Cơ quan liên bang ngoài ngân sách và quỹ An sinh xã hội bị tác giả ví như công ty con ngoài sổ và quỹ hưu trí của UCBS.
- Chính phủ hưởng lợi từ bong bóng nên không muốn cảnh báo.
- Thị trường làm ngơ → nguy cơ bong bóng trái phiếu.
- Thâm hụt lớn đẩy lãi suất lên, trái phiếu giảm giá, gia đình nợ nhiều bị ảnh hưởng.
## 📈 9. Bong bóng thị trường trái phiếu
### 📈 Thâm hụt lớn → lãi suất cao
### 📆 Sụp đổ trái phiếu năm 1980
### 📝 Tóm tắt
- Thâm hụt lớn buộc chính phủ trả lãi cao hơn.
- Khi mọi người cùng cần tiền mặt, lãi suất có thể tăng dù kinh tế yếu.
- Lãi suất tăng làm giá mọi loại trái phiếu giảm, kể cả trái phiếu kho bạc.
- Năm 1980 các đại lý trái phiếu gần như ngừng hoạt động và chính phủ phải can thiệp mạnh.
- Chính phủ khó "cứu" mọi người nếu chính khả năng vay của nó bị đe dọa.
## 📣 10. Bong bóng bất động sản
### 📣 Người môi giới nhà đất: luôn "mua ngay"
### 🏚️ Bong bóng nằm trong... khoản nợ
### 3️⃣ Ba giai đoạn của một cuộc suy giảm
### 🧭 Sáu bước khi bất động sản đang giảm
### 📝 Tóm tắt
- Môi giới nhà đất có thiên kiến "mua ngay".
- Bong bóng nằm trong nợ thế chấp: vốn chủ sở hữu giảm dù giá tăng.
- Suy giảm thường đi qua ba giai đoạn: thương mại → việc làm/thế chấp → nhà ở.
- Bán nhà không nhanh như bán cổ phiếu; cần hành động sớm.
- Cân nhắc theo mục đích: ở, đầu tư hay hưu trí.
## 🎯 11. Thiểu số chiến thắng
### 🎯 Hai mục tiêu: bảo vệ trước, kiếm lời sau
### 🩳 Bán khống (short selling)
### 🪞 Quỹ chỉ số đảo ngược
### 🧮 Năm bước "bảo vệ khỏi sập"
### 📝 Tóm tắt
- Ưu tiên bảo vệ, sau đó mới nghĩ tới gỡ vốn.
- Bán khống có thể lỗ không giới hạn; quỹ đảo ngược giới hạn rủi ro trong số tiền đầu tư.
- Người bán khống vẫn có vai trò: mua lại ở đáy.
- Quỹ đảo ngược giúp bù đắp khi danh mục cổ phiếu giảm.
- Số tiền bảo vệ nên lấy từ việc bán bớt cổ phiếu, không từ tiền an toàn.
## 📊 12. Đội bảo vệ thị trường
### 📊 Suy thoái 2001 chưa "dọn" xong
### 🏦 Ngân hàng trung ương mua cổ phiếu
### ⚫ Cuộc sụp đổ tháng 10/1987
### 📝 Tóm tắt
- Tamara cho rằng suy thoái chưa kết thúc vì nợ và các bong bóng chưa được dọn.
- Báo cáo bị sửa nên cô từ chức và tìm đến ủy ban CECAR.
- Ngân hàng trung ương Nhật đã mua cổ phiếu năm 2002; "Plunge Protection Team" là nhóm công tác tài chính liên cơ quan có thật.
- Crash 1987 (−22,6% một ngày) suýt làm hỏng chính cơ chế thị trường.
- Fed bơm tiền thay vì đóng cửa; LTCM 1998 là lần suýt xảy ra thứ hai.
## 🔍 13. Những rủi ro ẩn
### 🔍 Cách Tamara làm nghiên cứu
### 🎰 Long Term Capital Management (1998)
### ⚠️ Chuỗi sự kiện bất ngờ sau năm 1994
### 🧭 Hai kịch bản xấu nhất
### 📝 Tóm tắt
- Phái sinh là nghĩa vụ, một dạng nợ; tập trung và ngoài sàn khiến rủi ro hệ thống.
- LTCM cho thấy vỡ nợ của một tổ chức có thể lan dây chuyền; Fed phải can thiệp.
- Giá trị danh nghĩa phái sinh rất lớn nhưng rủi ro thực đo bằng tỷ lệ so với vốn.
- Bong bóng là cả nền kinh tế toàn cầu; cây kim là suy thoái chưa kết thúc.
- Hai kịch bản xấu nhất: ngắn nhưng xấu (ít can thiệp) và dài chập chờn (can thiệp liên tục).
## 📜 14. Giảm phát!
### 📜 Vì sao nhìn lại lịch sử
### 🇯🇵 Kịch bản B và bài học Nhật Bản
### 🎚️ Dow 1.000? Giá trị và tâm lý
### 💲 Giảm phát: lúc giá cùng rơi
### 🏦 Tín dụng cạn dần và tài sản sưu tầm
### 🧾 Linda và trái phiếu doanh nghiệp
### 🎟️ Quyền chọn bán (put option) cho người mới
### 📝 Tóm tắt
- Lịch sử đầu thế kỷ 20 cho thấy hoảng loạn nặng nề vẫn đi kèm phục hồi nhờ khu vực tư nhân.
- Hai vòng luẩn quẩn: chứng khoán–chi tiêu, và giảm phát–phá sản.
- Nhật Bản: nhà nước đỡ ngân hàng/thị trường kéo dài suy thoái nhiều năm.
- Không có đáy chắc chắn cho lợi nhuận hay chỉ số; P/E có thể co lại.
- Giảm phát làm giá bán giảm nhiều hơn chi phí nên bóp nghẹt lợi nhuận.
## 📏 15. Sự sụp đổ của các blue-chip
### 📏 Chữ viết đã hiện trên tường
### 🏦 Ngân hàng thực sự khỏe đến đâu?
### 🎲 Quân domino kế tiếp: UCBS
### ⚖️ Làn sóng kiện tụng
### 📦 Cơn bội thực hàng tồn kho
### 📝 Tóm tắt
- P/E thực tế 45 lần so với mức lịch sử 16,5: chỉ số giảm hoặc lợi nhuận tăng.
- Quỹ hưu trí doanh nghiệp có thể thiếu hụt 109–200+ tỷ USD khi cổ phiếu giảm tiếp.
- Ngân hàng "khỏe trung bình" nhưng trung bình đánh lừa, các ngân hàng lớn gần tâm chấn.
- UCBS: nợ ngắn hạn quay vòng hằng ngày; tin đồn đóng cửa nguồn vốn → vỡ nợ → thương phiếu chết.
- Kiện tụng và tồn kho "nôn ra" làm khủng hoảng tiền mặt lan rộng.
## 😓 16. Hãy chuyển tài khoản của bạn!
### 😓 "Lỗi tại hệ thống"
### 🔎 Tra cứu hồ sơ môi giới
### 🏛️ Công ty môi giới cũng có thể phá sản
### 🧯 Bảo vệ mình khỏi lời khuyên tồi
### 📝 Tóm tắt
- "Lỗi tại hệ thống" là cách môi giới tự trấn an, nhưng hệ thống bán hàng gây xung đột là thật.
- Nhà đầu tư có thể tra hồ sơ môi giới/công ty; cần thang so sánh (số vụ/triệu tài khoản).
- Đừng giao toàn quyền quản lý tài khoản cho môi giới.
- Công ty môi giới cũng có thể suy yếu; kiểm tra xếp hạng an toàn.
- Đa số công ty phân tích vẫn khuyến nghị mua/giữ cổ phiếu đến ngày phá sản.
## 🧠 17. Lời kêu gọi hành động
### 🧠 Phòng thủ xong, tính chuyện kiếm lời
### 📐 "Innumeracy": đòi hỏi sự chính xác
### 🛠️ Quy trình tín hiệu cho quỹ đảo ngược
### 🎤 Bài phát biểu của Johnston
### 📣 Những yêu cầu cải cách
### 📝 Tóm tắt
- Quỹ đảo ngược để phòng ngừa thì có thể giữ lâu; để kiếm lời thì cần quy tắc vào/ra.
- Hãy đòi hỏi sự chính xác của mọi lời dự báo và chấp nhận sai sót tất yếu.
- Quy trình hai tín hiệu (SMA 20 + MACD): cả hai "có" mua, cả hai "không" bán, lệch thì đứng yên.
- Sáu hành động của nhà đầu tư: bán, an toàn, chuyển tài khoản, bảo vệ, kiếm lời, ủng hộ cải cách.
- Cải cách cần minh bạch về lịch sử pháp lý, quy trình xếp hạng, độ an toàn tài chính; trọng tài chỉ trả chưa đến 1/4 phán quyết.
## 😵 18. Chóng mặt trên đỉnh cao
### 😵 "Chứng chóng mặt" của giới lãnh đạo
### 📞 Phố Wall xin cứu trợ
### 🏛️ Bộ trưởng Tài chính và Chủ tịch Fed
### 📄 Cuộc chạy nước rút 72 giờ
### 📝 Tóm tắt
- Các nhà lãnh đạo bị "chứng chóng mặt": biết đã leo quá cao nhưng không dám nhìn xuống.
- Dulles lo can thiệp sẽ kéo dài khủng hoảng và làm mất uy tín nhà nước.
- Trái phiếu Kho bạc giảm giá khiến Phố Wall đòi gặp Tổng thống.
- Bộ trưởng Tài chính và Chủ tịch Fed thống nhất: tránh cứu trợ trừ khi khẩn cấp; khẩn cấp phụ thuộc tâm lý đại chúng.
- Sách trắng "Crash Benefits" ra đời trong 72 giờ.
## 🧮 19. Gói cứu trợ lớn
### 🧮 Bài toán của Tổng thống
### 🍰 Bốn lớp dối trá và các vết nứt khác
### 🛑 Các công cụ bị loại và thế lưỡng nan
### 7️⃣ Kế hoạch bảy điểm của MetroBank
### 📝 Tóm tắt
- Chính phủ gần hết công cụ truyền thống: lãi suất ~0, thuế, tín dụng đã dùng.
- Chủ tịch Fed dẫn Nhật 2002 để cảnh báo mua cổ phiếu sẽ làm sập đấu giá trái phiếu chính phủ.
- Johnston nêu năm vết nứt: ngân sách, trái phiếu chính phủ, đô la, bất động sản, phái sinh.
- Thế lưỡng nan: cứu cổ phiếu hay trái phiếu chính phủ — không thể cả hai.
- Kế hoạch bảy điểm: mua trái phiếu doanh nghiệp kèm điều kiện mua lại cổ phiếu 75%.
## 🚀 20. Đợt hồi phục vĩ đại
### 🚀 Đợt hồi phục mạnh nhất lịch sử
### 💣 Cú sốc ở thị trường trái phiếu chính phủ
### 📉 Chênh lệch chất lượng (quality spread)
### 🖨️ Tạo tiền được, tạo tín dụng thì không
### 🧯 "Rủi ro, rủi ro và rủi ro chết tiệt"
### 📝 Tóm tắt
- Tin đồn mua trái phiếu doanh nghiệp tạo đợt hồi lịch sử, nhưng giá "chỉ dẫn" chỉ là hư danh khi không có giao dịch.
- Nhà đầu tư trái phiếu chính phủ bán tháo vì thấy tiền của mình bị dùng cứu doanh nghiệp.
- Chênh lệch chất lượng thu hẹp theo hướng sai: chính phủ bị kéo xuống ngang doanh nghiệp.
- Chính phủ tạo được tiền, không tạo được tín dụng hay niềm tin.
