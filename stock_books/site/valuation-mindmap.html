# 💹 Định giá đầu tư (Investment Valuation, ấn bản 2)
## 🧭 1. Giới thiệu về định giá
### 🧭 Nền tảng triết lý của định giá
### 🧱 Sáu huyền thoại về định giá
### 🎯 Vai trò của định giá
### 📝 Tóm tắt
- Giá ≠ giá trị: đầu tư lành mạnh không trả cao hơn giá trị; giá trị dựa trên dòng tiền kỳ vọng, không dựa vào “kẻ ngốc lớn hơn”.
- Định giá không khách quan, không bất biến, không chính xác tuyệt đối; phức tạp hơn không có nghĩa tốt hơn.
- Nguyên tắc tiết kiệm (parsimony): không dùng nhiều đầu vào hơn mức cần; mô hình không định giá công ty, người dùng mô hình mới định giá.
- Tin thị trường “hoài nghi thận trọng”: thị trường có thể sai nhưng tìm ra sai lầm khó; mặc định thị trường đúng khi chênh lớn.
- Quá trình định giá quan trọng ngang kết quả.
- Vai trò: quản lý danh mục (tuỳ triết lý), M&A (hiệp lực, thay đổi quản lý, thiên kiến), tài chính doanh nghiệp (quyết định → giá trị).
## 🧭 2. Các phương pháp định giá
### 🧭 Ba cách tiếp cận
### 💰 Định giá chiết khấu dòng tiền (DCF)
### ⚖️ Định giá tương đối
### 🧱 Định giá dựa trên tài sản
### 🎲 Định giá theo quyền chọn (Contingent claim)
### 📝 Tóm tắt
- Ba cách tiếp cận: DCF, định giá tương đối, quyền chọn; DCF là nền tảng cho hai cách còn lại.
- DCF: Value = Σ CF/(1+r)^t; ba lối: vốn chủ sở hữu (chiết khấu bằng k_e), doanh nghiệp (WACC), APV.
- Luôn khớp dòng tiền với tỷ suất chiết khấu: CF sau lãi vay ↔ k_e; CF trước lãi vay ↔ WACC.
- Mô hình lợi nhuận vượt trội cho cùng giá trị nhưng nhấn mạnh chỉ phần vượt yêu cầu tạo giá trị.
- DCF khó với công ty khó khăn, chu kỳ, tài sản chưa dùng, bằng sáng chế, tái cấu trúc, mua lại, công ty tư nhân – cần điều chỉnh.
- Định giá tương đối đơn giản nhưng dễ thiên kiến; định giá quyền chọn dùng cho tài sản có tính “có điều kiện” (5 biến Black–Scholes).
## ❓ 3. Hiểu báo cáo tài chính
### ❓ Bốn câu hỏi và ba báo cáo
### 🏭 Đo lường tài sản: ba nguyên tắc kế toán
### 🏦 Đo lường cơ cấu tài trợ
### 📈 Đo lường lợi nhuận và khả năng sinh lời
### ⚠️ Đo lường rủi ro theo kế toán
### 🌍 Khác biệt chuẩn mực kế toán giữa các nước
### 📝 Tóm tắt
- Kế toán ưu tiên giá trị sổ sách, nghi ngờ thị giá và thận trọng (ước tính thấp); định giá cần giá trị hiện tại và tương lai.
- Tài sản vô hình tự tạo (R&D, thương hiệu) không có trên bảng cân đối; thuê hoạt động không phải nợ trên sổ — cả hai cần điều chỉnh.
- Nợ và vốn chủ ghi theo chi phí lịch sử; giá trị sổ sách vốn chủ có thể chênh rất lớn so với thị giá.
- Lợi nhuận: dồn tích + phân loại chi phí; R&D và thuê hoạt động bị phân loại sai.
- ROC = biên × vòng quay; ROE = ROC + D/E[ROC − i(1−t)].
- Rủi ro kế toán chỉ đo khả năng vỡ nợ, tĩnh; tỷ số thanh khoản, thanh toán lãi, nợ/vốn.
## ☯️ 4. Cơ bản về rủi ro
### ☯️ Rủi ro là gì?
### 🧺 Rủi ro đa dạng hoá được và không đa dạng hoá được
### 📐 Mô hình đo rủi ro thị trường
### 💳 Rủi ro vỡ nợ và xếp hạng tín nhiệm
### 📝 Tóm tắt
- Rủi ro = độ lệch giữa lợi nhuận thực và kỳ vọng (cả tốt và xấu), đo từ góc nhìn nhà đầu tư cận biên đa dạng hoá.
- Rủi ro đặc thù công ty có thể đa dạng hoá; chỉ rủi ro thị trường được định giá.
- CAPM: E(R) = R_f + β[E(R_m) − R_f]; APM/đa nhân tố dùng nhiều beta; mô hình proxy dùng đặc điểm như quy mô, BV/MV.
- CAPM vẫn là mặc định trong thực tế dù bị chỉ trích; mô hình phức tạp hơn gặp sai số ước tính.
- Rủi ro vỡ nợ đo qua xếp hạng; BBB trở lên là investment grade; tỷ số tài chính giải thích xếp hạng.
## 🛡️ 7. Lãi suất phi rủi ro và phần bù rủi ro
### 🛡️ Lãi suất phi rủi ro
### 📊 Phần bù rủi ro vốn chủ sở hữu: cách tiếp cận lịch sử
### 🌎 Phần bù rủi ro quốc gia
### 🔍 Phần bù rủi ro hàm ý (Implied ERP)
### 💳 Chênh lệch lãi suất vỡ nợ (Default spread)
### 📝 Tóm tắt
- Lãi suất phi rủi ro lý tưởng là zero-coupon chính phủ khớp thời điểm dòng tiền; thực tế dùng trái phiếu chính phủ dài hạn khớp duration, cùng đồng tiền và cùng loại (thực/danh nghĩa) với dòng tiền.
- Phần bù lịch sử phụ thuộc kỳ, tài sản phi rủi ro, số học/hình học; sai số lớn, chỉ đáng tin ở kỳ rất dài (5,51% hình học 1928–2000 so với trái phiếu).
- Thị trường mới nổi: phần bù = phần bù thị trường trưởng thành + phần bù quốc gia (default spread; σ tương đối; spread × σ cổ phiếu/σ trái phiếu) × λ.
- Phần bù hàm ý giải ngược từ giá thị trường; biến động theo thời gian, thấp hơn phần bù lịch sử.
- Default spread ước tính từ mẫu trái phiếu, tăng theo kỳ hạn và khi suy thoái.
## 📈 8. Ước tính tham số rủi ro và chi phí tài trợ
### 📈 Beta hồi quy (lịch sử)
### 🏗️ Beta nền tảng: ba yếu tố quyết định
### 🧱 Beta bottom-up (từ dưới lên) — cách được ưa chuộng
### 📒 Beta kế toán và chọn phương pháp
### 💰 Từ beta đến chi phí vốn chủ sở hữu
### 🏦 Chi phí nợ
### 🧬 Chứng khoán lai: cổ phiếu ưu đãi, trái phiếu chuyển đổi
### ⚖️ Trọng số: nợ là gì, giá thị trường hay sổ sách?
### 🧮 Chi phí vốn bình quân gia quyền (WACC)
### 📝 Tóm tắt
- Beta hồi quy: độ dốc của lợi nhuận cổ phiếu theo thị trường; alpha Jensen, R² và sai số chuẩn kèm theo; nhạy với kỳ, khoảng, chỉ số và dễ nhiễu.
- Beta nền tảng phụ thuộc loại hình kinh doanh, đòn bẩy hoạt động và đòn bẩy tài chính: β_L = β_u × [1 + (1 − t) D/E].
- Beta bottom-up (bình quân các công ty cùng ngành, gỡ rồi lắp đòn bẩy) vượt trội: SE nhỏ, theo kịp thay đổi cơ cấu, dùng được cho công ty tư nhân.
- Chi phí vốn CSH = R_f + β×ERP (+ λ×CRP với thị trường mới nổi).
- Chi phí nợ = (R_f + spread) × (1 − thuế biên); không xếp hạng thì dùng xếp hạng tổng hợp theo bảo chi lãi vay.
- Vốn hoá thuê hoạt động thành nợ, dùng giá trị thị trường làm trọng số; WACC của Boeing 9,49%.
